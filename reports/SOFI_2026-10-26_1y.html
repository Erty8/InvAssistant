    var sign = num < 0 ? "-" : "";
    var abs = Math.abs(num);
    var scaled = abs, suffix = "";
    if (abs >= 1e12) { scaled = abs / 1e12; suffix = "T"; }
    else if (abs >= 1e9) { scaled = abs / 1e9; suffix = "B"; }
    else if (abs >= 1e6) { scaled = abs / 1e6; suffix = "M"; }
    else if (abs >= 1e3) { scaled = abs / 1e3; suffix = "K"; }
    return sign + "$" + scaled.toFixed(1) + suffix;
  }

  // Renders a decimal fraction as a percentage in the English number-then-%
  // convention (0.481 -> "48.1%"); used by every prose sentence this
  // template builds itself. fmtPct/fmtRawPct above serve the same
  // convention for their own (non-prose) call sites.
  function fmtPctTr(v, decimals) {
    if (!isNum(v)) return "—";
    var pct = Number(v) * 100;
    var d = decimals === undefined ? 1 : decimals;
    return pct.toFixed(d) + "%";
  }

  // Same number-then-% convention as fmtPctTr, but for a value that is
  // ALREADY a percentage (not a decimal fraction) and needs an explicit
  // +/- sign -- used for the history screen's "vs. last analysis" delta.
  function fmtSignedPctTr(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "+";
    return sign + Math.abs(num).toFixed(1) + "%";
  }

  // growth/discount_rate/note arrive as ready-made, human-readable strings
  // (e.g. "8% growth") from every provider -- never reformat or translate
  // them, just guard against missing values.
  function safeText(v) {
    return v === null || v === undefined || v === "" ? "—" : String(v);
  }

  function hexToRgba(hex, alpha) {
    var h = hex.replace("#", "");
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
  }

  // Maps a verdict/label string onto one of four color buckets. Order
  // matters: the "HIGH EXPECTATIONS" (hyper-grower) check runs before the red
  // check so its distinct caution styling is never swallowed by a
  // coincidental substring match, red-bucket keywords are checked before
  // falling back to amber, so e.g. "OVERBOUGHT" (contains "BUY"... no, but
  // mirrors the same ordering concern) is never mistaken for something else,
  // and unrecognized/empty text defaults to the neutral amber bucket.
  // CHEAP/OVERSOLD/ALIGNED -> green, FAIR/NEUTRAL/PARTIAL -> amber,
  // HIGH EXPECTATIONS PRICED IN -> caution (distinct amber/orange),
  // EXPENSIVE/OVERBOUGHT/MISALIGNED -> red.
  function bucketColor(text) {
    if (!text) return "amber";
    var s = String(text).toUpperCase();
    if (s.indexOf("CHEAP") !== -1 || s.indexOf("OVERSOLD") !== -1 || s.indexOf("ALIGNED") !== -1) return "green";
    if (s.indexOf("HIGH EXPECTATIONS") !== -1) return "caution";
    if (s.indexOf("EXPENSIVE") !== -1 || s.indexOf("OVERBOUGHT") !== -1 || s.indexOf("MISALIGNED") !== -1) return "red";
    return "amber";
  }

  // Confidence-badge color: HIGH -> green, MEDIUM -> amber, LOW -> red.
  function confidenceColor(text) {
    if (!text) return "amber";
    var s = String(text).toUpperCase();
    if (s.indexOf("HIGH") !== -1) return "green";
    if (s.indexOf("LOW") !== -1) return "red";
    return "amber";
  }

  // ---- Overview-mode colour mappings (mode: "overview") -------------------
  // Distinct from bucketColor() above: that one defaults an unrecognized
  // verdict to amber (a neutral "fair" reading), which is wrong for the
  // overview table's "Verdict" column -- a long outlier label like "MODEL-
  // PRICE DIVERGENCE" is not a fair-value claim at all, so it must fall back
  // to muted, not amber (see sec_analyzer/screener/overview.py's
  // fundamental_verdict values).
  function overviewVerdictColor(v) {
    var s = String(v || "").toUpperCase();
    if (s.indexOf("CHEAP") !== -1) return "green";
    if (s.indexOf("EXPENSIVE") !== -1) return "red";
    if (s.indexOf("FAIR") !== -1) return "amber";
    return "muted";
  }

  // Exact-match against overview.py's _INSIDER_VALUES ("STRONG BUY", "BUY",
  // "NEUTRAL", "SELL", "HEAVY SELLING") -- an unrecognized/missing value (the
  // "unknown" catch-all) falls back to muted.
  function overviewInsiderColor(v) {
    if (v === "STRONG BUY" || v === "BUY") return "green";
    if (v === "SELL" || v === "HEAVY SELLING") return "red";
    if (v === "NEUTRAL") return "amber";
    return "muted";
  }

  var OV_BUCKET_COLOR = { cheap: "green", fair: "amber", expensive: "red" };
  var OV_BUCKET_LABEL = { cheap: "Cheap", fair: "Fair", expensive: "Expensive", unknown: "Unknown" };
  function overviewBucketColor(b) { return OV_BUCKET_COLOR[b] || "muted"; }
  function overviewBucketLabel(b) { return OV_BUCKET_LABEL[b] || "Unknown"; }

  var GAUGE_POSITION = { green: 10, amber: 50, caution: 72, red: 90 };
  var SCENARIO_LABEL = { bear: "BEAR", base: "BASE", bull: "BULL" };
  var SCENARIO_ORDER = ["bull", "base", "bear"];
  var SCENARIO_HEX = { bear: "#ffb4ab", base: "#5aa7ff", bull: "#4de082" };
  // Chrome-level labels for the raw triangulation signal codes
  // (valuation.triangulation.signals -- lowercase internal codes, not
  // free-text meant for direct display).
  var SIGNAL_LABEL = { cheap: "CHEAP", fair: "FAIR", high_expectations: "HIGH EXP", expensive: "EXPENSIVE", mixed: "MIXED", no_data: "NO DATA" };
  var HORIZON_SHORT = { "3m": "3M", "1y": "1Y", "5y": "5Y" };
  // Calendar-day windows the price chart slices its (up-to-5y) series by for
  // each range, and the year counts used to annualize the "if price converges
  // to this scenario by the horizon end" expected return.
  var HORIZON_DAYS = { "3m": 95, "1y": 370, "5y": 2000 };
  var HORIZON_YEARS = { "3m": 0.25, "1y": 1, "5y": 5 };

  function signalLabel(s) {
    if (!s) return "—";
    return SIGNAL_LABEL[String(s).toLowerCase()] || String(s).toUpperCase();
  }

  function horizonLabel(v) {
    return HORIZON_SHORT[v] || String(v || "—").toUpperCase();
  }

  // -------------------------------------------------------------------
  // Shared horizon-toggle pill row. `values` is the ordered list of
  // horizon codes to show (defaults to the standard three); `interactive`
  // wires a click handler that calls `onSelect(value)` -- used by the
  // search-mode nav control, while the header's own toggle is a plain
  // read-only indicator of which horizon the current report reflects.
  // -------------------------------------------------------------------
  function horizonToggleHtml(values, current, interactive, idAttr) {
    var pills = (values || ["3m", "1y", "5y"]).map(function (v) {
      var active = v === current ? " active" : "";
      return '<button type="button" class="horizon-pill' + active + '" data-horizon="' +
        escapeHtml(v) + '">' + escapeHtml(horizonLabel(v)) + '</button>';
    }).join("");
    var idHtml = idAttr ? ' id="' + idAttr + '"' : "";
    return '<div class="horizon-toggle' + (interactive ? " interactive" : "") + '"' + idHtml + '>' + pills + '</div>';
  }

  // ===================================================================
  // Section builders -- shared by both modes via renderBody().
  // ===================================================================

  // ---- Analyst consensus reference row (display-only cross-check) --------
  // Purely informational -- shows a third-party price-target consensus
  // (e.g. yfinance) next to the current price. This is NEVER the model's own
  // fair value; kept visually subordinate (small, muted caption explaining
  // its source) so it can't be mistaken for the verdict. Renders "" whenever
  // payload.analyst is absent/null or lacks a usable target_mean, so older
  // payloads without this key render byte-identical to before.
  function analystRowHtml(payload) {
    var a = payload && payload.analyst;
    if (!a || !isNum(a.target_mean)) return "";

    var meanText = fmtMoney(a.target_mean);

    var upsideHtml = "";
    if (isNum(payload.price) && Number(payload.price) > 0) {
      var upsidePct = (Number(a.target_mean) / Number(payload.price) - 1) * 100;
      var upsideCls = upsidePct >= 0 ? "ac-up" : "ac-down";
      upsideHtml = ' <span class="' + upsideCls + '">(' + fmtSignedPct(upsidePct) + ')</span>';
    }

    var countHtml = isNum(a.num_analysts)
      ? ' <span class="ac-count">(' + Math.round(Number(a.num_analysts)) + ' analysts)</span>'
      : "";

    var rangeHtml = (isNum(a.target_low) && isNum(a.target_high))
      ? ' <span class="ac-range">· range ' + fmtMoney(a.target_low) + '–' + fmtMoney(a.target_high) + '</span>'
      : "";

    var sourceText = a.source ? escapeHtml(String(a.source)) : "yfinance / analyst consensus";

    return (
      '<div class="analyst-consensus">' +
        '<span class="ac-label">Analyst Target (consensus):</span>' +
        '<span class="ac-mean">' + meanText + '</span> <span class="muted">avg</span>' +
        upsideHtml + countHtml + rangeHtml +
        '<div class="ac-caption">External source: ' + sourceText +
          ' — this is NOT the model\'s own fair value; it is an external reference for comparison only.</div>' +
      '</div>'
    );
  }

  // Daily price change chip shown next to the header price. Reads the
  // first-class `change_1d_pct` off the technical payload; renders "" when
  // absent (older payloads / no price history) so nothing breaks.
  function dailyChangeHtml(payload) {
    var t = payload && payload.technical;
    if (!t || !isNum(t.change_1d_pct)) return "";
    var pct = Number(t.change_1d_pct);
    var cls = pct > 0 ? "chg-up" : (pct < 0 ? "chg-down" : "chg-flat");
    var arrow = pct > 0 ? "▲" : (pct < 0 ? "▼" : "•");
    return '<span class="price-change ' + cls + '">' + arrow + ' ' + fmtSignedPct(pct) + '</span>';
  }

  // ---- Header card ------------------------------------------------------
  function headerCardHtml(payload) {
    var priceText = fmtMoney(payload.price);
    // macro_asof (SPEC.md as-of mode) carries which macro-input vintage (ERP,
    // risk-free rate) fed the valuation when the run is point-in-time; only
    // present on result.valuation, so this degrades to "" for every older/
    // live payload without it.
    var macroAsof = ((payload.result || {}).valuation || {}).macro_asof;
    var macroNote = (macroAsof && (macroAsof.erp_source || macroAsof.risk_free_source))
      ? " · Macro: ERP " + escapeHtml(macroAsof.erp_source || "—") +
        ", risk-free rate " + escapeHtml(macroAsof.risk_free_source || "—")
      : "";
    // Name the price source actually used. It was hardcoded to "Stooq", which
    // silently mislabelled every yfinance run even before the Stooq path was
    // removed altogether; a "stale-cache(...)" source additionally means the
    // upstream was down and the price is known to be out of date, which the
    // reader must see.
    // Whether the bytes came from disk is the reader's business only when the
    // cache is STALE (upstream down); otherwise the "as of" date already
    // conveys freshness, so the cache wrapper is unwrapped for display.
    var rawSource = payload.price_source || "yfinance";
    var isStale = /^stale-cache/.test(rawSource);
    var upstream = (rawSource.match(/\(([^)]+)\)/) || [null, rawSource])[1];
    // "unknown" is what a cache written before source markers existed reports.
    var priceSource = upstream === "unknown" ? "no source recorded" : upstream;
    var staleWarning = isStale
      ? ' <span class="bs-neg">⚠ price sources unreachable, used a stale cached price</span>'
      : "";
    // Sources whose closes are split-adjusted but NOT dividend-adjusted are
    // used for technicals only; the valuation layer is handed no price frame
    // at all (see prices.is_total_return_basis), so the reader must be told
    // why the historical-multiples section is empty rather than guessing.
    var TOTAL_RETURN_SOURCES = ["yfinance", "yahoo-chart"];
    var basisWarning = (upstream && upstream !== "unknown" &&
                        TOTAL_RETURN_SOURCES.indexOf(upstream) === -1)
      ? ' <span class="bs-neg">⚠ fallback price source: no dividend adjustment, ' +
        'historical multiple percentiles not computed (technical indicators unaffected)</span>'
      : "";
    var sourceNote = "SEC EDGAR + " + escapeHtml(priceSource) +
      (payload.as_of ? " · as of " + escapeHtml(payload.as_of) : "") + macroNote +
      staleWarning + basisWarning;
    var entityHtml = payload.entity_name
      ? '<span class="entity-name">' + escapeHtml(payload.entity_name) + '</span>'
      : "";
    return (
      '<div class="card">' +
        '<div class="header-row">' +
          '<div class="header-left">' +
            '<div class="ticker-line">' +
              '<span class="ticker">' + escapeHtml(payload.ticker || "—") + '</span>' +
              entityHtml +
            '</div>' +
            '<div class="source-note">' + sourceNote + '</div>' +
          '</div>' +
          '<div class="header-right">' +
            '<div class="price-value">' + priceText + dailyChangeHtml(payload) + '</div>' +
          '</div>' +
        '</div>' +
        analystRowHtml(payload) +
      '</div>'
    );
  }

  // ---- Signal-weight bar --------------------------------------------------
  function weightBarHtml(weights) {
    var w = weights || {};
    var f = typeof w.fundamental === "number" ? w.fundamental : 0.5;
    var t = typeof w.technical === "number" ? w.technical : 0.5;
    var fPct = Math.round(f * 100);
    var tPct = Math.round(t * 100);
    return (
      '<div class="weight-bar">' +
        '<div class="weight-seg weight-fundamental" style="width:' + fPct + '%;">FUNDAMENTAL ' + fPct + '%</div>' +
        '<div class="weight-seg weight-technical" style="width:' + tPct + '%;">TECHNICAL ' + tPct + '%</div>' +
      '</div>'
    );
  }

  // ---- Fair-value fan chart ------------------------------------------------
  // Horizontal-ruler price scale per scenario band: min(bear.lo, price)*0.95
  // .. max(bull.hi, price)*1.05, falling back to whatever numeric values
  // *are* available when bear/bull/price are partially missing, so the
  // chart still renders something useful rather than an all-or-nothing
  // empty state.
  function computeFanScale(fv, price) {
    var bear = fv.bear || {}, bull = fv.bull || {}, base = fv.base || {};
    var bearLo = isNum(bear.lo) ? Number(bear.lo) : null;
    var bullHi = isNum(bull.hi) ? Number(bull.hi) : null;
    var p = isNum(price) ? Number(price) : null;
    var fallback = [bearLo, bullHi, p, base.lo, base.hi, bear.hi, bull.lo]
      .map(function (v) { return isNum(v) ? Number(v) : null; })
      .filter(function (v) { return v !== null; });
    if (fallback.length === 0) return null;

    var lowAnchor = (bearLo !== null && p !== null) ? Math.min(bearLo, p) :
      (bearLo !== null ? bearLo : (p !== null ? p : Math.min.apply(null, fallback)));
    var highAnchor = (bullHi !== null && p !== null) ? Math.max(bullHi, p) :
      (bullHi !== null ? bullHi : (p !== null ? p : Math.max.apply(null, fallback)));

    var minV = lowAnchor * 0.95;
    var maxV = highAnchor * 1.05;
    if (minV > maxV) { var t = minV; minV = maxV; maxV = t; }
    if (minV === maxV) {
      var bump = Math.max(1, Math.abs(minV) * 0.1);
      minV -= bump;
      maxV += bump;
    }
    return { minV: minV, maxV: maxV };
  }

  // ---- Hyper-grower "What the price implies" + expected-value note (Milestone E) --
  // Only rendered when valuation.hyper_growth is true; every existing
  // non-hyper render path is unaffected since this returns "" otherwise.
  // Degrades through the three tiers HYPER_SPEC.md Sec.6 describes,
  // depending on which implied fields the engine's reverse bisection
  // managed to solve for (it can fail to converge for either growth or
  // margin independently) -- never renders "None"/"NaN".
  // ---- Maintenance/growth CapEx normalization sub-block (SPEC.md Sec.3.6) --
  // Shared by the hyper-grower and mid-growth revenue-first extras below --
  // both read a `capex_normalization` dict (or null/absent) off their own
  // detail object with the exact same shape, so the rendering only needs to
  // exist once. Renders "" when the split wasn't applied (null/falsy
  // `.applied`), which is the common case (most filers aren't capex-heavy
  // enough to trigger the gate in engine._maintenance_adjusted_margin).
  function capexNormalizationHtml(capexNorm) {
    if (!capexNorm || !capexNorm.applied) return "";
    var intensityText = fmtPctTr(capexNorm.capex_intensity);
    var rawText = fmtPctTr(capexNorm.raw_current_margin);
    var opsText = fmtPctTr(capexNorm.ops_current_margin);
    var upsideText = isNum(capexNorm.upside_per_share) ? fmtMoney(capexNorm.upside_per_share) : "—";
    var noteText = "CapEx-heavy aggressive UPSIDE SCENARIO (NOT THE HEADLINE): once growth CapEx is " +
      "separated from maintenance CapEx (D&A, floored at 5% of revenue), the starting FCF margin goes " +
      "from raw " + rawText + " to " + opsText + " (CapEx/revenue intensity " + intensityText + "). Under this " +
      "optimistic scenario, the base fair value is " + upsideText + "/share. The headline DCF is computed " +
      "with today's actual (unadjusted) cash flow and is suppressed; this upside scenario is skewed " +
      "upward because it grows revenue without fully reflecting the CapEx that funds it -- weigh it with caution.";
    return '<div class="capex-note">' + escapeHtml(noteText) + '</div>';
  }

  // Model <-> market divergence block (triangulate.py governor, action="verdict"):
  // when the base fair-value band sits >2x above price, the three method votes
  // aren't independent confirmation -- they read off ONE assumption set. Show,
  // side by side, what the model assumes vs what today's price implies for the
  // three reverse-lens levers, so the divergence is concrete. Only rendered for
  // hyper-growers (the implied values live in hyper_growth_detail.implied).
  function divergenceHtml(valuation) {
    var tri = (valuation && valuation.triangulation) || {};
    var div = tri.divergence;
    if (!div || div.action !== "verdict") return "";
    var detail = (valuation && valuation.hyper_growth_detail) || {};
    var implied = detail.implied || {};
    var base = (detail.scenarios || {}).base || {};

    function row(label, modelText, marketVal) {
      if (!isNum(marketVal)) return "";
      return '<tr><td>' + escapeHtml(label) + '</td>' +
        '<td class="divergence-model">' + escapeHtml(modelText) + '</td>' +
        '<td class="divergence-market">' + fmtPctTr(marketVal) + '</td></tr>';
    }
    var rows = "";
    rows += row("Starting growth", isNum(base.start_growth) ? fmtPctTr(base.start_growth) : "—", implied.growth);
    rows += row("Mature FCF margin", isNum(base.target_fcf_margin) ? fmtPctTr(base.target_fcf_margin) : "—", implied.steady_state_margin);
    var modelDr = isNum(detail.base_discount_rate)
      ? (fmtPctTr(detail.base_discount_rate) +
         (isNum(detail.mature_discount_rate) ? " → " + fmtPctTr(detail.mature_discount_rate) : ""))
      : "—";
    rows += row("Discount rate", modelDr, implied.discount_rate);
    if (!rows) return "";

    return (
      '<div class="divergence-box">' +
        '<div class="divergence-title">MODEL-PRICE DIVERGENCE</div>' +
        '<table class="divergence-table">' +
          '<thead><tr><th>Assumption</th><th>Model</th><th>Market is pricing</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        '<div class="divergence-referee">All three methods draw on the same growth/margin assumption, ' +
          'so their agreement is not independent confirmation. The model is pricing continued growth; ' +
          'the market is pricing an end to it -- the referee is the actual growth realized over the coming quarters.</div>' +
      '</div>'
    );
  }

  function hyperGrowthExtraHtml(valuation) {
    if (!valuation || !valuation.hyper_growth) return "";
    var detail = valuation.hyper_growth_detail || {};
    if (detail.suppressed) {
      var suppressedReason = detail.suppressed_reason ||
        "Revenue-first DCF could not produce a reliable value for this company; DCF was disabled.";
      // Capex-heavy names are always suppressed for the headline but still
      // carry an aggressive capex-normalized upside -- render it here too.
      return (
        '<div class="hyper-note">' +
          '<div class="hyper-implied-line">' + escapeHtml(suppressedReason) + '</div>' +
          capexNormalizationHtml(detail.capex_normalization) +
        '</div>'
      );
    }
    var implied = detail.implied || {};
    var impliedText;
    if (isNum(implied.growth) && isNum(implied.revenue_10y)) {
      var revText = fmtCompactMoney(implied.revenue_10y);
      var multText = isNum(implied.revenue_multiple) ? Number(implied.revenue_multiple).toFixed(1) : "—";
      impliedText = "What the price implies: " + revText + " revenue in 10 years (" + multText + "x today's), ~" +
        fmtPctTr(implied.growth) + " growth, " + fmtPctTr(implied.steady_state_margin) + " mature FCF margin";
      if (isNum(implied.tam_share)) {
        impliedText += " = " + fmtPctTr(implied.tam_share) + " of TAM";
      }
    } else if (isNum(implied.steady_state_margin)) {
      impliedText = "What the price implies: even at 40% growth, requires ~" + fmtPctTr(implied.steady_state_margin) +
        " mature FCF margin (well above the reasonable growth range)";
    } else {
      impliedText = "The price implies an expectation clearly outside the reasonable growth range.";
    }

    var evHtml = isNum(detail.expected_value)
      ? '<div class="hyper-ev-line">Probability-weighted expected value: ' + fmtMoney(detail.expected_value) + '</div>'
      : "";
    var capexHtml = capexNormalizationHtml(detail.capex_normalization);

    return (
      divergenceHtml(valuation) +
      '<div class="hyper-note">' +
        '<div class="hyper-implied-line">' + escapeHtml(impliedText) + '</div>' +
        evHtml +
        capexHtml +
      '</div>'
    );
  }

  // ---- Mid-growth (12-20%) loss-making revenue-first DCF extra (SPEC.md --
  // Sec.8d) -- mirrors hyperGrowthExtraHtml's structure/guard pattern for
  // the sibling revenue-first headline that sits between the mature
  // (Sec.8b) and hyper-grower (Sec.3) paths. Only rendered when
  // valuation.midgrowth_revenue_headline is true; every other render path
  // is unaffected since this returns "" otherwise.
  function midgrowthRevenueExtraHtml(valuation) {
    if (!valuation || !valuation.midgrowth_revenue_headline) return "";
    var detail = valuation.midgrowth_revenue_detail || {};
    if (detail.suppressed) {
      var suppressedReason = detail.suppressed_reason ||
        "Mid-growth revenue-based DCF could not produce a reliable value for this company; DCF was disabled.";
      return (
        '<div class="hyper-note">' +
          '<div class="hyper-implied-line">' + escapeHtml(suppressedReason) + '</div>' +
        '</div>'
      );
    }
    var scenarios = detail.scenarios || {};
    var base = scenarios.base || {};
    var startGrowthText = fmtPctTr(detail.start_growth);
    var targetMarginText = fmtPctTr(detail.target_margin_base);
    var fadeText = isNum(detail.steady_state_year) ? Number(detail.steady_state_year) + " years" : "—";
    var basePerShareText = fmtMoney(base.per_share);

    var headlineText = "Mid-growth (12-20%) revenue-based DCF: realized growth " + startGrowthText +
      ", target mature FCF margin " + targetMarginText + ", maturing within " + fadeText + "; " +
      "base-scenario per-share value " + basePerShareText;

    var capexHtml = capexNormalizationHtml(detail.capex_normalization);

    return (
      '<div class="hyper-note">' +
        '<div class="hyper-implied-line">' + escapeHtml(headlineText) + '</div>' +
        capexHtml +
      '</div>'
    );
  }

  function fanChartCardHtml(result, price) {
    var fv = result.fair_value_range || {};
    var scale = computeFanScale(fv, price);
    var innerHtml;
    if (!scale) {
      innerHtml = '<div class="fan-empty muted">Not enough data for a valuation scenario.</div>';
    } else {
      var minV = scale.minV, maxV = scale.maxV;
      var span = (maxV - minV) || 1;
      var pctOf = function (v) { return ((v - minV) / span) * 100; };

      var labelsHtml = SCENARIO_ORDER.map(function (k) {
        return "<span>" + SCENARIO_LABEL[k] + "</span>";
      }).join("");

      var EDGE_THRESHOLD_PCT = 12;

      var rowsHtml = SCENARIO_ORDER.map(function (key) {
        var b = fv[key];
        var bandHtml = "";
        if (b && isNum(b.lo) && isNum(b.hi)) {
          var left = pctOf(Number(b.lo));
          var right = pctOf(Number(b.hi));
          var width = Math.max(0.6, right - left);
          var hex = SCENARIO_HEX[key];

          var loInside = left < EDGE_THRESHOLD_PCT;
          var hiInside = (100 - right) < EDGE_THRESHOLD_PCT;
          var loValHtml =
            '<span class="fan-val fan-val-lo ' + (loInside ? "fan-val-inside" : "fan-val-outside") + '">' +
              fmtMoney(b.lo) +
            '</span>';
          var hiValHtml =
            '<span class="fan-val fan-val-hi ' + (hiInside ? "fan-val-inside" : "fan-val-outside") + '">' +
              fmtMoney(b.hi) +
            '</span>';

          bandHtml =
            '<div class="fan-band" style="left:' + left + '%; width:' + width + '%; ' +
            'background:' + hexToRgba(hex, 0.35) + '; border-color:' + hex + ';">' +
              loValHtml + hiValHtml +
            '</div>';
        }
        return '<div class="fan-row-track" data-scenario="' + key + '">' + bandHtml + '</div>';
      }).join("");

      var markerHtml = "";
      if (isNum(price)) {
        var markerLeft = Math.min(99, Math.max(0, pctOf(Number(price))));
        markerHtml =
          '<div class="fan-marker" style="left:' + markerLeft + '%;">' +
            '<span class="fan-marker-price">▼ ' + fmtMoney(price) + '</span>' +
            '<span class="fan-marker-arrow">▼</span>' +
          '</div>';
      }

      innerHtml =
        '<div class="fan-outer">' +
          '<div class="fan-labels">' + labelsHtml + '</div>' +
          '<div class="fan-plot">' + rowsHtml + markerHtml + '</div>' +
        '</div>' +
        '<div class="fan-ticks">' +
          '<span>' + fmtMoney(minV) + '</span>' +
          '<span>' + fmtMoney((minV + maxV) / 2) + '</span>' +
          '<span>' + fmtMoney(maxV) + '</span>' +
        '</div>' +
        '<div class="assumption-strip" id="assumption-strip">' +
          '<div class="assum-col"><div class="assum-label">Scenario</div><div class="assum-value" id="assum-scenario">—</div></div>' +
          '<div class="assum-col"><div class="assum-label">Growth</div><div class="assum-value" id="assum-growth">—</div></div>' +
          '<div class="assum-col"><div class="assum-label">Discount</div><div class="assum-value" id="assum-discount">—</div></div>' +
          '<div class="assum-col assum-rationale"><div class="assum-label">Rationale</div><div class="assum-value" id="assum-rationale">—</div></div>' +
        '</div>';
    }
    innerHtml += hyperGrowthExtraHtml(result.valuation);
    innerHtml += midgrowthRevenueExtraHtml(result.valuation);
    return '<div class="card"><div class="card-title">Valuation Scenarios</div>' + innerHtml + '</div>';
  }

  // Updates the assumption strip's four cells for one scenario key
  // (bear/base/bull) and highlights the matching fan row -- called once on
  // initial render (defaulting to "base") and again on every row click.
  function selectFanScenario(fv, key, scenarioReturns) {
    var rows = bodyEl.querySelectorAll(".fan-row-track");
    rows.forEach(function (r) {
      r.classList.toggle("selected", r.getAttribute("data-scenario") === key);
    });
    var b = (fv || {})[key] || {};
    var scenarioEl = document.getElementById("assum-scenario");
    var growthEl = document.getElementById("assum-growth");
    var discountEl = document.getElementById("assum-discount");
    var rationaleEl = document.getElementById("assum-rationale");
    if (!scenarioEl) return;
    scenarioEl.textContent = SCENARIO_LABEL[key] || String(key || "—").toUpperCase();
    growthEl.textContent = safeText(b.growth);
    discountEl.textContent = safeText(b.discount_rate);
    var ret = (scenarioReturns || {})[key];
    var rationale = safeText(b.note);
    if (ret && (isNum(ret.ret_lo_pct) || isNum(ret.ret_hi_pct))) {
      var retText = "Return " + fmtSignedPct(ret.ret_lo_pct) + " to " + fmtSignedPct(ret.ret_hi_pct);
      rationale = rationale === "—" ? retText : rationale + " · " + retText;
    }
    rationaleEl.textContent = rationale;
  }

  function wireFanChart(fv, scenarioReturns) {
    var rows = bodyEl.querySelectorAll(".fan-row-track");
    if (rows.length === 0) return;
    rows.forEach(function (r) {
      r.addEventListener("click", function () {
        selectFanScenario(fv, r.getAttribute("data-scenario"), scenarioReturns);
      });
    });
    selectFanScenario(fv, "base", scenarioReturns);
  }

  // ---- Triangulation card ---------------------------------------------
  // Only rendered when result.valuation.triangulation is present; older/
  // simpler result dicts simply skip this card.

  // Badge color for one method's OWN signal (independent of consensus):
  // cheap -> green, fair -> amber, high_expectations -> caution, expensive ->
  // red, no_data/unknown -> muted (no-data is not a point on the
  // cheap<->expensive spectrum, so it gets a neutral bucket, not amber).
  function signalBadgeColor(sig) {
    var s = sig ? String(sig).toLowerCase() : "";
    if (s === "cheap") return "green";
    if (s === "fair") return "amber";
    if (s === "high_expectations") return "caution";
    if (s === "expensive") return "red";
    if (s === "mixed") return "caution";
    return "muted";
  }

  // Agreement-marker kind for one method against the overall consensus
  // direction. Deliberately distinguishes "no consensus" from "this method
  // dissents": a no_data method, or any method when tri.direction is
  // "uncertain" (no real consensus), gets a neutral "muted" marker rather
  // than a red X -- showing X on every method when there simply isn't an
  // agreed direction reads as "all methods are wrong", which is false.
  function triAgreementKind(sig, direction) {
    var s = sig ? String(sig).toLowerCase() : "";
    if (!s || s === "no_data") return "muted";
    // "mixed" is an ambiguity, not a dissent-against-consensus: show it
    // neutral rather than a red ✗ (the raw multiple and its growth-adjusted
    // counterpart simply point different ways).
    if (s === "mixed") return "muted";
    var dir = direction ? String(direction).toLowerCase() : "";
    if (!dir || dir === "uncertain") return "muted";
    return s === dir ? "agree" : "disagree";
  }

  var TRI_MARKER_ICON = { agree: "✓", disagree: "✗", muted: "•" };

  // Sector-relative comparison line for the MULTIPLES method (VALUATION.md
  // Sec.7 axis-b): shows the current primary multiple vs its Damodaran sector
  // median explicitly, so the sector standing stays visible even when the
  // signal itself reads "MIXED". Renders nothing when no sector median
  // matched (comparison numbers absent).
  var SECTOR_BUCKET_WORD = {
    expensive: "expensive vs. sector",
    cheap: "cheap vs. sector",
    fair: "in line with sector median",
  };
  function sectorComparisonLineHtml(valuation) {
    var cmp = (((valuation || {}).multiples || {}).sector || {}).comparison;
    if (!cmp || !isNum(cmp.current) || !isNum(cmp.median) || !isNum(cmp.ratio)) return "";
    var word = SECTOR_BUCKET_WORD[cmp.bucket] || "";
    var cls = cmp.bucket === "expensive" ? "sector-cmp-red"
            : cmp.bucket === "cheap" ? "sector-cmp-green"
            : "sector-cmp-muted";
    var label = cmp.label || "Multiple";
    return (
      '<div class="tri-sector ' + cls + '">' +
        '<span class="tri-sector-label">Sector</span>' +
        escapeHtml(label) + " " + Number(cmp.current).toFixed(1) +
        " vs median " + Number(cmp.median).toFixed(1) +
        " (" + Number(cmp.ratio).toFixed(2) + "×" + (word ? " → " + word : "") + ")" +
      '</div>'
    );
  }

  // Informational EV/EBITDA (EV/EBITDA) + EV/EBIT (EV/EBIT) line under the
  // MULTIPLES method (SPEC.md Sec.6): capital-structure-neutral earnings
  // multiples reported alongside P/E. Verdict/triangulation still keys off
  // P/E; this is context, not a signal. Empty string when neither is present.
  function evMultiplesLineHtml(valuation) {
    var m = (valuation || {}).multiples || {};
    var cur = m.current || {};
    var specs = [
      { label: "EV/EBITDA", value: cur.ev_ebitda, pct: m.ev_ebitda_percentile },
      { label: "EV/EBIT", value: cur.ev_ebit, pct: m.ev_ebit_percentile },
    ];
    var frags = [];
    specs.forEach(function (s) {
      if (!isNum(s.value)) return;
      var txt = escapeHtml(s.label) + " " + Number(s.value).toFixed(1) + "×";
      if (isNum(s.pct)) txt += " (" + Math.round(Number(s.pct)) + "p)";
      frags.push(txt);
    });
    if (!frags.length) return "";
    return (
      '<div class="tri-sector sector-cmp-muted">' +
        '<span class="tri-sector-label">EV</span>' + frags.join(" · ") +
      '</div>'
    );
  }

  // P/TBV + ROTCE for a financial filer (SPEC.md Sec.23e). Occupies the same
  // slot evMultiplesLineHtml fills for other sectors and that Sec.20b emptied
  // for this one: enterprise value is undefined for a deposit funder, while
  // P/TBV is that sector's own convention (P/B is not comparable across
  // filers carrying different goodwill loads).
  function tangibleMultiplesLineHtml(valuation) {
    var v = valuation || {};
    if (v.sector_type !== "financial") return "";
    var m = v.multiples || {};
    var ptbv = (m.current || {}).ptbv;
    if (!isNum(ptbv)) return "";

    var txt = "P/TBV " + Number(ptbv).toFixed(2) + "×";
    if (isNum(m.ptbv_percentile)) txt += " (" + Math.round(Number(m.ptbv_percentile)) + "p)";
    var frags = [txt];

    var rotce = (v.rim || {}).rotce;
    if (isNum(rotce)) frags.push("ROTCE " + fmtPct(rotce));

    return (
      '<div class="tri-sector sector-cmp-muted">' +
        '<span class="tri-sector-label">TBV</span>' + frags.join(" · ") +
      '</div>'
    );
  }

  // ---- Reverse-DCF rate sensitivity (SPEC Amendment 28c-28d) --------------
  // Bracket bounds come from the server payload (reverse_dcf._BRACKET_LO/HI);
  // if absent, out-of-bracket shifts fall back to a bare "—".
  var RDCF_BOUNDS = (data && data.reverse_dcf_bounds) || null;

  function rdcfBoundText(which) {
    if (!RDCF_BOUNDS || !isNum(RDCF_BOUNDS[which])) return "—";
    var t = fmtPctTr(RDCF_BOUNDS[which], 0);
    return which === "lo" ? "<" + t.replace("-", "−") : ">" + t;
  }

  var RDCF_SKIP_LABEL = {
    below_rate_floor: "(floor)",
    below_erp_spread: "(ERP spread)",
    rate_at_or_below_terminal_growth: "(r ≤ g_t)",
  };

  // Suffix for the reverse-DCF value when it was solved on normalized FCF.
  function reverseDcfBasisSuffix(rdcf) {
    if (!rdcf || rdcf.fcf0_basis !== "normalized") return "";
    var raw = rdcf.bracket_status_raw === "above_bracket" ? rdcfBoundText("hi")
      : rdcf.bracket_status_raw === "below_bracket" ? rdcfBoundText("lo")
      : fmtPctTr(rdcf.implied_growth_raw);
    return "[normalized FCF; raw: " + raw + "]";
  }

  // One line: "Rate sens.: r −50bp 21.1% · +50bp 24.8% (g_t fixed 4.0%)".
  // "" (line omitted) when rate_sensitivity is absent/malformed.
  function rateSensLineHtml(rdcf) {
    var rs = rdcf && rdcf.rate_sensitivity;
    if (!rs || !Array.isArray(rs.shifts) || !rs.shifts.length) return "";
    var parts = rs.shifts.map(function (s, i) {
      s = s || {};
      var bp = Number(s.shift_bp);
      var label = isNum(s.shift_bp)
        ? (bp < 0 ? "−" : "+") + Math.abs(bp) + "bp"
        : "—";
      var val;
      if (s.skip_reason || s.status === "skipped") {
        val = "— " + (RDCF_SKIP_LABEL[s.skip_reason] || "(skipped)");
      } else if (s.status === "above_bracket") {
        val = rdcfBoundText("hi");
      } else if (s.status === "below_bracket") {
        val = rdcfBoundText("lo");
      } else if (s.status === "no_data" || !isNum(s.implied_growth)) {
        val = "—";
      } else {
        val = fmtPctTr(s.implied_growth).replace("-", "−");
      }
      return (i === 0 ? "r " : "") + label + " " + val;
    });
    var text = "Rate sens.: " + parts.join(" · ") + " (g_t fixed " + fmtPctTr(rs.terminal_growth) + ")";
    return '<div class="tri-sector sector-cmp-muted">' + escapeHtml(text) + '</div>';
  }

  function triangulationRowHtml(valuation, confidenceOverride) {
    var tri = (valuation || {}).triangulation;
    if (!tri) return "";
    var signals = tri.signals || {};
    var direction = tri.direction;
    var confidence = confidenceOverride || tri.confidence;
    var rationale = tri.rationale;
    var confColor = confidenceColor(confidence);

    // For financial/reit sectors the DCF slot is really the FFO/RIM/P/B×ROE
    // anchor (dcf.enabled === false in that case) -- label it accordingly,
    // mirroring cli.py's _valuation_method_label FFO/RIM/P-B-ROE chain.
    var dcfLabel = "P/B×ROE";
    if (!(valuation.dcf && valuation.dcf.enabled === false)) {
      dcfLabel = "DCF";
    } else if (valuation.ffo && valuation.ffo.scenarios) {
      dcfLabel = "FFO";
    } else if (valuation.rim && valuation.rim.scenarios) {
      dcfLabel = "RIM";
    }
    var methods = [
      { key: "dcf", label: dcfLabel },
      { key: "reverse_dcf", label: "REVERSE DCF" },
      { key: "multiples", label: "MULTIPLES" },
    ];

    // Defensive fallback: older payloads without tri.rationale render the
    // original compact chip-only row, no rationale lines, so this never
    // crashes on a payload predating the rationale field.
    if (!rationale) {
      var chips = methods.map(function (m) {
        var sig = signals[m.key];
        var kind = triAgreementKind(sig, direction);
        return (
          '<div class="tri-chip tri-' + kind + '">' +
            '<span class="tri-icon">' + TRI_MARKER_ICON[kind] + '</span>' +
            '<span class="tri-label">' + escapeHtml(m.label) + '</span>' +
            '<span class="tri-signal">' + escapeHtml(signalLabel(sig)) + '</span>' +
          '</div>'
        );
      }).join("");
      return (
        '<div class="card">' +
          '<div class="card-title">Triangulation</div>' +
          '<div class="triangulation-row">' +
            '<div class="tri-chips">' + chips + '</div>' +
            '<span><span class="badge-label">Confidence</span><span class="badge badge-' + confColor + '">' +
              escapeHtml(confidence || "—") + '</span></span>' +
          '</div>' +
        '</div>'
      );
    }

    var rows = methods.map(function (m) {
      var sig = signals[m.key];
      var kind = triAgreementKind(sig, direction);
      var reason = rationale[m.key];
      var extra = (m.key === "multiples")
        ? (sectorComparisonLineHtml(valuation) + evMultiplesLineHtml(valuation)
           + tangibleMultiplesLineHtml(valuation)) : "";
      if (m.key === "reverse_dcf") {
        var basisSuffix = reverseDcfBasisSuffix(valuation.reverse_dcf);
        if (basisSuffix) reason = (reason ? reason + " " : "") + basisSuffix;
        extra = rateSensLineHtml(valuation.reverse_dcf);
      }
      return (
        '<div class="tri-method">' +
          '<div class="tri-method-head">' +
            '<span class="tri-label">' + escapeHtml(m.label) + '</span>' +
            '<span class="badge badge-' + signalBadgeColor(sig) + '">' + escapeHtml(signalLabel(sig)) + '</span>' +
            '<span class="tri-marker tri-marker-' + kind + '">' + TRI_MARKER_ICON[kind] + '</span>' +
          '</div>' +
          (reason ? '<div class="tri-reason">' + escapeHtml(reason) + '</div>' : "") +
          extra +
        '</div>'
      );
    }).join("");

    var confReason = rationale.confidence;
    return (
      '<div class="card">' +
        '<div class="card-title">Triangulation</div>' +
        '<div class="tri-methods">' + rows + '</div>' +
        '<div class="tri-confidence">' +
          '<div class="tri-method-head">' +
            '<span class="badge-label">Confidence</span>' +
            '<span class="badge badge-' + confColor + '">' + escapeHtml(confidence || "—") + '</span>' +
          '</div>' +
          (confReason ? '<div class="tri-reason">' + escapeHtml(confReason) + '</div>' : "") +
        '</div>' +
      '</div>'
    );
  }

  // ---- Method summary card: which method(s) were used, and why -----------
  // (SPEC.md Sec.8l) -- purely educational: the software teaches the reader
  // how the headline number was actually built, before showing what the
  // downstream signals concluded about it. `source.method_summary` is a
  // server-built, already-ordered list (engine.run_valuation for valuation;
  // technical.verdict.technical_verdict for technical analysis); this only
  // groups entries by role for a compact layout -- it never re-sorts or
  // re-derives anything. Shared by both the valuation and technical-analysis
  // method-summary cards (see call sites in renderBody) so the two stay
  // visually identical rather than inventing a second layout.
  var METHOD_SUMMARY_GROUPS = [
    { role: "headline", title: "Headline Method" },
    { role: "secondary", title: "Secondary / Computed as Cross-Checks" },
    { role: "cross_check", title: "Always-On Independent Checks" },
    { role: "advisory", title: "Informational Additional Indicators" },
  ];

  function methodSummaryItemHtml(entry, isHeadline) {
    var label = escapeHtml(entry.label_tr || "—");
    var reason = entry.reason_tr ? escapeHtml(entry.reason_tr) : "";
    var labelHtml = isHeadline
      ? '<span class="badge badge-caution msum-headline-badge">' + label + '</span>'
      : '<span class="msum-label">' + label + '</span>';
    return (
      '<div class="msum-item' + (isHeadline ? " msum-item-headline" : "") + '">' +
        labelHtml +
        (reason ? '<div class="msum-reason">' + reason + '</div>' : "") +
      '</div>'
    );
  }

  function methodSummaryCardHtml(source, title) {
    var list = (source || {}).method_summary;
    // Defensive fallback: older stored verdicts predate this field, so a
    // missing/non-array/empty method_summary just skips the whole card
    // rather than rendering a broken/empty box (same pattern as the
    // tri.rationale fallback above).
    if (!source || !Array.isArray(list) || !list.length) return "";

    var byRole = {};
    list.forEach(function (entry) {
      if (!entry || !entry.role) return;
      (byRole[entry.role] = byRole[entry.role] || []).push(entry);
    });

    var groupsHtml = METHOD_SUMMARY_GROUPS.map(function (g) {
      var entries = byRole[g.role] || [];
      if (!entries.length) return "";
      var items = entries.map(function (entry) {
        return methodSummaryItemHtml(entry, g.role === "headline");
      }).join("");
      return (
        '<div class="msum-group msum-group-' + g.role + '">' +
          '<div class="msum-group-title">' + g.title + '</div>' +
          items +
        '</div>'
      );
    }).join("");
    if (!groupsHtml) return "";

    return (
      '<div class="card">' +
        '<div class="card-title">' + escapeHtml(title || "") + '</div>' +
        '<div class="msum">' + groupsHtml + '</div>' +
      '</div>'
    );
  }

  // ---- Price chart: close line + S/R range bands + fair-value bands -------
  // Self-contained inline SVG (no libraries -- CSP blocks them), same
  // hand-rolled approach as the fan chart. Overlays only what the user asked
  // for: support/resistance ranges and the fair-value band.
  // Parse a "YYYY-MM-DD" price-series date into a Date (local midnight), or
  // null if it doesn't look like one.
  function parseYMD(s) {
    var parts = String(s || "").split("-");
    if (parts.length !== 3) return null;
    var y = Number(parts[0]), m = Number(parts[1]), d = Number(parts[2]);
    if (!y || !m || !d) return null;
    return new Date(y, m - 1, d);
  }

  // Slice the (up-to-5y, multi-resolution) price_series down to the calendar
  // window for a range (3m/1y/5y). The 3m/1y windows land entirely in the
  // daily tail; 5y returns the whole series. Falls back to the last ~40
  // points if a window would leave too few to draw.
  function sliceSeriesByHorizon(series, range) {
    if (!series || series.length < 2) return series || [];
    var days = HORIZON_DAYS[range];
    if (!days) return series;
    var last = parseYMD(series[series.length - 1].t);
    if (!last) return series;
    var cutoff = last.getTime() - days * 86400000;
    var out = series.filter(function (p) {
      var d = parseYMD(p.t);
      return d && d.getTime() >= cutoff;
    });
    return out.length >= 2 ? out : series.slice(-Math.min(series.length, 40));
  }

  // Implied annualized return IF price converged to `fv` by the end of the
  // range: (fv/price)^(1/years) - 1. Not a forecast -- see the chart caption.
  function annualizedReturn(fv, price, range) {
    if (!isNum(fv) || !isNum(price) || Number(price) <= 0 || Number(fv) <= 0) return null;
    var years = HORIZON_YEARS[range] || 1;
    return Math.pow(Number(fv) / Number(price), 1 / years) - 1;
  }

  // Total return over the sliced window and its annualized volatility. Vol is
  // resolution-aware: it annualizes the log-return stdev by the periods-per-
  // year implied by the median calendar gap between points, so the daily
  // (3m/1y) and weekly-tail (5y) slices are both handled correctly.
  function computeRangeStats(slice) {
    if (!slice || slice.length < 2) return null;
    var first = Number(slice[0].c), last = Number(slice[slice.length - 1].c);
    var ret = (isNum(first) && isNum(last) && first > 0) ? (last / first - 1) : null;
    var rets = [], gaps = [];
    for (var i = 1; i < slice.length; i++) {
      var c0 = Number(slice[i - 1].c), c1 = Number(slice[i].c);
      if (c0 > 0 && c1 > 0) rets.push(Math.log(c1 / c0));
      var d0 = parseYMD(slice[i - 1].t), d1 = parseYMD(slice[i].t);
      if (d0 && d1) gaps.push((d1.getTime() - d0.getTime()) / 86400000);
    }
    var vol = null;
    if (rets.length >= 5) {
      var mean = rets.reduce(function (a, b) { return a + b; }, 0) / rets.length;
      var varr = rets.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0) / (rets.length - 1);
      var sd = Math.sqrt(varr);
      gaps.sort(function (a, b) { return a - b; });
      var medGap = gaps.length ? gaps[Math.floor(gaps.length / 2)] : 1.4;
      var perYear = medGap > 0 ? 365 / medGap : 252;
      vol = sd * Math.sqrt(perYear);
    }
    return { ret: ret, vol: vol };
  }

  // Two stat tiles above the chart: realized return over the selected window
  // and its annualized volatility. Both recompute on a range switch.
  function rangeStatsTilesHtml(slice, range) {
    var s = computeRangeStats(slice);
    if (!s) return "";
    var retTxt = isNum(s.ret) ? fmtSignedPct(s.ret * 100) : "—";
    var retCls = isNum(s.ret) ? (s.ret >= 0 ? "tech-pos" : "tech-neg") : "";
    var volTxt = isNum(s.vol) ? Math.round(s.vol * 100) + "%" : "—";
    return '<div class="tech-stats" style="margin-bottom:12px;">' +
      '<div class="tech-stat"><div class="tech-stat-label">Return (' + escapeHtml(horizonLabel(range)) + ')</div>' +
        '<div class="tech-stat-val ' + retCls + '">' + retTxt + '</div></div>' +
      '<div class="tech-stat"><div class="tech-stat-label">Volatility (ann.)</div>' +
        '<div class="tech-stat-val">' + volTxt + '</div></div>' +
      '</div>';
  }

  // Client-side range switch (3m/1y/5y). Reuses the shared horizon-toggle
  // styling; scoped by the .range-toggle wrapper so its clicks are distinct
  // from the header's read-only analyzed-horizon indicator.
  function rangeToggleHtml(current) {
    var pills = ["3m", "1y", "5y"].map(function (v) {
      return '<button type="button" class="horizon-pill' + (v === current ? " active" : "") +
        '" data-range="' + v + '">' + escapeHtml(horizonLabel(v)) + '</button>';
    }).join("");
    return '<div class="horizon-toggle interactive range-toggle">' + pills + '</div>';
  }

  // The SVG price chart + fan for one range, plus its legend and caption.
  // `slice` is the range-windowed series; `range` drives the horizon label and
  // the annualized-return figures on the fan endpoints. `showEntryPlan`
  // (default false, so older call sites are unaffected) overlays
  // result.entry_plan's tranche bands/markers -- see the "entry-plan overlay"
  // block below for the full drawing logic.
  function priceChartSvg(t, result, range, slice, analyst, showEntryPlan) {
    var W = 760, H = 340, PL = 48, PR = 112, PT = 14, PB = 28;
    var plotW = W - PL - PR, plotH = H - PT - PB;

    var supports = (t.support_levels || []).filter(function (z) { return isNum(z.low) && isNum(z.high); });
    var resistances = (t.resistance_levels || []).filter(function (z) { return isNum(z.low) && isNum(z.high); });
    var fv = (result || {}).fair_value_range || {};

    // Staged entry-plan overlay data (opt-in, default off -- see
    // priceRangeBodyHtml/priceChartCardHtml/wirePriceRange for the toggle
    // state machine). Only tranches with a numeric price_zone are drawable;
    // older/degraded payloads may have none, or result.entry_plan may be
    // missing/empty/absent entirely -- all render identically to the
    // overlay-off case.
    var rawEntryPlan = (showEntryPlan && Array.isArray((result || {}).entry_plan)) ? result.entry_plan : [];
    var entryPlan = rawEntryPlan.filter(function (tr) {
      var z = (tr || {}).price_zone || {};
      return isNum(z.lo) && isNum(z.hi);
    });
    // Dip tranches share one structural invalidation level (see
    // planning.compute_entry_plan's docstring) -- read it off the first dip
    // tranche that carries a numeric one rather than drawing one line per
    // tranche (explicitly ruled out as too cluttered).
    var entryDipInvalidation = null;
    for (var edi = 0; edi < entryPlan.length; edi++) {
      if (entryPlan[edi].kind === "dip" && isNum(entryPlan[edi].invalidation)) {
        entryDipInvalidation = Number(entryPlan[edi].invalidation);
        break;
      }
    }
    // Entry-plan's shared upside target, by construction equal to whichever
    // of bullTop/baseMid the fan below resolves to -- read off the first
    // tranche carrying a numeric target so the fan-endpoint label can be
    // annotated instead of drawing a duplicate line (see the hasFan block).
    var entryTarget = null;
    for (var eti = 0; eti < entryPlan.length; eti++) {
      if (isNum(entryPlan[eti].target)) { entryTarget = Number(entryPlan[eti].target); break; }
    }
    // Green/red hexes reused verbatim from the fan's own upside/downside
    // tint (.pchart-fan-up / .pchart-fan-down below) so breakout ("teyit")
    // and dip ("birikim") bands match this codebase's existing
    // entry-kind-breakout/entry-kind-dip color convention.
    var ENTRY_BREAKOUT_HEX = "#4de082";
    var ENTRY_DIP_HEX = "#ffb4ab";
    function entryKindHex(kind) { return kind === "breakout" ? ENTRY_BREAKOUT_HEX : ENTRY_DIP_HEX; }

    // Analyst consensus price target (external reference, not the model's
    // own fair value) -- drawn as a distinct amber dashed line + faint band,
    // separate from the scenario fan below.
    var a = analyst || {};
    var atMean = isNum(a.target_mean) ? Number(a.target_mean) : null;
    var atLow = isNum(a.target_low) ? Number(a.target_low) : null;
    var atHigh = isNum(a.target_high) ? Number(a.target_high) : null;

    function bandMid(b) { return (b && isNum(b.lo) && isNum(b.hi)) ? (Number(b.lo) + Number(b.hi)) / 2 : null; }
    var baseMid = bandMid(fv.base);
    var bullTop = (fv.bull && isNum(fv.bull.hi)) ? Number(fv.bull.hi)
      : (fv.base && isNum(fv.base.hi) ? Number(fv.base.hi) : baseMid);
    var bearBot = (fv.bear && isNum(fv.bear.lo)) ? Number(fv.bear.lo)
      : (fv.base && isNum(fv.base.lo) ? Number(fv.base.lo) : baseMid);
    var sens = ((result || {}).valuation || {}).sensitivity || {};
    var sensLo = isNum(sens.lo) ? Number(sens.lo) : null;
    var sensHi = isNum(sens.hi) ? Number(sens.hi) : null;
    var highUncertainty = !!sens.high_uncertainty;

    var hasFan = baseMid !== null && bullTop !== null && bearBot !== null && isNum(t.price);

    var vals = slice.map(function (p) { return p.c; });
    if (isNum(t.price)) vals.push(t.price);
    supports.concat(resistances).forEach(function (z) { vals.push(z.low, z.high); });
    if (hasFan) {
      vals.push(bullTop, bearBot, baseMid);
      if (sensLo !== null) vals.push(sensLo);
      if (sensHi !== null) vals.push(sensHi);
    }
    if (atMean !== null) {
      vals.push(atMean);
      if (atLow !== null) vals.push(atLow);
      if (atHigh !== null) vals.push(atHigh);
    }
    // Entry-plan overlay only affects the y-axis domain when it's actually
    // shown, so toggling it off restores the exact original scale/render.
    entryPlan.forEach(function (tr) {
      vals.push(Number(tr.price_zone.lo), Number(tr.price_zone.hi));
    });
    if (entryDipInvalidation !== null) vals.push(entryDipInvalidation);
    var vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    if (vmax <= vmin) vmax = vmin + 1;
    var padY = (vmax - vmin) * 0.06;
    var lo = vmin - padY, hi = vmax + padY;

    var fanFrac = 0.30;
    var histW = hasFan ? plotW * (1 - fanFrac) : plotW;
    var xToday = PL + histW;
    var xEnd = PL + plotW;

    var n = slice.length;
    function xOf(i) { return PL + histW * (i / (n - 1)); }
    function yOf(v) { return PT + plotH * (hi - v) / (hi - lo); }

    var linePts = slice.map(function (p, i) { return (i ? "L" : "M") + xOf(i).toFixed(1) + " " + yOf(p.c).toFixed(1); }).join(" ");
    var areaPath = "M" + PL + " " + (PT + plotH).toFixed(1) + " " +
      slice.map(function (p, i) { return "L" + xOf(i).toFixed(1) + " " + yOf(p.c).toFixed(1); }).join(" ") +
      " L" + xToday.toFixed(1) + " " + (PT + plotH).toFixed(1) + " Z";

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Price and fair-value fan chart">';

    // Analyst consensus overlay: a distinct amber reference level, separate
    // from the model's own scenario fan. Drawn first (behind grid, S/R,
    // fan, and the price line/area) so it reads as background context.
    if (atMean !== null) {
      if (atLow !== null && atHigh !== null) {
        var yAtHigh = yOf(atHigh), yAtLow = yOf(atLow);
        svg += '<rect class="pchart-analyst-band" x="' + PL + '" y="' + Math.min(yAtHigh, yAtLow).toFixed(1) +
          '" width="' + (xEnd - PL).toFixed(1) + '" height="' + Math.abs(yAtLow - yAtHigh).toFixed(1) + '"/>';
      }
      var yAtMean = yOf(atMean);
      svg += '<line class="pchart-analyst-line" x1="' + PL + '" y1="' + yAtMean.toFixed(1) + '" x2="' + xEnd.toFixed(1) + '" y2="' + yAtMean.toFixed(1) + '"/>';
      svg += '<text class="pchart-analyst-label" x="' + (xEnd + 5) + '" y="' + (yAtMean + 3).toFixed(1) + '">Analist ' + fmtMoney(atMean) + '</text>';
    }

    // Entry-plan tranche bands: translucent, full-width (PL->xEnd, like the
    // analyst band above) so the reader can see both whether a level was
    // tested historically and where it sits relative to the forward fan.
    // Drawn early/behind (background context), same as the analyst band.
    entryPlan.forEach(function (tr) {
      var zLo = Number(tr.price_zone.lo), zHi = Number(tr.price_zone.hi);
      var yZHi = yOf(zHi), yZLo = yOf(zLo);
      svg += '<rect class="pchart-entry-band" x="' + PL + '" y="' + Math.min(yZHi, yZLo).toFixed(1) +
        '" width="' + (xEnd - PL).toFixed(1) + '" height="' + Math.max(0.5, Math.abs(yZLo - yZHi)).toFixed(1) +
        '" fill="' + hexToRgba(entryKindHex(tr.kind), 0.18) + '"/>';
    });

    for (var g = 0; g <= 4; g++) {
      var vy = lo + (hi - lo) * g / 4;
      var yy = yOf(vy).toFixed(1);
      svg += '<line class="pchart-grid" x1="' + PL + '" y1="' + yy + '" x2="' + xEnd + '" y2="' + yy + '"/>';
      svg += '<text class="pchart-tick" x="' + (PL - 5) + '" y="' + (Number(yy) + 3) + '" text-anchor="end">' + fmtMoney(vy) + '</text>';
    }
    [0, Math.floor((n - 1) / 2), n - 1].forEach(function (i) {
      var parts = String(slice[i].t || "").split("-");
      var lbl = parts.length === 3 ? (parts[1] + "/" + parts[0].slice(2)) : slice[i].t;
      var anchor = i === 0 ? "start" : (i === n - 1 ? "end" : "middle");
      svg += '<text class="pchart-tick" x="' + xOf(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + anchor + '">' + escapeHtml(lbl) + '</text>';
    });

    function srLine(z, sideLabel) {
      var y = yOf(z.price).toFixed(1);
      return '<line class="pchart-sr-line" x1="' + PL + '" y1="' + y + '" x2="' + xToday.toFixed(1) + '" y2="' + y + '"/>' +
        '<text class="pchart-band-label" x="' + (PL + 4) + '" y="' + (Number(y) - 3) + '" text-anchor="start">' + sideLabel + " " + fmtMoney(z.price) + '</text>';
    }
    resistances.forEach(function (z) { svg += srLine(z, "R"); });
    supports.forEach(function (z) { svg += srLine(z, "S"); });

    if (hasFan) {
      var apexY = yOf(Number(t.price));
      var yBull = yOf(bullTop), yBear = yOf(bearBot), yBase = yOf(baseMid);

      svg += '<line class="pchart-now-line" x1="' + xToday.toFixed(1) + '" y1="' + PT + '" x2="' + xToday.toFixed(1) + '" y2="' + (PT + plotH).toFixed(1) + '"/>';

      if (sensLo !== null && sensHi !== null) {
        var ySensHi = yOf(sensHi), ySensLo = yOf(sensLo);
        svg += '<polygon class="pchart-fan-outer" points="' +
          xToday.toFixed(1) + ',' + apexY.toFixed(1) + ' ' +
          xEnd.toFixed(1) + ',' + ySensHi.toFixed(1) + ' ' +
          xEnd.toFixed(1) + ',' + ySensLo.toFixed(1) + '"/>';
      }

      svg += '<polygon class="pchart-fan-up" points="' +
        xToday.toFixed(1) + ',' + apexY.toFixed(1) + ' ' +
        xEnd.toFixed(1) + ',' + yBull.toFixed(1) + ' ' +
        xEnd.toFixed(1) + ',' + yBase.toFixed(1) + '"/>';
      svg += '<polygon class="pchart-fan-down" points="' +
        xToday.toFixed(1) + ',' + apexY.toFixed(1) + ' ' +
        xEnd.toFixed(1) + ',' + yBase.toFixed(1) + ' ' +
        xEnd.toFixed(1) + ',' + yBear.toFixed(1) + '"/>';

      svg += '<line class="pchart-fan-line pchart-fv-bull" x1="' + xToday.toFixed(1) + '" y1="' + apexY.toFixed(1) + '" x2="' + xEnd.toFixed(1) + '" y2="' + yBull.toFixed(1) + '"/>';
      svg += '<line class="pchart-fan-baseline" x1="' + xToday.toFixed(1) + '" y1="' + apexY.toFixed(1) + '" x2="' + xEnd.toFixed(1) + '" y2="' + yBase.toFixed(1) + '"/>';
      svg += '<line class="pchart-fan-line pchart-fv-bear" x1="' + xToday.toFixed(1) + '" y1="' + apexY.toFixed(1) + '" x2="' + xEnd.toFixed(1) + '" y2="' + yBear.toFixed(1) + '"/>';

      // Scenario endpoint labels (value line + implied annualized-return line).
      var annBull = annualizedReturn(bullTop, t.price, range);
      var annBase = annualizedReturn(baseMid, t.price, range);
      var annBear = annualizedReturn(bearBot, t.price, range);
      function annLine(y, ann) {
        return ann === null ? "" :
          '<text class="pchart-fv-ann" x="' + (xEnd + 5) + '" y="' + (y + 11).toFixed(1) + '">' + fmtSignedPct(ann * 100) + '/y</text>';
      }
      // Entry-plan's shared target is, by construction, always equal to
      // whichever of bullTop/baseMid _resolve_target() picked (bull.hi
      // preferred, base.hi fallback) -- so instead of a duplicate line,
      // append a short suffix to whichever fan-endpoint label it matches
      // (small numeric tolerance for float round-tripping). Falls back to
      // checking bearBot defensively; matches neither in the normal case
      // where entryTarget is null or the overlay is off, so this is a no-op
      // then.
      var entryTargetSuffix = "";
      if (entryTarget !== null && Math.abs(entryTarget - bullTop) < 0.01) {
        entryTargetSuffix = "bull";
      } else if (entryTarget !== null && Math.abs(entryTarget - baseMid) < 0.01) {
        entryTargetSuffix = "base";
      } else if (entryTarget !== null && Math.abs(entryTarget - bearBot) < 0.01) {
        entryTargetSuffix = "bear";
      }
      var ENTRY_TARGET_SUFFIX_TXT = " · entry plan target";
      svg += '<text class="pchart-fv-label" x="' + (xEnd + 5) + '" y="' + (yBull + 1).toFixed(1) + '" fill="var(--green)">Bull ' + fmtMoney(bullTop) + (entryTargetSuffix === "bull" ? ENTRY_TARGET_SUFFIX_TXT : "") + '</text>' + annLine(yBull, annBull);
      svg += '<text class="pchart-fv-label" x="' + (xEnd + 5) + '" y="' + (yBase + 1).toFixed(1) + '" fill="#5aa7ff">Base ' + fmtMoney(baseMid) + (entryTargetSuffix === "base" ? ENTRY_TARGET_SUFFIX_TXT : "") + '</text>' + annLine(yBase, annBase);
      svg += '<text class="pchart-fv-label" x="' + (xEnd + 5) + '" y="' + (yBear + 1).toFixed(1) + '" fill="var(--red)">Bear ' + fmtMoney(bearBot) + (entryTargetSuffix === "bear" ? ENTRY_TARGET_SUFFIX_TXT : "") + '</text>' + annLine(yBear, annBear);

      svg += '<text class="pchart-tick" x="' + ((xToday + xEnd) / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + escapeHtml(horizonLabel(range)) + ' →</text>';
    }

    svg += '<path class="pchart-area" d="' + areaPath + '"/>';
    svg += '<path class="pchart-line" d="' + linePts + '"/>';

    if (isNum(t.price)) {
      var yp = yOf(t.price);
      if (hasFan) {
        svg += '<circle class="pchart-apex" cx="' + xToday.toFixed(1) + '" cy="' + yp.toFixed(1) + '" r="3"/>';
        svg += '<text class="pchart-now-label" x="' + (PL + 4) + '" y="' + (PT + 12) + '">Now ' + fmtMoney(t.price) + '</text>';
      } else {
        svg += '<line class="pchart-now-line" x1="' + PL + '" y1="' + yp.toFixed(1) + '" x2="' + xEnd + '" y2="' + yp.toFixed(1) + '"/>';
        svg += '<text class="pchart-now-label" x="' + (xEnd + 5) + '" y="' + (yp + 3).toFixed(1) + '">' + fmtMoney(t.price) + '</text>';
      }
    }

    // Entry-plan overlay: shared dip-invalidation line + numbered tranche
    // markers, drawn last so they sit on top of the price line/fan/grid
    // (mirrors where the "now" marker/label are drawn, for the same reason).
    // The chart shows WHERE (this marker's number); the "Staged Entry Plan"
    // table below (already rendered) explains WHY via that same number --
    // no reason text is duplicated onto the chart itself.
    if (entryDipInvalidation !== null) {
      var yEntryInv = yOf(entryDipInvalidation);
      svg += '<line class="pchart-entry-invalidation-line" x1="' + PL + '" y1="' + yEntryInv.toFixed(1) + '" x2="' + xEnd.toFixed(1) + '" y2="' + yEntryInv.toFixed(1) + '"/>';
      svg += '<text class="pchart-entry-invalidation-label" x="' + (xEnd + 5) + '" y="' + (yEntryInv + 3).toFixed(1) + '">Stop ' + fmtMoney(entryDipInvalidation) + '</text>';
    }
    entryPlan.forEach(function (tr) {
      var zLo = Number(tr.price_zone.lo), zHi = Number(tr.price_zone.hi);
      var yMid = yOf((zLo + zHi) / 2);
      var hexCol = entryKindHex(tr.kind);
      var nLabel = isNum(tr.n) ? escapeHtml(String(tr.n)) : "?";
      svg += '<circle class="pchart-entry-marker" cx="' + xToday.toFixed(1) + '" cy="' + yMid.toFixed(1) + '" r="7" fill="' + hexCol + '"/>';
      svg += '<text class="pchart-entry-marker-label" x="' + xToday.toFixed(1) + '" y="' + (yMid + 3).toFixed(1) + '" text-anchor="middle">' + nLabel + '</text>';
    });

    svg += '</svg>';

    var legend =
      '<div class="pchart-legend">' +
        '<span><span class="pchart-sw" style="background:#5aa7ff"></span>Price</span>' +
        ((resistances.length || supports.length) ? '<span><span class="pchart-sw" style="background:#7a1f1f"></span>Support / Resistance</span>' : "") +
        (hasFan ? '<span><span class="pchart-sw" style="background:' + hexToRgba("#4de082", 0.5) + '"></span>Upside</span>' +
                  '<span><span class="pchart-sw" style="background:' + hexToRgba("#ffb4ab", 0.5) + '"></span>Downside</span>' +
                  (sensLo !== null && sensHi !== null ? '<span><span class="pchart-sw" style="background:' + hexToRgba("#8b919d", 0.35) + '"></span>Sensitivity</span>' : "") : "") +
        (atMean !== null ? '<span><span class="pchart-sw" style="background:' + hexToRgba("#ffb953", 0.5) + '"></span>Analyst target</span>' : "") +
        (entryPlan.some(function (tr) { return tr.kind === "dip"; }) ? '<span><span class="pchart-sw" style="background:' + hexToRgba(ENTRY_DIP_HEX, 0.5) + '"></span>Accumulation (dip)</span>' : "") +
        (entryPlan.some(function (tr) { return tr.kind === "breakout"; }) ? '<span><span class="pchart-sw" style="background:' + hexToRgba(ENTRY_BREAKOUT_HEX, 0.5) + '"></span>Confirmation (breakout)</span>' : "") +
        (entryDipInvalidation !== null ? '<span><span class="pchart-sw" style="background:' + hexToRgba(ENTRY_DIP_HEX, 0.5) + '"></span>Stop (entry plan)</span>' : "") +
      '</div>';

    var caption = hasFan
      ? '<div class="pchart-caption">The fan fans out from today\'s price to the scenario values (bear · base · bull); the ' +
        '<b>%/yr</b> on the right is the annualized return implied if price converges to that scenario by the end of the ' +
        'horizon — it is not a forecast or a price trajectory.' +
        (highUncertainty ? ' <span class="uncertainty-tag">High uncertainty</span>' : "") +
        '</div>'
      : "";

    return svg + legend + caption;
  }

  // Body of the price card for one range: stat tiles + chart. Re-rendered in
  // place by wirePriceRange() when the user flips the range toggle or the
  // entry-plan overlay toggle. `showEntryPlan` defaults to false so any
  // other/older call site renders exactly as before.
  function priceRangeBodyHtml(technical, result, range, analyst, showEntryPlan) {
    var t = technical || {};
    var series = t.price_series || [];
    var slice = sliceSeriesByHorizon(series, range);
    return rangeStatsTilesHtml(slice, range) + priceChartSvg(t, result, range, slice, analyst, !!showEntryPlan);
  }

  // The entry-plan overlay toggle: a separate on/off pill, visually distinct
  // from the 3m/1y/5y .horizon-pill group (see .entry-plan-toggle-btn CSS),
  // only rendered when result.entry_plan actually has drawable tranches --
  // an absent/null/empty entry_plan (older stored verdicts predate this
  // field) renders no button at all, so the chart looks exactly as it did
  // before this feature.
  function entryPlanToggleHtml(entryPlan) {
    if (!Array.isArray(entryPlan) || entryPlan.length === 0) return "";
    return '<button type="button" class="entry-plan-toggle-btn" data-entry-plan-toggle' +
      ' title="Show/hide the staged entry plan on the chart">' +
      '<span aria-hidden="true">📍</span>Entry Plan</button>';
  }

  function priceChartCardHtml(technical, result, horizon, analyst) {
    var t = technical || {};
    var series = t.price_series || [];
    if (series.length < 2) return "";
    var defRange = HORIZON_DAYS[horizon] ? horizon : "1y";
    return '<div class="card pchart">' +
      '<div class="pchart-head">' +
        '<div class="card-title">Price &amp; Fair-Value Fan</div>' +
        '<div class="pchart-head-controls">' +
          rangeToggleHtml(defRange) +
          entryPlanToggleHtml((result || {}).entry_plan) +
        '</div>' +
      '</div>' +
      '<div id="price-range-body">' + priceRangeBodyHtml(technical, result, defRange, analyst, false) + '</div>' +
      '</div>';
  }

  // Wire the client-side range toggle and the entry-plan overlay toggle.
  // Flipping 3m/1y/5y re-slices the chart window and recomputes the stat
  // tiles + annualized-return figures with no server round-trip (valuation
  // is horizon-independent); this is a chart *lens*, separate from the
  // analyzed horizon shown in the header pill. The entry-plan toggle's
  // on/off state lives in `state.showEntryPlan` below, alongside
  // `state.range` -- both toggles share one `render()` that reads the
  // current combined state, so flipping the range while the overlay is on
  // keeps it on (and vice versa), exactly like a single shared closure.
  function wirePriceRange(technical, result, analyst) {
    var toggle = bodyEl.querySelector(".range-toggle");
    var entryToggle = bodyEl.querySelector("[data-entry-plan-toggle]");
    var body = document.getElementById("price-range-body");
    if (!toggle || !body) return;
    var activePill = toggle.querySelector(".horizon-pill.active");
    var state = {
      range: (activePill && activePill.getAttribute("data-range")) || "1y",
      showEntryPlan: false
    };
    function render() {
      body.innerHTML = priceRangeBodyHtml(technical, result, state.range, analyst, state.showEntryPlan);
    }
    toggle.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".horizon-pill") : null;
      if (!btn) return;
      var range = btn.getAttribute("data-range");
      if (!range) return;
      state.range = range;
      toggle.querySelectorAll(".horizon-pill").forEach(function (p) {
        p.classList.toggle("active", p === btn);
      });
      render();
    });
    if (entryToggle) {
      entryToggle.addEventListener("click", function () {
        state.showEntryPlan = !state.showEntryPlan;
        entryToggle.classList.toggle("active", state.showEntryPlan);
        render();
      });
    }
  }

  // ---- Verdict cards (fundamental/technical/profile fit) ------------------
  function verdictCardHtml(label, verdictText, noteText) {
    var color = bucketColor(verdictText);
    var pos = GAUGE_POSITION[color];
    return (
      '<div class="card">' +
        '<div class="card-title">' + escapeHtml(label) + '</div>' +
        '<div class="verdict-card-body">' +
          '<div class="gauge"><div class="gauge-marker" style="left:' + pos + '%;"></div></div>' +
          '<div><span class="badge badge-' + color + '">' + escapeHtml(verdictText || "—") + '</span></div>' +
          '<div class="verdict-note">' + escapeHtml(noteText || "—") + '</div>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Technical card: verdict + momentum + support/resistance ------------
  // Signed percentage-POINT value (input already in points, e.g. 14 -> "+14%"),
  // wrapped green/red by sign. "—" when missing.
  function techSigned(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var txt = (num >= 0 ? "+" : "") + (Math.round(num * 10) / 10) + "%";
    return '<span class="' + (num >= 0 ? "tech-pos" : "tech-neg") + '">' + txt + '</span>';
  }

  // ---- S/R helpers (shared by the trigger ladder + the detail rows) -------
  // Why a level matters: 52-week extreme / how many swing points tested it /
  // Fibonacci retracement / a major moving average. `withLast` appends the
  // recency of the last test (used only in the collapsed detail section).
  function srReason(lvl, withLast) {
    var parts = [];
    if (lvl.is_52w_high) parts.push("52w high");
    else if (lvl.is_52w_low) parts.push("52w low");
    else if ((lvl.touches || 0) >= 1) parts.push(lvl.touches + "× test");
    if (lvl.fib) parts.push("Fib " + lvl.fib);
    if (lvl.ma) parts.push(lvl.ma);
    var base = parts.length ? parts.join(" + ") : "level";
    if (withLast && lvl.last_touch) base += " · last " + lvl.last_touch;
    return base;
  }
  // Strength: a 52-week extreme, a repeatedly-tested swing, or a swing that
  // coincides with a Fibonacci level or a major moving average is Strong; a
  // lone fib / lone MA / single touch is Medium.
  function srStrength(lvl) {
    var touches = lvl.touches || 0;
    var is52wNearEnough = (lvl.is_52w_high || lvl.is_52w_low) && Math.abs(lvl.dist_pct) <= 60;
    if (is52wNearEnough || touches >= 2 || (touches >= 1 && (lvl.fib || lvl.ma))) {
      return { label: "Strong", cls: "sr-str-strong" };
    }
    if (touches === 1 || lvl.fib || lvl.ma) return { label: "Medium", cls: "sr-str-medium" };
    return { label: "Weak", cls: "sr-str-weak" };
  }
  // A level is a price RANGE (low–high); collapse to one number if the band
  // is trivially thin.
  function srRange(lvl) {
    if (lvl.low != null && lvl.high != null && lvl.high - lvl.low > 0.01) {
      return fmtMoney(lvl.low) + "–" + fmtMoney(lvl.high);
    }
    return fmtMoney(lvl.price != null ? lvl.price : lvl.low);
  }

  // The action a daily close through a resistance / support implies. SMA-tagged
  // levels get the "trend line" framing (SMA200 = long-term, SMA50 = short-term)
  // -- that's the whole point: a close through a moving average flips the trend
  // regime, not just a horizontal shelf.
  function resistanceEffect(lvl, regimeDir) {
    if (lvl.ma && /200/.test(lvl.ma)) return "long-term UPTREND confirmation";
    if (lvl.ma && /50/.test(lvl.ma)) return regimeDir === "up" ? "uptrend strengthens" : "downtrend breaks";
    return "resistance broken, upside opens up";
  }
  function supportEffect(lvl, regimeDir) {
    if (lvl.is_52w_low) return "new 52-week low";
    if (lvl.ma && /200/.test(lvl.ma)) return "long-term trend support breaks";
    if (lvl.ma && /50/.test(lvl.ma)) return regimeDir === "up" ? "uptrend weakens" : "downtrend accelerates";
    return "downtrend accelerates";
  }

  // ---- Momentum synthesis: adapter over the Python-computed composite ------
  // The composite direction/strength score (weighting, thresholds,
  // acceleration) is now computed server-side in
  // sec_analyzer/technical/momentum.py::compute_price_momentum and delivered
  // as t.momentum (see SPEC's payload.technical.momentum shape). This
  // function no longer re-derives S from raw indicators -- it only MAPS the
  // Python payload onto the internal field shape the rest of this file
  // (computeReversal, momentumSentence, the badge/meter render) already
  // consumes, so none of those call sites had to change. r1/r3/r6/rsi/mh/mc
  // are still read from the raw technical indicators (not from t.momentum)
  // because momentumSentence's prose is built from those, not from the score.
  function computeMomentum(t) {
    if (!t || !t.momentum) return null;
    var m = t.momentum;
    var r1 = isNum(t.return_1m_pct) ? Number(t.return_1m_pct) : null;
    var r3 = isNum(t.return_3m_pct) ? Number(t.return_3m_pct) : null;
    var r6 = isNum(t.return_6m_pct) ? Number(t.return_6m_pct) : null;
    var rsi = isNum(t.rsi14) ? Number(t.rsi14) : null;
    var mh = isNum(t.macd_hist) ? Number(t.macd_hist) : null;
    var mc = (t.macd_cross === "bullish" || t.macd_cross === "bearish") ? t.macd_cross : null;

    var dirKind = m.direction === "up" || m.direction === "down" ? m.direction : "flat";
    var dirCls = dirKind === "up" ? "mom-badge-up" : (dirKind === "down" ? "mom-badge-down" : "mom-badge-flat");

    return {
      S: isNum(m.s) ? Number(m.s) : null,
      meterPos: isNum(m.meter_pos) ? Number(m.meter_pos) : 50,
      dirLabel: m.label || "—",
      dirCls: dirCls,
      arrow: m.arrow || "→",
      accelWord: m.accel || null,
      dirKind: dirKind,
      r1: r1, r3: r3, r6: r6, rsi: rsi, mh: mh, mc: mc
    };
  }

  // ---- Swing reversal-confirmation checklist ------------------------------
  // Turns the momentum readout into an actionable "is the trend turning?"
  // panel. Directional to the prevailing momentum: a DOWN trend looks for a
  // BULLISH reversal (oversold bounce being reclaimed), an UP trend for a
  // BEARISH one. Each row is a deterministic check over already-computed
  // indicators -- RSI reclaim (t.rsi_reclaim, Python side), MACD signal cross
  // (t.macd_cross), OBV money flow (t.obv_trend), and RSI divergence
  // (t.rsi_divergence). A confirmed row is a ✓; a still-pending precondition
  // (e.g. RSI oversold but not yet reclaimed) is a ◦; an outright contra
  // reading is a ✗. The count of ✓ drives a one-line readiness verdict, and a
  // watch line maps the nearest S/R zone to the trigger/invalidation level.
  var _REV_VOLUME_MIN = 1.5; // rel_volume at/above which the turn has real participation
  // Horizon-aware swing tuning: a short (3m) swing wants to react fast and
  // keep a tight stop; a long (5y) hold tolerates more noise (wider stop) but
  // demands stronger confirmation before calling a turn. The 1y row is the
  // historical default (volMin 1.5, 2-of-N confirm, 12% wide-stop line), so a
  // 1y report is unchanged. Only timing/stop-acceptability shifts — the price
  // TARGET stays the fair-value anchor and is never horizon-scaled.
  function swingHorizonTuning(horizon) {
    if (horizon === "3m") return { volMin: 1.3, strongConfirm: 1, wideStopPct: 8,
      note: "3-month timing horizon: fast confirmation (1 signal), tight stop (>8% counts as wide)." };
    if (horizon === "5y") return { volMin: 1.8, strongConfirm: 3, wideStopPct: 18,
      note: "5-year timing horizon: strong confirmation (3 signals) expected, wide stop tolerance (>18%)." };
    return { volMin: 1.5, strongConfirm: 2, wideStopPct: 12,
      note: "1-year timing horizon: balanced confirmation (2 signals), moderate stop (>12% counts as wide)." };
  }
  function computeReversal(t, momentum, horizon) {
    if (!momentum || (momentum.dirKind !== "up" && momentum.dirKind !== "down")) return null;
    var tuning = swingHorizonTuning(horizon);
    var bull = momentum.dirKind === "down"; // downtrend -> watch for a bullish turn
    var rows = [];
    function row(state, text) { rows.push({ state: state, text: text }); }

    // 1. RSI reclaim of the extreme line.
    var rsi = isNum(t.rsi14) ? Number(t.rsi14) : null;
    if (bull) {
      if (t.rsi_reclaim === "bullish") row("ok", "RSI exited oversold (reclaimed above 30)");
      else if (rsi !== null && rsi < 30) row("pending", "RSI oversold (" + rsi.toFixed(0) + ") — not yet reclaimed above 30");
      else row("none", "No RSI oversold reversal");
    } else {
      if (t.rsi_reclaim === "bearish") row("ok", "RSI turned back from overbought (dropped below 70)");
      else if (rsi !== null && rsi > 70) row("pending", "RSI overbought (" + rsi.toFixed(0) + ") — not yet dropped below 70");
      else row("none", "No RSI overbought reversal");
    }

    // 2. MACD signal-line crossover.
    if (t.macd_cross === (bull ? "bullish" : "bearish")) row("ok", "MACD " + (bull ? "bullish" : "bearish") + " crossover (fresh)");
    else if (t.macd_cross === (bull ? "bearish" : "bullish")) row("bad", "MACD crossed the opposite way");
    else row("none", "No MACD crossover");

    // 3. OBV money flow.
    if (t.obv_trend === (bull ? "up" : "down")) row("ok", "OBV " + (bull ? "money flowing in (accumulation)" : "money flowing out (distribution)"));
    else if (t.obv_trend === (bull ? "down" : "up")) row("bad", "OBV the opposite way (" + (bull ? "distribution" : "accumulation") + ")");
    else row("none", "OBV flat");

    // 4. Volume participation at the turn (rel_volume = last vol / 20d avg). A
    // reversal on elevated volume is far more trustworthy than one on thin
    // trade; direction-neutral, so it reads the same for a bullish/bearish turn.
    var rv = isNum(t.rel_volume) ? Number(t.rel_volume) : null;
    if (rv !== null) {
      if (rv >= tuning.volMin) row("ok", "Volume notably above average (" + rv.toFixed(1) + "×) — there is participation in the turn");
      else row("none", "Volume unremarkable (" + rv.toFixed(1) + "×) — no strong participation in the turn");
    }

    // 5. Volume climax / capitulation bar in the last ~10 sessions. A
    // wide-range, huge-volume bar in the direction of the exhausting trend
    // (down-climax while falling, up-climax while rising) marks seller/buyer
    // exhaustion -- a classic reversal tell. Adds a row only when detected.
    var vc = t.volume_climax;
