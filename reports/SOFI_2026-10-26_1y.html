    if (items.length === 0) return "";
    return accordionCardHtml(
      "Risk Screens",
      '<div class="alert-box"><ul>' + items.join("") + '</ul></div>'
    );
  }

  // ---- LBO-implied floor value (SPEC.md Sec.8h) ---------------------------
  // ADVISORY ONLY: informational, never affects fair_value_range or the
  // triangulation confidence -- the highest price a disciplined financial
  // buyer could justify today from pure debt-paydown returns (no organic
  // growth or multiple-expansion credit).
  function lboFloorCardHtml(valuation) {
    var detail = (valuation || {}).lbo_floor_detail;
    if (!detail || !isNum(detail.per_share)) return "";
    return accordionCardHtml(
      "LBO Anchor",
      '<div class="alert-box">' +
        '<div>' + fmtMoney(detail.per_share) + ' <span class="item-detail">' +
          '(informational, never enters the headline -- the highest price a disciplined financial ' +
          'buyer could pay today from pure debt-paydown returns alone)</span></div>' +
      '</div>'
    );
  }

  // Cycle position + two-regime read for a cyclical filer (SPEC.md Sec.26e).
  // Advisory: it never moves the headline fair value. It answers a different
  // question -- not "what is it worth" but "what does today's price force you
  // to believe about the cycle".
  var CYCLE_FLAG_LABELS = {
    peak_cycle_pe_trap: "Peak-cycle P/E trap",
    peak_annualization: "Peak-quarter annualization",
    regime_change_premium: "Regime-change premium",
  };

  function cycleCardHtml(valuation) {
    var cycle = (valuation || {}).cycle;
    if (!cycle) return "";
    var s = cycle.stats || {};
    var rows = [];

    function pct(v) { return isNum(v) ? fmtPct(v) : "—"; }
    function money(v) { return isNum(v) ? fmtMoney(v) : "—"; }
    function statRow(label, value) {
      rows.push('<tr><td class="bs-label">' + escapeHtml(label) + '</td>' +
                '<td class="bs-num">' + value + '</td></tr>');
    }

    statRow("Net margin (now)",
      pct(s.margin_current) + ' <span class="item-detail">' +
      escapeHtml((s.margin_current_basis || "") + ", " +
        (isNum(s.margin_percentile) ? Math.round(s.margin_percentile) + "th percentile" : "—")) +
      '</span>');
    statRow("Through-cycle mean / median", pct(s.margin_mean) + " / " + pct(s.margin_median));
    statRow("Trough / peak margin",
      pct(s.margin_trough) + ' <span class="item-detail">FY' + s.margin_trough_fy + '</span> / ' +
      pct(s.margin_peak) + ' <span class="item-detail">FY' + s.margin_peak_fy + '</span>');
    if (isNum(s.pb_current)) {
      statRow("P/B (now vs historical)",
        Number(s.pb_current).toFixed(2) + '× <span class="item-detail">trough ' +
        (isNum(s.pb_trough) ? Number(s.pb_trough).toFixed(2) : "—") + ' · median ' +
        (isNum(s.pb_median) ? Number(s.pb_median).toFixed(2) : "—") + ' · peak ' +
        (isNum(s.pb_peak) ? Number(s.pb_peak).toFixed(2) : "—") + '</span>');
    }

    function regimeRow(regime, label) {
      if (!regime) return;
      statRow(label, money(regime.low) + " · " + money(regime.center) + " · " + money(regime.high));
    }
    regimeRow(cycle.regime_a, "Regime A — cycle average");
    regimeRow(cycle.regime_b, "Regime B — structural break");

    var blend = cycle.blend || {};
    var blendKeys = Object.keys(blend).sort();
    if (blendKeys.length) {
      statRow("Blended FV(p)", blendKeys.map(function (p) {
        return "p=" + p + " " + money(blend[p]);
      }).join(" · "));
    }

    // Regime B sensitivity: margin x multiple.
    var sensHtml = "";
    var sens = (cycle.regime_b || {}).sensitivity;
    if (sens) {
      var margins = Object.keys(sens).sort();
      var mults = margins.length ? Object.keys(sens[margins[0]]).sort(function (a, b) {
        return Number(a) - Number(b);
      }) : [];
      sensHtml =
        '<table class="sensitivity-table bs-table"><thead><tr><th class="bs-label">Margin \\ Multiple</th>' +
        mults.map(function (x) { return '<th>' + x + '×</th>'; }).join("") +
        '</tr></thead><tbody>' +
        margins.map(function (m) {
          return '<tr><td class="bs-label">' + fmtPct(Number(m)) + '</td>' +
            mults.map(function (x) {
              return '<td class="bs-num">' + money(sens[m][x]) + '</td>';
            }).join("") + '</tr>';
        }).join("") +
        '</tbody></table>';
    }

    var fired = Object.keys(CYCLE_FLAG_LABELS).filter(function (k) {
      return (cycle.flags || {})[k];
    });
    var flagsHtml = fired.length
      ? '<div class="alert-box"><ul>' + fired.map(function (k) {
          return '<li>' + escapeHtml(CYCLE_FLAG_LABELS[k]) + '</li>';
        }).join("") + '</ul></div>'
      : "";

    return (
      '<div class="card"><div class="card-title">Cycle Position and Two Regimes</div>' +
        '<table class="sensitivity-table bs-table"><tbody>' + rows.join("") + '</tbody></table>' +
        (sensHtml ? '<div class="sens-axis-note">Regime B sensitivity (new-normal margin × exit multiple) — ' +
          'both are judgment inputs, not derived from the filing.</div>' + sensHtml : "") +
        '<div class="alert-box"><div>' + escapeHtml(cycle.verdict_sentence || "") + '</div></div>' +
        flagsHtml +
        '<div class="sens-axis-note">Informational: does not change the headline fair value. ' +
        'Cycle statistics computed over ' + escapeHtml(String(s.years)) + ' fiscal years.</div>' +
      '</div>'
    );
  }

  function flagsCardHtml(flags) {
    if (!flags || flags.length === 0) return "";
    var items = flags.map(function (f) {
      return (
        '<li>' + escapeHtml(f.message || f.code || "") +
        (f.detail ? '<span class="item-detail">' + escapeHtml(f.detail) + '</span>' : '') +
        '</li>'
      );
    }).join("");
    return (
      '<div class="card"><div class="card-title">⚠ Red Flags</div>' +
        '<div class="alert-box"><ul>' + items + '</ul></div>' +
      '</div>'
    );
  }

  // ---- Filing events card (recent 8-K item codes; only if events exist) ----
  // Deterministic, LLM-free: each entry is one recent 8-K classified by its
  // SEC item code(s) (see sec_analyzer/signals/events.py), colored by severity.
  function eventsCardHtml(events) {
    if (!events || events.length === 0) return "";
    var sevLabel = { critical: "CRITICAL", warning: "WARNING", info: "INFO" };
    var items = events.map(function (e) {
      var severity = e.severity || "info";
      var cats = (e.categories || []).join(", ");
      var itemsTxt = (e.items || []).join(", ");
      var detail = escapeHtml(e.date || "") + (itemsTxt ? " · 8-K item " + escapeHtml(itemsTxt) : "");
      return (
        '<li class="event-' + escapeHtml(severity) + '">' +
          '<span class="event-sev">' + escapeHtml(sevLabel[severity] || severity.toUpperCase()) + '</span>' +
          escapeHtml(cats) +
          '<span class="item-detail">' + detail + '</span>' +
        '</li>'
      );
    }).join("");
    return (
      '<div class="card"><div class="card-title">📄 Recent Filing Events (8-K)</div>' +
        '<div class="alert-box"><ul>' + items + '</ul></div>' +
      '</div>'
    );
  }

  // ---- LLM Kullanım Raporu (result.llm_report) ------------------------------
  // Shows *how* an LLM backend (if one ran) derived the valuation assumptions
  // and how they diverge from the deterministic script baseline -- purely
  // additive UI, absent on every pure no-AI (script) run. Every sub-field is
  // guarded independently so a partial/malformed payload degrades to the
  // existing "—" placeholder instead of throwing or printing
  // "None"/"NaN"/"undefined".
  var LLM_SCENARIO_ORDER = ["bear", "base", "bull"];
  var LLM_SCENARIO_LABEL = { bear: "Bear", base: "Base", bull: "Bull" };
  var LLM_FIELD_ORDER = ["growth_5y", "terminal_growth", "discount_rate"];
  var LLM_FIELD_LABEL = {
    growth_5y: "Growth (5y)",
    terminal_growth: "Terminal growth",
    discount_rate: "Discount rate"
  };

  // Signed "+1.5 pp" / "-2.0 pp" formatting for delta_vs_baseline_pp, which
  // arrives already in percentage points (not a decimal fraction) -- distinct
  // from fmtSignedPctTr's "%+X.X" convention used for the history screen.
  function fmtDeltaPp(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "+";
    return sign + Math.abs(num).toFixed(1) + " pp";
  }

  // One compact table (LLM suggestion / Script baseline / Used / Δ pp) plus
  // the scenario's rationale sentence -- reuses .sensitivity-table/.sens-base
  // exactly like the sensitivity/entry-plan cards do.
  function llmScenarioTableHtml(scenarioKey, scenario) {
    var fields = (scenario && scenario.fields) || {};
    var rows = LLM_FIELD_ORDER.map(function (fieldKey) {
      var f = fields[fieldKey] || {};
      var usedText = isNum(f.used) ? fmtPctTr(f.used) : "—";
      var clampBadge = f.clamped ? ' <span class="uncertainty-tag">clamped</span>' : "";
      return (
        '<tr>' +
          '<th class="sens-row-h">' + escapeHtml(LLM_FIELD_LABEL[fieldKey]) + '</th>' +
          '<td>' + (isNum(f.llm) ? fmtPctTr(f.llm) : "—") + '</td>' +
          '<td>' + (isNum(f.baseline) ? fmtPctTr(f.baseline) : "—") + '</td>' +
          '<td class="sens-base">' + usedText + clampBadge + '</td>' +
          '<td>' + fmtDeltaPp(f.delta_vs_baseline_pp) + '</td>' +
        '</tr>'
      );
    }).join("");

    var storyHtml = scenario && scenario.story
      ? '<div class="verdict-note">Rationale: ' + escapeHtml(scenario.story) + '</div>'
      : "";

    return (
      '<div class="tech-section-title">' + escapeHtml(LLM_SCENARIO_LABEL[scenarioKey] || scenarioKey) + '</div>' +
      '<table class="sensitivity-table llm-report-table">' +
        '<thead><tr><th></th><th>LLM suggestion</th><th>Script baseline</th><th>Used</th><th>Δ (pp)</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      storyHtml
    );
  }

  function llmReportCardHtml(result) {
    var llm = result && result.llm_report;
    if (!llm) return "";

    var bodyHtml;
    if (llm.used_llm === false) {
      // Variant 2: an LLM backend was requested but failed/unavailable; the
      // run fell back to deterministic rule-based assumptions. No scenario
      // tables in this variant -- there's nothing the LLM actually produced.
      bodyHtml =
        '<div class="mom-chip mom-chip-warn">The LLM was unavailable for this analysis; rule-based assumptions were used.</div>' +
        '<p class="verdict-note">Reason: ' + escapeHtml(safeText(llm.fallback)) + '</p>';
    } else if (llm.cached) {
      // Variant 3: assumptions came from a frozen/cached set -- the frozen
      // set's own detail lives elsewhere, so just show the provenance note.
      bodyHtml =
        '<div class="mom-chip mom-chip-info">' + escapeHtml(safeText(llm.note)) + '</div>' +
        '<p class="llm-report-source">Source: ' + escapeHtml(safeText(llm.provider)) + '</p>';
    } else {
      // Variant 1: the LLM actually produced the valuation assumptions --
      // provider/sector line, then one table + rationale per scenario.
      var providerLine = "Source: " + escapeHtml(safeText(llm.provider)) +
        (llm.model ? " · " + escapeHtml(String(llm.model)) : "");
      var sectorLine = llm.sector_type ? "Sector: " + escapeHtml(String(llm.sector_type)) : "";
      var headHtml =
        '<p class="card-sub">' + providerLine + (sectorLine ? " · " + sectorLine : "") + '</p>' +
        '<p class="verdict-note">This section shows how the LLM determined the valuation assumptions and ' +
          'what it changed relative to the deterministic (script) baseline.</p>';

      var scenarios = llm.scenarios || {};
      var scenariosHtml = LLM_SCENARIO_ORDER.map(function (key) {
        return scenarios[key] ? llmScenarioTableHtml(key, scenarios[key]) : "";
      }).join("");

      var notes = Array.isArray(llm.clamp_notes) ? llm.clamp_notes.filter(Boolean) : [];
      var notesHtml = notes.length
        ? '<div class="tech-section-title">Limitations</div>' +
          '<div class="alert-box"><ul>' +
            notes.map(function (n) { return '<li>' + escapeHtml(String(n)) + '</li>'; }).join("") +
          '</ul></div>'
        : "";

      bodyHtml = headHtml + scenariosHtml + notesHtml;
    }

    return accordionCardHtml("LLM Usage Report", bodyHtml);
  }

  // ---- Footer analysis (catalyst + summary) --------------------------------
  // No fabricated "Recommendation: ..." line -- only the real catalyst/
  // summary fields the pipeline actually produced.
  function footerAnalysisHtml(result) {
    var catalyst = result.catalyst;
    var summary = result.summary;
    var catalystHtml = catalyst
      ? '<p class="catalyst-line"><span class="badge-label">Catalyst</span>' + escapeHtml(catalyst) + '</p>'
      : "";
    return (
      '<div class="card">' +
        catalystHtml +
        '<p class="summary-text">' + escapeHtml(summary || "No summary available.") + '</p>' +
      '</div>'
    );
  }

  // ---- Accordion card ------------------------------------------------------
  // A card that ships collapsed (see .card-accordion). Advisory readings --
  // ones that inform but never move the headline verdict -- go through this
  // so they stay one click away instead of costing every reader the vertical
  // scroll. Returns "" for an empty body, so a reading that isn't in this
  // payload never leaves a disclosure row with nothing behind it.
  function accordionCardHtml(title, bodyHtml) {
    if (!bodyHtml) return "";
    return (
      '<details class="card card-accordion">' +
        '<summary class="card-title">' + title + '</summary>' +
        bodyHtml +
      '</details>'
    );
  }

  // ---- Two-up card row -----------------------------------------------------
  // Pairs small cards into a single grid row (see .card-grid). Any argument
  // may be "" -- a card that didn't render for this payload is dropped, and
  // a lone survivor is emitted bare rather than as a half-empty grid row.
  function cardGridHtml() {
    var parts = [].slice.call(arguments).filter(function (html) { return html; });
    if (parts.length < 2) return parts.join("");
    return '<div class="card-grid">' + parts.join("") + '</div>';
  }

  function globalFooterHtml() {
    return (
      '<div class="global-footer">' +
        '© Verdict Analysis Systems · SEC EDGAR + price data · educational use only, not investment advice.' +
      '</div>'
    );
  }

  // ---- Error card (result.error) -------------------------------------------
  function errorCardHtml(payload, result) {
    var errorLabel = result.error ? " (" + escapeHtml(String(result.error)) + ")" : "";
    return (
      headerCardHtml(payload) +
      '<div class="card">' +
        '<div class="error-box">' +
          '<strong>Analysis unavailable' + errorLabel + '</strong>' +
          '<p>' + escapeHtml(result.summary || "An unknown error occurred.") + '</p>' +
        '</div>' +
      '</div>' +
      globalFooterHtml()
    );
  }

  // ===================================================================
  // Balance-sheet tab
  // -------------------------------------------------------------------
  // Reads payload.financials (the serialized annual concept series +
  // pre-computed ratios from the fetch/normalize pipeline) and the
  // display-only payload.earnings (quarterly EPS beat/miss history). All
  // derived ratios come straight from the Python-computed `ratios` list --
  // nothing financial is recomputed client-side, so the tab stays a pure
  // formatter. Every cell is None-safe (renders "—", never "NaN").
  // ===================================================================

  //: Balance-sheet line items shown (canonical concept key -> display label),
  //: in display order. Keys must match _ANNUAL_CONCEPTS in web/app.py.
  var BS_ITEMS = [
    { key: "TotalAssets", label: "Total Assets" },
    { key: "CurrentAssets", label: "Current Assets" },
    { key: "Cash", label: "Cash and Equivalents" },
    { key: "TotalLiabilities", label: "Total Liabilities" },
    { key: "CurrentLiabilities", label: "Current Liabilities" },
    { key: "LongTermDebt", label: "Long-Term Debt" },
    { key: "StockholdersEquity", label: "Stockholders' Equity" },
  ];

  //: Number of most-recent fiscal years shown as columns in the tab's tables.
  var BS_MAX_YEARS = 6;

  // Year label for a record/ratio row: prefer the fiscal year, fall back to
  // the period-end year, then "—".
  function fyLabel(fy, periodEnd) {
    if (isNum(fy)) return String(Math.round(Number(fy)));
    if (periodEnd) return escapeHtml(String(periodEnd).slice(0, 4));
    return "—";
  }

  // ---- Balance-sheet raw-figures card -----------------------------------
  function balanceSheetCardHtml(annual) {
    // Collect the union of period-ends across the balance-sheet concepts,
    // newest first, capped at BS_MAX_YEARS. period_end is "YYYY-MM-DD", so a
    // lexical sort is chronological.
    var periodMeta = {};
    BS_ITEMS.forEach(function (item) {
      (annual[item.key] || []).forEach(function (rec) {
        var pe = rec && rec.period_end;
        if (pe && !(pe in periodMeta)) periodMeta[pe] = rec.fy;
      });
    });
    var periods = Object.keys(periodMeta).sort().reverse().slice(0, BS_MAX_YEARS);
    if (!periods.length) return "";

    // Per-concept lookup: period_end -> value.
    var byConcept = {};
    BS_ITEMS.forEach(function (item) {
      var map = {};
      (annual[item.key] || []).forEach(function (rec) {
        if (rec && rec.period_end) map[rec.period_end] = rec.value;
      });
      byConcept[item.key] = map;
    });

    var headCells = periods.map(function (pe) {
      return '<th>' + fyLabel(periodMeta[pe], pe) + '</th>';
    }).join("");

    var rows = BS_ITEMS.map(function (item) {
      var cells = periods.map(function (pe) {
        return '<td class="bs-num">' + fmtCompactMoney(byConcept[item.key][pe]) + '</td>';
      }).join("");
      return '<tr><td class="bs-label">' + escapeHtml(item.label) + '</td>' + cells + '</tr>';
    }).join("");

    return (
      '<div class="card">' +
        '<div class="card-title">Balance Sheet — Key Line Items</div>' +
        '<table class="sensitivity-table bs-table">' +
          '<thead><tr><th class="bs-label">Item</th>' + headCells + '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        '<div class="sens-axis-note">Source: SEC EDGAR companyfacts (annual, 10-K). Values are abbreviated (B = billion, M = million).</div>' +
      '</div>'
    );
  }

  // ---- Key-ratio trend card (all values pre-computed by compute_ratios) --
  // One <tr> per ratio; `fmt` formats a cell value, `colorFn` (optional)
  // returns a highlight class based on threshold breaches.
  function ratioRowHtml(label, cols, key, fmt, colorFn) {
    var cells = cols.map(function (r) {
      var v = r ? r[key] : null;
      var cls = (colorFn && isNum(v)) ? colorFn(Number(v)) : "";
      return '<td class="bs-num ' + cls + '">' + fmt(v) + '</td>';
    }).join("");
    return '<tr><td class="bs-label">' + escapeHtml(label) + '</td>' + cells + '</tr>';
  }

  function ratioTrendCardHtml(ratios, sectorType) {
    var cols = (ratios || []).slice(0, BS_MAX_YEARS);
    if (!cols.length) return "";

    // A deposit-funded lender classifies neither its assets nor its
    // liabilities by maturity, so a current ratio is an artifact of tagging
    // rather than a liquidity signal, and liabilities/equity runs at a
    // structurally higher level than the generic 2x bar (SPEC.md Sec.20c).
    var isFinancial = sectorType === "financial";

    var headCells = cols.map(function (r) {
      return '<th>' + fyLabel(r && r.fy, r && r.period_end) + '</th>';
    }).join("");

    // Raw multiples (not fractions): 2 decimals with a "×" suffix.
    function fmtX(v) { return isNum(v) ? Number(v).toFixed(2) + "×" : "—"; }
    // current_ratio: <1 is a liquidity concern (red), >=1.5 comfortable (green).
    function curRatioColor(v) { return v < 1 ? "bs-neg" : (v >= 1.5 ? "bs-pos" : ""); }
    // debt_to_equity: >2 leveraged (red), <1 conservative (green).
    function deColor(v) { return v > 2 ? "bs-neg" : (v < 1 ? "bs-pos" : ""); }
    // Deposit-inclusive leverage: >10 thin capitalization, <5 conservative.
    function finLeverageColor(v) { return v > 10 ? "bs-neg" : (v < 5 ? "bs-pos" : ""); }
    // Signed fractions (margins/growth/returns): positive green, negative red.
    function signColor(v) { return v > 0 ? "bs-pos" : (v < 0 ? "bs-neg" : ""); }

    var leverageRow = isFinancial
      ? ratioRowHtml("Liabilities / Equity (incl. deposits)", cols, "debt_to_equity", fmtX, finLeverageColor)
      : ratioRowHtml("Debt / Equity", cols, "debt_to_equity", fmtX, deColor);

    var rows =
      (isFinancial ? "" : ratioRowHtml("Current Ratio", cols, "current_ratio", fmtX, curRatioColor)) +
      leverageRow +
      ratioRowHtml("Net Margin", cols, "net_margin", fmtPct, signColor) +
      ratioRowHtml("Gross Margin", cols, "gross_margin", fmtPct, signColor) +
      ratioRowHtml("ROE", cols, "roe", fmtPct, signColor) +
      // ROTCE only where it adds information (SPEC.md Sec.23e): for a filer
      // with no goodwill it just duplicates ROE, and outside banking nobody
      // reads it. Sits under ROE so the goodwill drag reads as a pair.
      (isFinancial ? ratioRowHtml("ROTCE", cols, "rotce", fmtPct, signColor) : "") +
      ratioRowHtml("Revenue Growth (YoY)", cols, "yoy_revenue_growth", fmtPct, signColor) +
      ratioRowHtml("FCF Margin", cols, "fcf_margin", fmtPct, signColor);

    var footnote = isFinancial
      ? "The current ratio is undefined for financial institutions (assets/liabilities are not classified by maturity) and is not shown. Leverage is total liabilities including deposits / equity; &gt; 10 is flagged red. Ratios are computed from annual financials."
      : "Current ratio &lt; 1 and debt/equity &gt; 2 are flagged red. Ratios are computed from annual financials.";

    return (
      '<div class="card">' +
        '<div class="card-title">Key Ratios</div>' +
        '<table class="sensitivity-table bs-table">' +
          '<thead><tr><th class="bs-label">Ratio</th>' + headCells + '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        '<div class="sens-axis-note">' + footnote + '</div>' +
      '</div>'
    );
  }

  // ---- Expectations & earnings-beat card (display-only cross-check) ------
  // Combines the consensus analyst target (payload.analyst) with the
  // quarterly EPS beat/miss history (payload.earnings). Returns "" when
  // neither is available so the tab can still show the financials above it.
  function beatBadgeHtml(surprisePct) {
    if (!isNum(surprisePct)) return "";
    return Number(surprisePct) >= 0
      ? ' <span class="bs-badge bs-badge-pos">Beat</span>'
      : ' <span class="bs-badge bs-badge-neg">Miss</span>';
  }

  function earningsBeatTableHtml(earnings) {
    var quarters = (earnings && earnings.quarters) || [];
    if (!quarters.length) return "";

    var beats = 0, scored = 0;
    var rows = quarters.map(function (q) {
      q = q || {};
      var sp = q.surprise_pct;
      if (isNum(sp)) { scored += 1; if (Number(sp) >= 0) beats += 1; }
      var spCls = isNum(sp) ? (Number(sp) >= 0 ? "beat-pos" : "beat-neg") : "";
      var spText = isNum(sp) ? fmtSignedPct(sp) : "—";
      return (
        '<tr>' +
          '<td class="bs-label">' + escapeHtml(safeText(q.period)) + '</td>' +
          '<td class="bs-num">' + fmtMoney(q.eps_estimate) + '</td>' +
          '<td class="bs-num">' + fmtMoney(q.eps_actual) + '</td>' +
          '<td class="bs-num ' + spCls + '">' + spText + beatBadgeHtml(sp) + '</td>' +
        '</tr>'
      );
    }).join("");

    var summary = scored
      ? '<div class="card-sub">Beat expectations in ' + beats + ' of the last ' + scored +
        ' quarters.</div>'
      : "";
    var source = (earnings && earnings.source) ? escapeHtml(String(earnings.source)) : "yfinance";

    return (
      summary +
      '<table class="sensitivity-table bs-table">' +
        '<thead><tr>' +
          '<th class="bs-label">Quarter</th><th>EPS Estimate</th>' +
          '<th>EPS Actual</th><th>Surprise</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
      '<div class="sens-axis-note">External source: ' + source +
        ' — consensus EPS estimate vs. reported EPS. Does not feed the valuation engine.</div>'
    );
  }

  function expectationsCardHtml(payload) {
    var analystHtml = analystRowHtml(payload);
    var beatHtml = earningsBeatTableHtml(payload && payload.earnings);
    if (!analystHtml && !beatHtml) return "";
    return (
      '<div class="card">' +
        '<div class="card-title">Expectations and Beats</div>' +
        analystHtml +
        beatHtml +
      '</div>'
    );
  }

  // ---- Balance-sheet tab assembler --------------------------------------
  function financialsTabHtml(payload) {
    var fin = (payload && payload.financials) || {};
    var annual = fin.annual || {};
    var ratios = fin.ratios || [];

    var sectorType = ((payload && payload.result && payload.result.valuation) || {}).sector_type;

    var bsHtml = balanceSheetCardHtml(annual);
    var ratioHtml = ratioTrendCardHtml(ratios, sectorType);
    var expHtml = expectationsCardHtml(payload);

    if (!bsHtml && !ratioHtml && !expHtml) {
      return '<div class="card"><div class="empty-state">No balance-sheet data found for this stock.</div></div>';
    }
    return bsHtml + ratioHtml + expHtml;
  }

  // ===================================================================
  // renderBody -- the single body-rendering function shared by report
  // mode (called once, directly on `data`) and search mode (called again
  // on every successful /api/analyze fetch, on a reshaped payload).
  // `payload` shape: {ticker, horizon, price, as_of, result, metrics,
  // technical, red_flags, entity_name, financials, earnings}.
  // ===================================================================
  function renderBody(payload) {
    var result = payload.result || {};
    var pageEl = document.querySelector(".page");

    if (result.error) {
      // The error card is a single narrow box -- widening for it would just
      // stretch one sentence across the viewport.
      if (pageEl) pageEl.classList.remove("page-report");
      bodyEl.innerHTML = errorCardHtml(payload, result);
      return;
    }
    if (pageEl) pageEl.classList.add("page-report");

    var fv = result.fair_value_range || {};
    var technical = payload.technical || {};
    // result.valuation (SPEC.md Sec.11) is the richer engine payload; it's
    // absent for older callers or when phase-2 interpret() never ran (e.g.
    // an LLM error) -- the triangulation/sensitivity cards simply don't
    // render in that case, degrading to the simpler pre-valuation card set.
    var valuation = result.valuation || null;

    // Always-visible core, above the tab bar: what this is, how the two
    // signal families are weighted, and the one-paragraph thesis. These
    // three answer "should I care?" and are needed from every tab, so they
    // don't belong inside any one of them.
    var coreHtml =
      headerCardHtml(payload) +
      weightBarHtml(result._weights) +
      footerAnalysisHtml(result);

    // -- Valuation: what it's worth, and how that number was arrived at.
    var valuationHtml =
      priceChartCardHtml(technical, result, payload.horizon, payload.analyst) +
      fanChartCardHtml(result, payload.price) +
      (valuation ? methodSummaryCardHtml(valuation, "Valuation Methods Used") : "") +
      (valuation ? triangulationRowHtml(valuation, result.confidence) : "") +
      verdictCardHtml("Fundamental", result.fundamental_verdict, result.horizon_note) +
      (valuation ? sensitivityTableHtml(valuation.sensitivity) : "") +
      cardGridHtml(
        thesisMetricHtml(result.thesis_metric),
        scenarioReturnsListHtml(result.scenario_returns)
      ) +
      (valuation ? cycleCardHtml(valuation) : "") +
      // Collapsed: an advisory floor that by construction never moves the
      // headline fair value, so it doesn't get to interrupt the numbers
      // that do. Full width rather than paired with Cycle -- a one-line
      // closed accordion beside a tall card is a lopsided grid row.
      (valuation ? lboFloorCardHtml(valuation) : "");

    // -- Timing: whether now is the moment, and what unwinds that.
    // Profile Fit card intentionally removed from the UI for now (still
    // computed in the payload; just not rendered).
    var timingHtml =
      swingSetupCardHtml(payload, result, technical) +
      momentumCardHtml(result) +
      insiderCardHtml(result.insider) +
      (technical && technical.method_summary
        ? methodSummaryCardHtml(technical, "Technical Analysis Methods Used")
        : "") +
      technicalCardHtml(technical, result.technical_verdict || technical.verdict, payload.horizon) +
      entryPlanHtml(result.entry_plan, payload.price) +
      stopAddingHtml(result.stop_adding);

    // -- Risk: what breaks the thesis. The two open cards are the ones tied
    // to this filer right now; the two accordions below them are standing
    // diagnostics that are worth having on file but not worth reading on
    // every routine analysis.
    var riskHtml =
      cardGridHtml(flagsCardHtml(payload.red_flags), eventsCardHtml(result.events)) +
      (valuation ? distressFlagsCardHtml(valuation) : "") +
      llmReportCardHtml(result);

    var html =
      coreHtml +
      '<div class="view-tabs" id="view-tabs">' +
        '<button type="button" class="view-tab active" data-view="valuation">Valuation</button>' +
        '<button type="button" class="view-tab" data-view="timing">Timing</button>' +
        '<button type="button" class="view-tab" data-view="risk">Risk</button>' +
        '<button type="button" class="view-tab" data-view="balance">Balance Sheet</button>' +
      '</div>' +
      '<div data-view-pane="valuation">' + valuationHtml + '</div>' +
      '<div data-view-pane="timing" style="display:none;">' + timingHtml + '</div>' +
      '<div data-view-pane="risk" style="display:none;">' + riskHtml + '</div>' +
      '<div data-view-pane="balance" style="display:none;">' + financialsTabHtml(payload) + '</div>' +
      globalFooterHtml();

    bodyEl.innerHTML = html;
    wireFanChart(fv, result.scenario_returns);
    wirePriceRange(technical, result, payload.analyst);
    wireViewTabs();
  }

  // ===================================================================
  // View-tab wiring: shows the one [data-view-pane] matching the clicked
  // tab and hides the rest, so adding a tab is a markup change only. The
  // Valuation pane (with its charts) starts visible so the fan/price SVGs,
  // wired above, are laid out from the first paint; the other three are
  // inert markup and need no wiring of their own.
  // ===================================================================
  function wireViewTabs() {
    var tabs = document.getElementById("view-tabs");
    if (!tabs) return;
    var panes = bodyEl.querySelectorAll("[data-view-pane]");
    tabs.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".view-tab") : null;
      if (!btn) return;
      var view = btn.getAttribute("data-view");
      tabs.querySelectorAll(".view-tab").forEach(function (t) {
        t.classList.toggle("active", t === btn);
      });
      panes.forEach(function (pane) {
        pane.style.display = (pane.getAttribute("data-view-pane") === view) ? "" : "none";
      });
    });
  }

  // ===================================================================
  // Report mode: nav = brand + generated date; body renders immediately
  // from the baked payload.
  // ===================================================================
  function renderReportMode() {
    document.title = String(data.ticker || "") + " · " + String(data.horizon || "") + " · Verdict Terminal";
    // analysis_as_of (point-in-time backtest cutoff) is distinct from as_of
    // (the latest price-bar date, shown separately in the header source
    // note); null on every live run, so this banner is absent by default.
    var asofBannerHtml = data.analysis_as_of
      ? '<span class="asof-banner">Historical analysis — generated with data known as of ' +
        escapeHtml(data.analysis_as_of) + '</span>'
      : "";
    topnavEl.innerHTML =
      '<div class="nav-inner">' +
        '<span class="brand">VERDICT</span>' +
        (data.generated_on ? '<span class="nav-date">Generated ' + escapeHtml(data.generated_on) + '</span>' : "") +
        asofBannerHtml +
      '</div>';
    renderBody(data);
  }

  // ===================================================================
  // Search mode: nav carries live ticker/horizon/provider controls; the
  // body starts in a prompt state and is replaced by renderBody() (the
  // exact same function report mode uses) once /api/analyze succeeds.
  // ===================================================================
  function renderSearchMode() {
    document.title = "Verdict Terminal";
    var horizons = data.horizons || [["3m", "3m"], ["1y", "1y"], ["5y", "5y"]];
    var providers = data.providers || [];
    var state = {
      horizon: data.default_horizon || "1y",
      provider: data.default_provider || (providers[0] && providers[0][0]) || "",
    };

    var providerOptions = providers.map(function (p) {
      var sel = p[0] === state.provider ? " selected" : "";
      return '<option value="' + escapeHtml(p[0]) + '"' + sel + '>' + escapeHtml(p[1]) + '</option>';
    }).join("");

    // Point-in-time (as-of) analysis is opt-in: an empty date -- the
    // default -- runs the normal live analysis exactly as before. `max`
    // pins the native date picker to today so a future cutoff can't even be
    // selected client-side (the backend rejects one too either way).
    var todayStr = new Date().toISOString().slice(0, 10);

    topnavEl.innerHTML =
      '<div class="nav-inner">' +
        '<span class="brand">VERDICT</span>' +
        '<div class="nav-controls">' +
          '<input type="text" class="ticker-input" id="ticker-input" placeholder="TICKER" autocomplete="off" />' +
          horizonToggleHtml(horizons.map(function (h) { return h[0]; }), state.horizon, true, "nav-horizon-toggle") +
          '<select class="provider-select" id="provider-select">' + providerOptions + '</select>' +
          '<label class="asof-label" for="asof-input">As-of date (opt.)</label>' +
          '<input type="date" class="provider-select asof-input" id="asof-input" max="' + todayStr + '" />' +
          '<button type="button" class="analyze-btn" id="analyze-btn">Analyse</button>' +
          '<button type="button" class="history-nav-btn" id="history-nav-btn">History</button>' +
          '<button type="button" class="history-nav-btn" id="swing-nav-btn">Swing</button>' +
          '<button type="button" class="history-nav-btn" id="overview-nav-btn">Portfolio</button>' +
        '</div>' +
      '</div>';

    bodyEl.innerHTML = '<div class="card"><div class="empty-state">Enter a ticker above and press Analyse to generate a Verdict Terminal report.</div></div>';

    var tickerInput = document.getElementById("ticker-input");
    var providerSelect = document.getElementById("provider-select");
    var asofInput = document.getElementById("asof-input");
    var analyzeBtn = document.getElementById("analyze-btn");
    var horizonToggleEl = document.getElementById("nav-horizon-toggle");
    var historyNavBtn = document.getElementById("history-nav-btn");
    var swingNavBtn = document.getElementById("swing-nav-btn");
    var overviewNavBtn = document.getElementById("overview-nav-btn");

    // Only meaningful once a ticker is typed -- navigates to the read-only
    // verdict-history screen (mode: "history") for that ticker.
    historyNavBtn.addEventListener("click", function () {
      var ticker = tickerInput.value.trim().toUpperCase();
      if (!ticker) return;
      window.location.href = "/history?ticker=" + encodeURIComponent(ticker);
    });

    // Unlike the history button, the swing screener isn't ticker-scoped --
    // it always navigates straight to the S&P 500 screener page.
    swingNavBtn.addEventListener("click", function () {
      window.location.href = "/swing";
    });

    // Neither is the portfolio overview -- it dashboards every stored
    // verdict at once, not just the ticker currently typed in.
    overviewNavBtn.addEventListener("click", function () {
      window.location.href = "/overview";
    });

    horizonToggleEl.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest(".horizon-pill") : null;
      if (!btn) return;
      state.horizon = btn.getAttribute("data-horizon");
      horizonToggleEl.querySelectorAll(".horizon-pill").forEach(function (p) {
        p.classList.toggle("active", p === btn);
      });
    });

    providerSelect.addEventListener("change", function () {
      state.provider = providerSelect.value;
    });

    function showError(message) {
      bodyEl.innerHTML = '<div class="error-banner">' + escapeHtml(message) + '</div>';
    }

    // renderBody() (unlike renderReportMode()) never touches topnavEl, so a
    // search-mode as-of run needs its own small banner update here -- same
    // markup/class as the baked-report banner, injected into the still-live
    // search nav instead of rebuilding it. Called with null to clear a
    // previous run's banner before/when a live (non-as-of) run replaces it.
    function updateAsofBanner(analysisAsOf) {
      var existing = document.getElementById("search-asof-banner");
      if (existing) existing.remove();
      if (!analysisAsOf) return;
      var navInner = topnavEl.querySelector(".nav-inner");
      if (!navInner) return;
      navInner.insertAdjacentHTML(
        "beforeend",
        '<span class="asof-banner" id="search-asof-banner">Historical analysis — generated with data known as of ' +
          escapeHtml(analysisAsOf) + '</span>'
      );
    }

    // ---- Live progress card for the in-flight /api/analyze request --------
    // A run routinely takes far longer than the old "10-40 seconds" claim,
    // so instead of one frozen line we show a ticker heading + local timer,
    // a step counter, and a per-stage checklist kept in sync by polling
    // GET /api/analyze/progress?job=<id>. These handles/state are scoped to
    // the renderSearchMode() closure (not inside runAnalyze itself) so a
    // stray re-entrant call -- shouldn't happen since the button is disabled
    // mid-flight, but this is cheap insurance -- always tears down any prior
    // interval before a new run starts one.
    var progressPollHandle = null;
    var progressTimerHandle = null;
    var progressStartMs = 0;
    // Per-stage-key bookkeeping: progressStageEls holds the DOM refs created
    // the first time a key is seen (stage order/identity is fixed by the
    // server, so rows are created once and patched thereafter); progressState
    // remembers the last-applied {state, label} per key so an unchanged
    // stage is left completely untouched by the next poll -- touching a row
    // that didn't change would reset its .spinner CSS animation every tick.
    var progressStageEls = {};
    var progressStageState = {};

    function stopProgressUpdates() {
      if (progressPollHandle) { clearInterval(progressPollHandle); progressPollHandle = null; }
      if (progressTimerHandle) { clearInterval(progressTimerHandle); progressTimerHandle = null; }
    }

    // ~16-char alphanumeric id, unique enough to correlate this browser run
    // with its server-side progress record. Not a security token (just a
    // poll key visible in this tab's own request), so Math.random() is fine.
    function makeJobId() {
      var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      var id = "";
      for (var i = 0; i < 16; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return id;
    }

    function fmtElapsed(seconds) {
      var total = Math.max(0, Math.floor(seconds || 0));
      var m = Math.floor(total / 60);
      var s = total % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function tickProgressTimer() {
      var el = document.getElementById("analyze-progress-timer");
      if (!el) return; // card already replaced (final render/error landed)
      el.textContent = fmtElapsed((Date.now() - progressStartMs) / 1000);
    }

    // Builds the card's static shell immediately (before the first poll can
    // possibly resolve) so it "looks right" from frame one: heading + timer
    // + step counter placeholder, an empty stage list that fills in on the
    // first poll response, and the calm cold-cache note. escapeHtml() is
    // used here because ticker is spliced into an innerHTML string; the
    // per-stage patches below use textContent instead (see applyProgressPoll)
    // since that needs no escaping and escapeHtml()'s HTML-entity output
    // would otherwise show up literally (e.g. "&amp;") in plain text.
    function renderProgressCard(ticker) {
      progressStageEls = {};
      progressStageState = {};
      bodyEl.innerHTML =
        '<div class="card analyze-progress">' +
          '<div class="analyze-progress-head">' +
            '<span class="spinner"></span>' +
            '<span>Analyzing ' + escapeHtml(ticker) + '…</span>' +
            '<span class="analyze-timer" id="analyze-progress-timer">0:00</span>' +
          '</div>' +
          '<div class="analyze-stage-count" id="analyze-progress-count">Stage —/—</div>' +
          '<div class="analyze-stages" id="analyze-progress-stages"></div>' +
          '<div class="analyze-progress-note">The first run (cold cache) can take a few minutes; just leave this tab open.</div>' +
          '<div class="analyze-progress-error" id="analyze-progress-error" style="display:none"></div>' +
        '</div>';
    }

    // Applies one GET /api/analyze/progress response. Called both while
    // found:false (job not registered server-side yet -- normal for the
    // first tick or two, since the POST and the first poll race) and once
    // found:true; either way the response always carries the full `stages`
    // list per the backend contract, so the checklist renders identically
    // in both cases and needs no special-casing for "not found yet".
    function applyProgressPoll(json) {
      var stagesEl = document.getElementById("analyze-progress-stages");
      if (!stagesEl) return; // card already replaced by the final render

      var stages = (json && json.stages) || [];
      var total = Number(json && json.total) || stages.length;
      var stageIndex = Number(json && json.stage_index) || 0;
      var countEl = document.getElementById("analyze-progress-count");
      if (countEl) {
        // The server's stage_index is a 0-based cursor into _ANALYZE_STAGES
        // (see app.py's _ANALYZE_STAGE_INDEX), but the counter shown here is
        // human-facing and 1-based -- do not "simplify" this back to the raw
        // stage_index, that reintroduces the "Stage 0/10" off-by-one.
        if (!total) {
          countEl.textContent = "Stage —/—";
        } else if (!(json && json.found)) {
          countEl.textContent = "Stage —/" + total;
        } else if (json && json.done) {
          countEl.textContent = "Stage " + total + "/" + total;
        } else {
          countEl.textContent = "Stage " + Math.min(stageIndex + 1, total) + "/" + total;
        }
      }

      stages.forEach(function (stage) {
        var key = String((stage && stage.key) || "");
        if (!key) return;
        var newState = (stage && stage.state) || "pending";
        var label = (stage && stage.label) || "";
        var prev = progressStageState[key];
        if (prev && prev.state === newState && prev.label === label) return; // no change -- leave the DOM alone

        var refs = progressStageEls[key];
        if (!refs) {
          var row = document.createElement("div");
          var icon = document.createElement("span");
          icon.className = "analyze-stage-icon";
          var labelEl = document.createElement("span");
          labelEl.className = "analyze-stage-label";
          row.appendChild(icon);
          row.appendChild(labelEl);
          stagesEl.appendChild(row);
          refs = { row: row, icon: icon, label: labelEl };
          progressStageEls[key] = refs;
        }
        refs.row.className = "analyze-stage-row analyze-stage-" + newState;
        refs.icon.innerHTML = newState === "done" ? "&#10003;" : (newState === "active" ? '<span class="spinner"></span>' : "&middot;");
        refs.label.textContent = label;
        progressStageState[key] = { state: newState, label: label };
      });

      // A poll-reported error is shown inline but is advisory only -- the
      // pending POST's own response is still what decides success/failure
      // (see the .then/.catch chain below), so this never calls showError().
      var errorEl = document.getElementById("analyze-progress-error");
      if (errorEl) {
        var errText = (json && json.error) ? String(json.error) : "";
        errorEl.textContent = errText ? "Progress warning: " + errText : "";
        errorEl.style.display = errText ? "" : "none";
      }
    }

    function runAnalyze() {
      var ticker = tickerInput.value.trim().toUpperCase();
      if (!ticker) {
        showError("Please enter a ticker symbol.");
        return;
      }
      analyzeBtn.disabled = true;
      tickerInput.disabled = true;
      asofInput.disabled = true;
      updateAsofBanner(null);
      stopProgressUpdates(); // insurance -- see the comment on the vars above

      var jobId = makeJobId();
      renderProgressCard(ticker);
      progressStartMs = Date.now();
      tickProgressTimer();
      progressTimerHandle = setInterval(tickProgressTimer, 1000);

      function pollProgressOnce() {
        fetch("/api/analyze/progress?job=" + encodeURIComponent(jobId))
          .then(function (r) { return r.json(); })
          .then(function (json) { applyProgressPoll(json); })
          .catch(function () { /* transient network hiccup -- next tick retries, never surfaced as an analysis error */ });
      }
      // Fire the first poll immediately (rather than waiting a full 800ms)
      // so the checklist fills in as soon as possible, same pattern as the
      // swing screener's pollStatus()/startPolling() above.
      progressPollHandle = setInterval(pollProgressOnce, 800);
      pollProgressOnce();

      var requestBody = {
        ticker: ticker,
        years: 12,
        horizon: state.horizon,
        provider: state.provider,
        no_cache: false,
        job: jobId,
      };
      // Empty date = normal live analysis (the common case, unchanged from
      // before); a filled-in date is the only switch for point-in-time mode
      // -- no separate toggle. The backend validates it and 400s on a bad
      // or future date, which the existing showError() branch below already
      // surfaces.
      var asofValue = asofInput.value ? asofInput.value.trim() : "";
      if (asofValue) {
        requestBody.as_of = asofValue;
      }

      fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody),
      })
        .then(function (response) {
          return response.json().then(function (json) {
            return { ok: response.ok, json: json };
          });
        })
        .then(function (res) {
          if (!res.ok || !res.json || !res.json.ok) {
            var message = (res.json && res.json.error) || "Failed to run analysis.";
            showError(message);
            return;
          }
          var json = res.json;
          var technical = json.technical || null;
          var reportPayload = {
            ticker: ticker,
            horizon: state.horizon,
            price: (json.metrics || {}).price,
            as_of: technical ? technical.as_of : null,
            // json.as_of is /api/analyze's echoed point-in-time cutoff (the
            // request's as_of, string or null) -- distinct from the as_of
            // above (latest price-bar date). Mapping it through is what
            // lets headerCardHtml's macro-source note and the nav banner
            // (via updateAsofBanner below) know this was a backtest run.
            analysis_as_of: json.as_of || null,
            result: json.analysis || {},
            metrics: json.metrics || {},
            technical: technical || {},
            red_flags: json.red_flags || [],
            entity_name: json.name || null,
            analyst: json.analyst || null,
            // Feed the "Balance Sheet" tab: the annual/quarterly concept series +
            // ratios live at the top level of the /api/analyze response, and
            // the display-only earnings beat/miss history under `earnings`.
            financials: {
              annual: json.annual || {},
              quarterly: json.quarterly || {},
              ratios: json.ratios || [],
            },
            earnings: json.earnings || null,
          };
          updateAsofBanner(reportPayload.analysis_as_of);
          renderBody(reportPayload);
        })
        .catch(function (err) {
          showError("Network error: " + err.message);
        })
        .finally(function () {
          // Every exit path (success, error response, network error) ends
          // here, so this is the one place that must stop both the poll
          // interval and the 1s local timer -- otherwise a finished/failed
          // run keeps firing requests against a job id nothing is polling
          // for anymore, even after showError()/renderBody() has already
          // replaced the card those handles were updating.
          stopProgressUpdates();
          analyzeBtn.disabled = false;
          tickerInput.disabled = false;
          asofInput.disabled = false;
        });
    }

    analyzeBtn.addEventListener("click", runAnalyze);
    tickerInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        runAnalyze();
      }
    });
  }

  // ===================================================================
  // History mode: read-only screen listing every stored analysis run for
  // one ticker (mode: "history", built by generator.render_history_page /
  // GET /history). No live fetch, no controls -- just the stored
  // `verdicts` table rendered as a table, newest first.
  // `data` shape: {mode, ticker, rows, current_price, generated_on}.
  // ===================================================================

  // Caption above the table: current stored price plus its % change vs. the
  // most recent analysis run's price, when both are available. Renders ""
  // when current_price is absent -- the table still renders on its own.
  function historyCaptionHtml(currentPrice, rows) {
    if (!currentPrice || !isNum(currentPrice.close)) return "";
    var text = "Current price: " + fmtMoney(currentPrice.close) +
      " (" + escapeHtml(safeText(currentPrice.date)) + ")";
    var lastPrice = (rows && rows.length && isNum(rows[0].price)) ? Number(rows[0].price) : null;
    if (lastPrice) {
      var deltaPct = (Number(currentPrice.close) / lastPrice - 1) * 100;
      text += " · " + fmtSignedPctTr(deltaPct) + " vs. last analysis";
    }
    return '<div class="history-caption">' + text + '</div>';
  }

  // One <tr> per stored verdict row. Every field is optional/nullable (see
  // generator.render_history_page docstring) -- safeText/fmtMoney/isNum
  // guard every cell so a sparse row never prints "null"/"undefined"/"NaN".
  function historyRowHtml(row) {
    row = row || {};
    var analyzedDate = row.analyzed_at ? escapeHtml(String(row.analyzed_at).slice(0, 10)) : "—";
    var asOfCell = row.as_of
      ? escapeHtml(row.as_of) + ' <span class="asof-pill" title="Historical (as-of) analysis">as-of</span>'
      : "—";
    var fvBase = (isNum(row.fv_base_lo) && isNum(row.fv_base_hi))
      ? fmtMoney(row.fv_base_lo) + "–" + fmtMoney(row.fv_base_hi)
      : "—";
    return (
      '<tr>' +
        '<td>' + analyzedDate + '</td>' +
        '<td>' + asOfCell + '</td>' +
        '<td>' + escapeHtml(safeText(row.horizon)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.provider)) + '</td>' +
        '<td class="history-num">' + fmtMoney(row.price) + '</td>' +
        '<td class="history-num">' + fvBase + '</td>' +
        '<td>' + escapeHtml(safeText(row.fundamental_verdict)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.technical_verdict)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.confidence)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.sector_type)) + '</td>' +
      '</tr>'
    );
  }

  function renderHistoryMode() {
    var tickerText = String(data.ticker || "—");
    document.title = tickerText + " — Analysis History · Verdict Terminal";
    topnavEl.innerHTML =
      '<div class="nav-inner">' +
        '<span class="brand">VERDICT</span>' +
        (data.generated_on ? '<span class="nav-date">Generated ' + escapeHtml(data.generated_on) + '</span>' : "") +
      '</div>';

    var rows = data.rows || [];
    var headerHtml = '<div class="history-header">' + escapeHtml(tickerText) + ' — Analysis History</div>';

    if (!rows.length) {
      bodyEl.innerHTML =
        '<div class="card">' +
          headerHtml +
          '<div class="empty-state">No stored analysis found for this stock.</div>' +
        '</div>' +
        globalFooterHtml();
      return;
    }

    var tableHtml =
      '<table class="sensitivity-table history-table">' +
        '<thead><tr>' +
          '<th>Date</th><th>As-of</th><th>Horizon</th><th>Provider</th>' +
          '<th>Price</th><th>FV (base)</th><th>Fundamental</th><th>Technical</th>' +
          '<th>Confidence</th><th>Sector</th>' +
        '</tr></thead>' +
        '<tbody>' + rows.map(historyRowHtml).join("") + '</tbody>' +
      '</table>';

    bodyEl.innerHTML =
      '<div class="card">' +
        headerHtml +
        historyCaptionHtml(data.current_price, rows) +
        tableHtml +
      '</div>' +
      globalFooterHtml();
  }

  // ===================================================================
  // Swing mode: multi-index swing-trade screener (mode: "swing", built by
  // generator.render_swing_page / GET /swing?index=). `data` shape:
  // {mode, scan, index, indexes, generated_on}, where `scan` is the
  // SWING_SPEC.md Sec.4 dict for `index` (or null when that index has never
  // been scanned), `index` is the currently displayed index code, and
  // `indexes` is `[[code, label], ...]` in selector display order -- see
  // sec_analyzer/screener/swing_scan.py's scan_swing() return shape and
  // sec_analyzer/screener/universe.py's UNIVERSES.
  //
  // Unlike report/search mode, this page owns a small piece of live state
  // (the currently loaded rows + the active filter/sort) that survives
  // re-renders triggered by a background scan completing, so the table
  // never needs a full page reload once a scan finishes. Switching index is
  // the one exception: it is a plain navigation to /swing?index=<code> (see
  // swingIndexToggleHtml), not an in-page state change, so the server can
  // serve that index's own stored scan and the URL stays shareable.
  // ===================================================================

  // Swing setup label (SWING_SPEC.md Sec.3.10) -> one of the four verdict
  // color buckets already used everywhere else (see bucketColor above).
  // Order matters: "STRONG OPPORTUNITY" must be checked before the plain
  // "OPPORTUNITY" substring match so it isn't mistaken for the weaker grade.
  function swingLabelClass(label) {
    var s = String(label || "").toUpperCase();
    if (s.indexOf("STRONG") !== -1) return "green";
    if (s.indexOf("OPPORTUNITY") !== -1) return "green";
    if (s.indexOf("NEUTRAL") !== -1) return "amber";
    if (s.indexOf("WEAK") !== -1) return "caution";
    if (s.indexOf("AVOID") !== -1) return "red";
    return "muted";
  }

  // "2026-07-27T09:12:03Z" -> "2026-07-27 09:12:03 UTC"; falls back to "—"
  // for anything missing/unparsable rather than printing "undefined".
  function swingFormatTimestamp(v) {
    if (!v) return "—";
    return String(v).replace("T", " ").replace("Z", " UTC");
  }

  function swingBadgesHtml(badges) {
    if (!badges || !badges.length) return "—";
    return badges.map(function (b) {
      return '<span class="swing-chip">' + escapeHtml(String(b)) + '</span>';
    }).join("");
  }

  function swingScoreCellHtml(row) {
    if (!isNum(row.score)) return '<td>—</td>';
    var score = Math.max(0, Math.min(100, Number(row.score)));
    var cls = swingLabelClass(row.label);
    return (
      '<td>' +
        '<div class="swing-score-cell">' +
          '<span class="swing-score-num">' + Math.round(score) + '</span>' +
          '<span class="swing-score-bar-track">' +
            '<span class="swing-score-bar-fill ' + cls + '" style="width:' + score + '%;"></span>' +
          '</span>' +
        '</div>' +
      '</td>'
    );
  }

  // One <tr> per scanned ticker (SWING_SPEC.md Sec.4 row shape). Every field
  // is optional -- isNum/safeText guard each cell so a sparse row never
  // prints "null"/"undefined"/"NaN". The ticker links out to the full
  // verdict-card report in a new tab (3m horizon: this is a swing-trade
  // screener, not a long-horizon valuation call).
  function swingRowHtml(row, rank) {
    row = row || {};
    var tickerUpper = String(row.ticker || "").trim().toUpperCase();
    var href = "/report?ticker=" + encodeURIComponent(tickerUpper) + "&horizon=3m";
    var nameHtml = row.name ? '<div class="swing-name">' + escapeHtml(row.name) + '</div>' : "";
    var stopCell = isNum(row.stop)
      ? swingFmtPrice(row.stop) + (isNum(row.stop_pct) ? ' <span class="muted">(' + fmtSignedPct(row.stop_pct) + ')</span>' : "")
      : "—";
    var targetCell = isNum(row.target)
      ? swingFmtPrice(row.target) + (isNum(row.target_pct) ? ' <span class="muted">(' + fmtSignedPct(row.target_pct) + ')</span>' : "")
      : "—";
    return (
      '<tr>' +
        '<td>' + rank + '</td>' +
        '<td class="swing-ticker-cell">' +
          '<a class="swing-ticker-link" href="' + href + '" target="_blank" rel="noopener">' +
            escapeHtml(tickerUpper || "—") +
          '</a>' + nameHtml +
        '</td>' +
        '<td class="swing-left">' + escapeHtml(safeText(row.sector)) + '</td>' +
        '<td class="history-num">' + swingFmtPrice(row.price) + '</td>' +
        swingScoreCellHtml(row) +
        '<td><span class="badge badge-' + swingLabelClass(row.label) + '">' + escapeHtml(safeText(row.label)) + '</span></td>' +
        '<td class="swing-left">' + escapeHtml(safeText(row.setup)) + '</td>' +
        '<td class="history-num">' + (isNum(row.rsi14) ? Number(row.rsi14).toFixed(1) : "—") + '</td>' +
        '<td class="history-num">' + (isNum(row.dist_sma50_pct) ? fmtSignedPct(row.dist_sma50_pct) : "—") + '</td>' +
        '<td class="history-num">' + (isNum(row.rs_3m_pct) ? fmtSignedPct(row.rs_3m_pct) : "—") + '</td>' +
        '<td class="history-num">' + swingFmtPrice(row.entry) + '</td>' +
        '<td class="history-num">' + stopCell + '</td>' +
        '<td class="history-num">' + targetCell + '</td>' +
        '<td class="history-num">' + (isNum(row.rr) ? Number(row.rr).toFixed(2) : "—") + '</td>' +
        '<td class="swing-left">' + swingBadgesHtml(row.badges) + '</td>' +
      '</tr>'
    );
  }

  function renderSwingMode() {
    var pageEl = document.querySelector(".page");
    if (pageEl) pageEl.classList.add("page-wide");

    topnavEl.innerHTML =
      '<div class="nav-inner">' +
        '<span class="brand">VERDICT</span>' +
        '<div class="nav-controls">' +
          '<button type="button" class="history-nav-btn" id="swing-back-btn">Search</button>' +
          '<button type="button" class="history-nav-btn" id="swing-overview-btn">Portfolio</button>' +
        '</div>' +
      '</div>';
    var backBtn = document.getElementById("swing-back-btn");
    if (backBtn) backBtn.addEventListener("click", function () { window.location.href = "/"; });
    var overviewBtn = document.getElementById("swing-overview-btn");
    if (overviewBtn) overviewBtn.addEventListener("click", function () { window.location.href = "/overview"; });

    // Live state for this page: the currently loaded scan (baked payload or
    // whatever /api/swing/results last returned), the scan-in-progress
    // status, any transient scan-start message (e.g. a 409), and the
    // client-side filter/sort/page the table is rendered through. Sortable
    // columns per SWING_SPEC.md Sec.7: Skor/RSI/RS 3a/R:R. Pagination
    // (Sec.7 item 3) is entirely client-side over this same filtered+sorted
    // set -- `page` is 1-based and reset to 1 whenever a filter or the sort
    // column changes, so the table never shows a stale/out-of-range page.
    //
    // `index`/`indexes` back the index selector (SWING_SPEC.md Sec.7): the
    // baked payload names the currently displayed index and the full
    // selector list, in display order. `runningIndex`/`runningIndexLabel`
    // track which index's scan the background worker is (or was last)
    // running, as reported by GET /api/swing/status -- used to tell "my
    // scan finished" from "some other index's scan finished" so a foreign
    // scan can never overwrite this table.
    var SWING_PAGE_SIZE = 50;
    var state = {
      index: data.index || "SP500",
      indexes: Array.isArray(data.indexes) ? data.indexes : [],
      meta: (data.scan && typeof data.scan === "object") ? data.scan : null,
      rows: [],
      running: false,
      done: 0,
      total: 0,
      runningIndex: null,
      runningIndexLabel: null,
      message: "",
      sortKey: "score",
      sortDir: "desc",
      minScore: null,
      setupFilter: "",
      textFilter: "",
      page: 1,
    };
    state.rows = (state.meta && state.meta.rows) || [];
    document.title = "Swing Trade Opportunities — " + swingIndexLabel(state.index) + " · Verdict Terminal";

    // Display label for an index code, from state.indexes -- falls back to
    // the raw code (never "undefined"/"None") if it isn't in the list.
    function swingIndexLabel(code) {
      var match = (state.indexes || []).filter(function (p) { return p && p[0] === code; })[0];
      return match ? String(match[1]) : String(code || "—");
    }

    // Index selector: a segmented pill row (reusing .horizon-pill /
    // .horizon-toggle) built from state.indexes, current index active.
    // Each pill is a real <a> to /swing?index=<code> -- a plain page
    // navigation, not a fetch, so the server renders that index's own
    // stored scan and the URL stays shareable/bookmarkable
    // (SWING_SPEC.md Sec.7: "Index selector").
    function swingIndexToggleHtml() {
      if (!state.indexes.length) return "";
      var pills = state.indexes.map(function (pair) {
        var code = String((pair && pair[0]) || "");
        var label = String((pair && pair[1]) || code || "—");
        var active = code === state.index ? " active" : "";
        return '<a href="/swing?index=' + encodeURIComponent(code) + '" class="horizon-pill' +
          active + '">' + escapeHtml(label) + '</a>';
      }).join("");
      return '<div class="horizon-toggle interactive swing-index-toggle">' + pills + '</div>';
    }

    var pollHandle = null;

    function stopPolling() {
      if (pollHandle) {
        clearInterval(pollHandle);
        pollHandle = null;
      }
    }

    function updateHeaderCard() {
      var card = document.getElementById("swing-header-card");
      if (!card) return;
      var meta = state.meta;
      var metaLine = meta
        ? "Generated: " + escapeHtml(swingFormatTimestamp(meta.generated_at)) +
          " · Price date: " + escapeHtml(safeText(meta.price_as_of)) +
          " · " + (isNum(meta.count) ? Math.round(Number(meta.count)) : 0) + " stocks" +
          " · " + ((meta.skipped && meta.skipped.length) || 0) + " skipped"
        : "No scan has been run yet.";
      // Only the running scan for the CURRENTLY DISPLAYED index gets the
      // done/total progress bar. A scan running for a different index still
      // disables the button (one scan at a time globally, SWING_SPEC.md
      // Sec.6) but is called out as a note naming that index instead, so it's
      // never mistaken for progress on the visible table.
      var sameIndexRunning = state.running && state.runningIndex === state.index;
      var otherIndexRunning = state.running && state.runningIndex && state.runningIndex !== state.index;
      var progressHtml = sameIndexRunning
        ? '<div class="swing-progress"><span class="spinner"></span>Scanning: ' +
          state.done + '/' + state.total + '</div>'
        : "";
      var noteHtml = otherIndexRunning
        ? '<div class="swing-scan-msg">' +
          'A scan for ' + escapeHtml(state.runningIndexLabel || swingIndexLabel(state.runningIndex)) +
          ' is running; try again once it finishes.</div>'
        : "";
      var msgHtml = state.message
        ? '<div class="swing-scan-msg">' + escapeHtml(state.message) + '</div>'
        : "";
      card.innerHTML =
        '<div class="header-row">' +
          '<div class="header-left">' +
            '<div class="ticker-line"><span class="ticker">Swing Trade Opportunities — ' +
              escapeHtml(swingIndexLabel(state.index)) + '</span></div>' +
            swingIndexToggleHtml() +
            '<div class="source-note">' + metaLine + '</div>' +
          '</div>' +
          '<div class="header-right">' +
            '<button type="button" class="analyze-btn" id="swing-scan-btn"' +
              (state.running ? " disabled" : "") + '>Start Scan</button>' +
          '</div>' +
        '</div>' +
        progressHtml + noteHtml + msgHtml;
      var btn = document.getElementById("swing-scan-btn");
      if (btn) btn.addEventListener("click", startScan);
    }

    function setScanMessage(msg) {
      state.message = msg || "";
      updateHeaderCard();
    }

    function swingFilterBarHtml() {
      var setups = {};
      (state.rows || []).forEach(function (r) {
        if (r && r.setup) setups[r.setup] = true;
      });
      var setupOptions = '<option value="">All setups</option>' +
        Object.keys(setups).sort().map(function (s) {
          return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>';
        }).join("");
      return (
        '<div class="swing-filter-bar" id="swing-filter-bar">' +
          '<label for="swing-min-score">Min. score</label>' +
          '<input type="number" min="0" max="100" class="swing-filter-input swing-score-input" ' +
            'id="swing-min-score" placeholder="0" />' +
          '<label for="swing-setup-select">Setup</label>' +
          '<select class="swing-filter-select" id="swing-setup-select">' + setupOptions + '</select>' +
          '<label for="swing-text-filter">Stock / company</label>' +
          '<input type="text" class="swing-filter-input swing-text-input" ' +
            'id="swing-text-filter" placeholder="e.g. AAPL" autocomplete="off" />' +
        '</div>'
      );
    }

    function wireFilterBar() {
      var minScoreEl = document.getElementById("swing-min-score");
      var setupEl = document.getElementById("swing-setup-select");
      var textEl = document.getElementById("swing-text-filter");
      if (minScoreEl) {
        minScoreEl.addEventListener("input", function () {
          var v = minScoreEl.value.trim();
          state.minScore = (v === "" || Number.isNaN(Number(v))) ? null : Number(v);
          state.page = 1;
          renderTable();
        });
      }
      if (setupEl) {
        setupEl.addEventListener("change", function () {
          state.setupFilter = setupEl.value;
          state.page = 1;
          renderTable();
        });
      }
      if (textEl) {
        textEl.addEventListener("input", function () {
          state.textFilter = textEl.value.trim().toLowerCase();
          state.page = 1;
          renderTable();
        });
      }
    }

    function filteredSortedRows() {
      var rows = (state.rows || []).filter(function (r) {
        if (!r) return false;
        if (state.minScore !== null) {
          if (!isNum(r.score) || Number(r.score) < state.minScore) return false;
        }
        if (state.setupFilter && r.setup !== state.setupFilter) return false;
        if (state.textFilter) {
          var hay = (String(r.ticker || "") + " " + String(r.name || "")).toLowerCase();
          if (hay.indexOf(state.textFilter) === -1) return false;
        }
        return true;
      });
      var key = state.sortKey;
      var dir = state.sortDir === "asc" ? 1 : -1;
      rows.sort(function (a, b) {
        var av = a ? a[key] : null;
        var bv = b ? b[key] : null;
        var an = isNum(av), bn = isNum(bv);
        // Missing values always sort to the bottom, regardless of direction.
        if (an && !bn) return -1;
        if (!an && bn) return 1;
        if (an && bn && Number(av) !== Number(bv)) return (Number(av) - Number(bv)) * dir;
        return String(a.ticker || "").localeCompare(String(b.ticker || ""));
      });
      return rows;
    }

    // key -> header label, for the four sortable columns
    // (SWING_SPEC.md Sec.7: "Column headers for Score, RSI, RS 3m, R:R are
    // click-to-sort").
    function swingSortArrow(key) {
      if (state.sortKey !== key) return "";
      return state.sortDir === "asc" ? " ▲" : " ▼";
    }

    function swingHeaderCellHtml(key, label) {
      return '<th class="sortable" data-sort-key="' + key + '">' +
        escapeHtml(label) + swingSortArrow(key) + '</th>';
    }

    // Windowed page-number list for the pager (SWING_SPEC.md Sec.7: "with
    // ~11 pages a windowed pager ... is fine"). Small page counts (<=7) show
    // every page; larger ones show first/last plus a small window around
    // the current page, with "..." gaps -- e.g. totalPages=11, page=5 ->
    // [1, "...", 3, 4, 5, 6, 7, "...", 11].
    function swingPagerWindow(page, totalPages) {
      if (totalPages <= 7) {
        var all = [];
        for (var i = 1; i <= totalPages; i++) all.push(i);
        return all;
      }
      var pages = [1];
      var lo = Math.max(2, page - 2);
      var hi = Math.min(totalPages - 1, page + 2);
      if (lo > 2) pages.push("...");
      for (var p = lo; p <= hi; p++) pages.push(p);
      if (hi < totalPages - 1) pages.push("...");
      pages.push(totalPages);
      return pages;
    }

    // Pager controls below the table: Previous/Next, page numbers, and an
    // "X–Y / N" counter (SWING_SPEC.md Sec.7 item 3). Renders "" for a
    // single page so a <=50-row result shows a plain table, no pager.
    function swingPagerHtml(total, page, totalPages) {
      if (totalPages <= 1) return "";
      var startIdx = (page - 1) * SWING_PAGE_SIZE + 1;
      var endIdx = Math.min(page * SWING_PAGE_SIZE, total);
      var buttonsHtml = swingPagerWindow(page, totalPages).map(function (p) {
        if (p === "...") return '<span class="swing-pager-ellipsis">…</span>';
        var active = p === page ? " active" : "";
        return '<button type="button" class="swing-pager-btn' + active + '" data-page="' + p + '">' + p + '</button>';
      }).join("");
      return (
        '<div class="swing-pager">' +
          '<button type="button" class="swing-pager-nav" id="swing-pager-prev"' +
            (page <= 1 ? " disabled" : "") + '>Previous</button>' +
          '<div class="swing-pager-pages">' + buttonsHtml + '</div>' +
          '<button type="button" class="swing-pager-nav" id="swing-pager-next"' +
            (page >= totalPages ? " disabled" : "") + '>Next</button>' +
          '<span class="swing-pager-count">' + startIdx + '–' + endIdx + ' / ' + total + '</span>' +
        '</div>'
      );
    }

    function wirePager(container, totalPages) {
      var pagerEl = container.querySelector(".swing-pager");
      if (!pagerEl) return;
      pagerEl.addEventListener("click", function (e) {
        var btn = e.target.closest ? e.target.closest("button") : null;
        if (!btn || btn.disabled) return;
        if (btn.id === "swing-pager-prev") {
          if (state.page > 1) { state.page -= 1; renderTable(); }
          return;
        }
        if (btn.id === "swing-pager-next") {
          if (state.page < totalPages) { state.page += 1; renderTable(); }
          return;
        }
        var p = btn.getAttribute("data-page");
        if (p) {
          state.page = Number(p);
          renderTable();
        }
      });
    }

    // Rebuilds only #swing-table-container (table + pager) -- never the
    // filter bar -- so paginating/sorting/filtering can't steal focus from
    // (or clear the value of) the text filter input (SWING_SPEC.md Sec.7
    // item 3: "no refetch on page change"; the same no-refetch/no-shell-
    // rebuild contract applies to filter/sort changes too).
    function renderTable() {
      var container = document.getElementById("swing-table-container");
      if (!container) return;
      if (!state.meta) {
        container.innerHTML = '<div class="card"><div class="empty-state">No scan has been run yet.</div></div>';
        return;
      }
      var allRows = filteredSortedRows();
      if (!allRows.length) {
        container.innerHTML =
          '<div class="card"><div class="empty-state">No stocks match the filters.</div></div>';
        return;
      }
      var totalPages = Math.max(1, Math.ceil(allRows.length / SWING_PAGE_SIZE));
      // Clamp rather than trust state.page verbatim -- a filter change can
      // shrink the result set out from under whatever page was active.
      if (state.page > totalPages) state.page = totalPages;
      if (state.page < 1) state.page = 1;
      var startIdx = (state.page - 1) * SWING_PAGE_SIZE;
      var pageRows = allRows.slice(startIdx, startIdx + SWING_PAGE_SIZE);

      container.innerHTML =
        '<div class="card">' +
          '<div class="swing-table-wrap">' +
            '<table class="sensitivity-table swing-table">' +
              '<thead><tr>' +
                '<th>#</th>' +
                '<th class="swing-left">Stock</th>' +
                '<th class="swing-left">Sector</th>' +
                '<th>Price</th>' +
                swingHeaderCellHtml("score", "Score") +
                '<th>Label</th>' +
                '<th class="swing-left">Setup</th>' +
                swingHeaderCellHtml("rsi14", "RSI") +
                '<th>SMA50 %</th>' +
                swingHeaderCellHtml("rs_3m_pct", "RS 3m") +
                '<th>Entry</th><th>Stop</th><th>Target</th>' +
                swingHeaderCellHtml("rr", "R:R") +
                '<th class="swing-left">Badges</th>' +
              '</tr></thead>' +
              // Rank (#) is the row's ABSOLUTE position in the filtered+sorted
              // set (startIdx + i + 1), not its index on the page -- page 2
              // starts at 51, not 1 (SWING_SPEC.md Sec.7 item 3).
              '<tbody>' + pageRows.map(function (r, i) { return swingRowHtml(r, startIdx + i + 1); }).join("") + '</tbody>' +
            '</table>' +
          '</div>' +
          swingPagerHtml(allRows.length, state.page, totalPages) +
        '</div>';
      var thead = container.querySelector("thead");
      if (thead) {
        thead.addEventListener("click", function (e) {
          var th = e.target.closest ? e.target.closest("th.sortable") : null;
          if (!th) return;
          var key = th.getAttribute("data-sort-key");
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.sortKey = key;
            state.sortDir = "desc";
          }
          state.page = 1;
          renderTable();
        });
      }
      wirePager(container, totalPages);
    }

    // Rebuilds the whole body (header card + filter bar + table) -- used on
    // first load and whenever a freshly completed scan replaces state.meta.
    // Polling ticks in between only touch the header card (see
    // updateHeaderCard) so in-progress filter/sort input isn't reset.
    function renderShell() {
      bodyEl.innerHTML =
        '<div class="card" id="swing-header-card"></div>' +
        (state.meta ? swingFilterBarHtml() : "") +
        '<div id="swing-table-container"></div>' +
        globalFooterHtml();
      updateHeaderCard();
      if (state.meta) wireFilterBar();
      renderTable();
    }

    function loadResults() {
      fetch("/api/swing/results?index=" + encodeURIComponent(state.index))
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (json && json.ok) {
            state.meta = json.scan || null;
            state.rows = (state.meta && state.meta.rows) || [];
          }
          renderShell();
        })
        .catch(function () {
          setScanMessage("A network error occurred while loading the scan results.");
        });
    }

    function pollStatus() {
      fetch("/api/swing/status")
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (!json || !json.ok) return;
          state.running = !!json.running;
          state.done = json.done || 0;
          state.total = json.total || 0;
          state.runningIndex = json.index || null;
          state.runningIndexLabel = json.index_label || null;
          if (json.error) state.message = json.error;
          updateHeaderCard();
          if (!state.running) {
            stopPolling();
            // A scan that just finished for a DIFFERENT index than the one
            // shown here must never overwrite this table (SWING_SPEC.md
            // Sec.7 item 5) -- only reload when it's ours, or when no index
            // is known at all (fresh server, nothing to conflict with).
            if (!state.runningIndex || state.runningIndex === state.index) {
              loadResults();
            }
          }
        })
        .catch(function () { /* transient network error -- next tick retries */ });
    }

    function startPolling() {
      if (pollHandle) return;
      pollHandle = setInterval(pollStatus, 2000);
      pollStatus();
    }

    function startScan() {
      var btn = document.getElementById("swing-scan-btn");
      if (btn) btn.disabled = true;
      setScanMessage("");
      // No `limit` -- the UI always scans the full universe (SWING_SPEC.md
      // Sec.7 item 4); `limit` stays API-only, for CLI/smoke runs. `index`
      // is the currently selected/displayed index, so the button always
      // scans what's on screen.
      fetch("/api/swing/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ no_cache: false, index: state.index }),
      })
        .then(function (response) {
          return response.json().then(function (json) {
            return { status: response.status, json: json };
          });
        })
        .then(function (res) {
          if (res.status === 409) {
            // Another scan (possibly for a different index) is already
            // running -- surface the server's error (it names the index
