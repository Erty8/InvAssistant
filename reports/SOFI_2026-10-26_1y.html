<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verdict Terminal</title>
<style>
  /* Dark-only "terminal" palette -- this design deliberately commits to a
     single dark theme (see sec_analyzer/web/templates' prior design intent
     for the same call), matching the supplied mockup. */
  :root {
    color-scheme: dark;
    --bg: #0d1420;
    --card: #111b2b;
    --border: #223349;
    --text: #e0e2ea;
    --muted: #8b919d;
    --outline: #c0c7d3;
    --primary: #5aa7ff;
    --primary-light: #a2c9ff;
    --green: #4de082;
    --amber: #ffb953;
    --caution: #ff8a3d;
    --red: #ffb4ab;
    --red-container: #93000a;

    /* --- Tone system --------------------------------------------------
       Two registers, deliberately unequal in weight:

         ALERT      the saturated --green/--amber/--caution/--red above.
                    Reserved for a call the reader may act on: verdict
                    badges, red flags, entry triggers, invalidation stops.
         REFERENCE  the *-ref hues below, for data that merely *has* a
                    sign -- analyst consensus, balance-sheet cells, beat
                    history, sector comparisons, score breakdowns. Same
                    hue family, pulled toward --outline so a screen full
                    of them never competes with one real alert.

       Structural chrome (card borders, meter tracks, row washes) takes no
       hue at all and stays on --border/--muted. */
    --green-ref: #8fbfa4;
    --amber-ref: #c9ab7d;
    --red-ref: #cb9c97;

    /* Tinted-pill surfaces. Every badge/tag/chip draws its fill+line from
       one of these pairs instead of re-typing an rgba() literal. */
    --fill-pos: rgba(77, 224, 130, 0.15);
    --line-pos: rgba(77, 224, 130, 0.4);
    --fill-neg: rgba(255, 180, 171, 0.15);
    --line-neg: rgba(147, 0, 10, 0.55);
    --fill-warn: rgba(255, 185, 83, 0.15);
    --line-warn: rgba(255, 185, 83, 0.4);
    --fill-caution: rgba(255, 138, 61, 0.16);
    --line-caution: rgba(255, 138, 61, 0.5);
    --fill-neutral: rgba(139, 145, 157, 0.14);
    --line-neutral: rgba(139, 145, 157, 0.4);
    --fill-info: rgba(90, 167, 255, 0.14);
    --line-info: rgba(90, 167, 255, 0.4);

    /* Half-strength washes for whole rows and panels, where a
       pill-strength fill spread across a wide block reads as an alert it
       isn't. */
    --wash-pos: rgba(77, 224, 130, 0.06);
    --wash-neg: rgba(255, 180, 171, 0.06);
    --wash-warn: rgba(255, 185, 83, 0.08);
    --wash-info: rgba(90, 167, 255, 0.10);

    /* Shared meter track + its two threshold zones (see "Track meters"). */
    --track-bg: #1a2436;
    --zone-pos: rgba(77, 224, 130, 0.20);
    --zone-neg: rgba(255, 180, 171, 0.20);

    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.45;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- Top nav ---------------------------------------------------------*/
  .topnav {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(13, 20, 32, 0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    padding: 16px 0;
    margin: 0 0 20px;
  }
  .nav-inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  .brand {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--primary-light);
    letter-spacing: 0.01em;
    flex-shrink: 0;
  }
  .nav-date {
    font-size: 0.78rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .nav-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    flex: 1 1 auto;
  }
  .ticker-input {
    width: 11ch;
    text-transform: uppercase;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  .ticker-input:focus {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  .provider-select {
    font-size: 0.82rem;
    padding: 7px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-family: var(--sans);
    max-width: 220px;
  }
  .analyze-btn {
    font-size: 0.86rem;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #06111f;
    cursor: pointer;
  }
  .analyze-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ---- Search-mode as-of date control (reuses .provider-select's box
     styling; only adds the bits a native <input type=date> needs) --------*/
  .asof-label {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .asof-input {
    max-width: 150px;
    color-scheme: dark;
  }
  .asof-input:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ---- History nav button (search mode) + as-of banner (report mode) ----*/
  .history-nav-btn {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .history-nav-btn:hover { color: var(--text); border-color: var(--muted); }
  .asof-banner {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--amber);
    background: rgba(255, 185, 83, 0.12);
    border: 1px solid rgba(255, 185, 83, 0.35);
    border-radius: 999px;
    padding: 3px 10px;
  }

  /* ---- Shared horizon-toggle pill row ------------------------------------*/
  .horizon-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .horizon-pill {
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 6px 12px;
    background: transparent;
    color: var(--muted);
    border: none;
    border-right: 1px solid var(--border);
    cursor: default;
  }
  .horizon-pill:last-child { border-right: none; }
  .horizon-toggle.interactive .horizon-pill { cursor: pointer; }
  .horizon-pill.active {
    background: rgba(90, 167, 255, 0.18);
    color: var(--primary-light);
  }
  /* .horizon-pill is also reused as an <a> (the swing index selector) --
     reset link defaults so it matches the <button> variant exactly. */
  a.horizon-pill {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }

  /* ---- Cards -------------------------------------------------------------*/
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ---- Header card ---------------------------------------------------- */
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    flex-wrap: wrap;
  }
  .header-left .ticker-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ticker {
    font-family: var(--mono);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .entity-name {
    font-size: 0.9rem;
    color: var(--muted);
  }
  .source-note {
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .header-right {
    text-align: right;
    flex-shrink: 0;
  }
  .price-value {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: 700;
  }
  /* Daily change chip next to the header price. */
  .price-change {
    font-family: var(--mono);
    font-size: 0.9rem;
    font-weight: 600;
    margin-left: 8px;
    vertical-align: middle;
    white-space: nowrap;
  }
  .price-change.chg-up { color: var(--green); }
  .price-change.chg-down { color: var(--red); }
  .price-change.chg-flat { color: var(--muted); }

  /* ---- Analyst consensus reference row (display-only cross-check, NOT the
     model's own fair value -- kept visually subordinate to the header
     price/verdict) --------------------------------------------------------*/
  .analyst-consensus {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .analyst-consensus .ac-label {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.66rem;
    color: var(--muted);
    margin-right: 6px;
  }
  .analyst-consensus .ac-mean {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--text);
  }
  .analyst-consensus .ac-up { color: var(--green-ref); }
  .analyst-consensus .ac-down { color: var(--red-ref); }
  .analyst-consensus .ac-count,
  .analyst-consensus .ac-range { color: var(--muted); }
  .analyst-consensus .ac-caption {
    margin-top: 4px;
    font-size: 0.7rem;
    line-height: 1.4;
  }

  /* ---- Signal-weight bar ------------------------------------------------*/
  .weight-bar {
    display: flex;
    height: 24px;
    border-radius: 6px;
    overflow: hidden;
    margin: 0 0 16px;
    border: 1px solid var(--border);
  }
  .weight-seg {
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    overflow: hidden;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    font-family: var(--mono);
  }
  .weight-fundamental { background: rgba(90, 167, 255, 0.28); color: var(--primary-light); }
  .weight-technical { background: rgba(255, 185, 83, 0.28); color: var(--amber); }

  /* ---- Fan chart (fair-value ruler) --------------------------------------*/
  .fan-empty {
    font-size: 0.85rem;
  }
  .fan-outer {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .fan-labels {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    width: 38px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--muted);
    padding-top: 2px;
    font-family: var(--mono);
  }
  .fan-labels span {
    height: 24px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
  }
  .fan-labels span:last-child { margin-bottom: 0; }
  .fan-plot {
    position: relative;
    flex: 1;
    padding-top: 2px;
  }
  .fan-row-track {
    position: relative;
    height: 24px;
    margin-bottom: 8px;
    background: rgba(255, 255, 255, 0.04);
    border-radius: 5px;
    cursor: pointer;
  }
  .fan-row-track:last-child { margin-bottom: 0; }
  .fan-row-track.selected {
    box-shadow: 0 0 0 1px var(--outline) inset;
  }
  .fan-band {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 5px;
    border: 1px solid;
  }
  .fan-val {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 0.66rem;
    white-space: nowrap;
    pointer-events: none;
  }
  .fan-val-outside {
    color: var(--muted);
  }
  .fan-val-inside {
    color: var(--text);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    padding: 0 4px;
  }
  .fan-val-lo.fan-val-outside { right: 100%; margin-right: 6px; justify-content: flex-end; }
  .fan-val-hi.fan-val-outside { left: 100%; margin-left: 6px; justify-content: flex-start; }
  .fan-val-lo.fan-val-inside { left: 0; margin-left: 6px; justify-content: flex-start; }
  .fan-val-hi.fan-val-inside { right: 0; margin-right: 6px; justify-content: flex-end; }
  .fan-marker {
    position: absolute;
    top: -16px;
    bottom: 0;
    width: 0;
    border-left: 1px dashed var(--outline);
    pointer-events: none;
  }
  .fan-marker-arrow {
    position: absolute;
    top: -15px;
    left: -6px;
    font-size: 10px;
    color: var(--text);
  }
  .fan-marker-price {
    position: absolute;
    top: -30px;
    left: -24px;
    font-size: 0.66rem;
    font-family: var(--mono);
    color: var(--muted);
    white-space: nowrap;
  }
  .fan-ticks {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin: 10px 0 14px 46px;
  }

  /* ---- Hyper-grower "What the price implies" / expected-value note ----------------*/
  .hyper-note {
    margin: 12px 0 0 46px;
    font-size: 0.76rem;
    color: var(--outline);
    line-height: 1.5;
  }
  .hyper-implied-line { color: var(--caution); }
  .hyper-ev-line { color: var(--muted); margin-top: 4px; }
  .capex-note { color: var(--muted); margin-top: 4px; }
  @media (max-width: 560px) {
    .hyper-note { margin-left: 0; }
  }

  /* ---- Model <-> market divergence block (governor, verdict action) ------*/
  .divergence-box {
    margin: 12px 0 0 46px;
    padding: 10px 12px;
    border: 1px solid var(--caution);
    border-radius: 8px;
    background: rgba(224, 132, 42, 0.08);
    font-size: 0.76rem;
    line-height: 1.5;
  }
  .divergence-title {
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--caution);
    font-size: 0.72rem;
    margin-bottom: 8px;
  }
  .divergence-table { width: 100%; border-collapse: collapse; }
  .divergence-table th, .divergence-table td {
    text-align: right; padding: 3px 6px; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .divergence-table th:first-child, .divergence-table td:first-child { text-align: left; color: var(--muted); font-weight: 400; }
  .divergence-table thead th { color: var(--muted); font-weight: 600; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .divergence-model { color: var(--text); }
  .divergence-market { color: var(--caution); font-weight: 600; }
  .divergence-referee { color: var(--muted); margin-top: 8px; }
  @media (max-width: 560px) {
    .divergence-box { margin-left: 0; }
  }

  /* ---- Assumption strip (SCENARIO / GROWTH / DISCOUNT / RATIONALE) -------*/
  .assumption-strip {
    display: grid;
    grid-template-columns: auto auto auto 1fr;
    gap: 6px 18px;
    margin: 0 0 0 46px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  @media (max-width: 560px) {
    .assumption-strip { grid-template-columns: 1fr 1fr; margin-left: 0; }
  }
  .assum-label {
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .assum-value {
    font-size: 0.8rem;
    font-family: var(--mono);
  }
  .assum-rationale .assum-value {
    font-family: var(--sans);
    color: var(--outline);
  }

  /* ---- Triangulation card --------------------------------------------- */
  /* Legacy compact chip-row layout -- used only as a fallback when a
     payload doesn't carry tri.rationale (older result shape). */
  .triangulation-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tri-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tri-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.74rem;
    background: rgba(255, 255, 255, 0.03);
  }
  /* Agreement glyphs are diagnostic, not actionable, and there is one per
     valuation method -- reference tones so five of them don't outshout the
     single verdict badge. */
  .tri-icon { font-size: 0.85rem; font-weight: 700; line-height: 1; }
  .tri-agree .tri-icon { color: var(--green-ref); }
  .tri-disagree .tri-icon { color: var(--red-ref); }
  .tri-muted .tri-icon { color: var(--muted); }
  .tri-label {
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 0.68rem;
  }
  .tri-signal { font-family: var(--mono); }

  /* Rationale layout -- one row per valuation method, each with its own
     signal badge, an agreement marker against the overall direction, and
     a muted note line explaining *why* (tri.rationale[method]). Falls
     through to the compact chip row above when rationale is absent. */
  .tri-methods {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tri-method + .tri-method {
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .tri-method-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tri-method-head .tri-label {
    min-width: 84px;
  }
  .tri-marker {
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1;
  }
  .tri-marker-agree { color: var(--green-ref); }
  .tri-marker-disagree { color: var(--red-ref); }
  .tri-marker-muted { color: var(--muted); }
  .tri-reason {
    font-size: 0.78rem;
    color: var(--outline);
    line-height: 1.45;
    margin-top: 4px;
  }
  /* Sector-relative comparison line under the MULTIPLES method: current
     primary multiple vs its Damodaran sector median (VALUATION.md Sec.7
     axis-b), coloured by the sector bucket. */
  .tri-sector {
    font-size: 0.78rem;
    line-height: 1.45;
    margin-top: 6px;
    font-family: var(--mono);
  }
  .tri-sector .tri-sector-label {
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
    font-size: 0.66rem;
    color: var(--muted);
    font-family: inherit;
    margin-right: 4px;
  }
  /* A historical multiple against its sector median -- reference data. */
  .sector-cmp-red { color: var(--red-ref); }
  .sector-cmp-green { color: var(--green-ref); }
  .sector-cmp-muted { color: var(--muted); }
  .tri-confidence {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  /* ---- Method summary card: which valuation method(s) were used, and why -
     Four stacked groups (headline / secondary / cross_check / advisory) --
     the headline group is the emphasized entry that actually produced
     fair_value_range, the rest read progressively more muted since they
     never touch the headline number. */
  .msum {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msum-group + .msum-group {
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .msum-group-title {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .msum-item + .msum-item {
    margin-top: 8px;
  }
  .msum-label {
    font-weight: 700;
    font-size: 0.8rem;
  }
  .msum-headline-badge {
    font-size: 0.86rem;
    padding: 4px 13px;
  }
  .msum-reason {
    font-size: 0.78rem;
    color: var(--outline);
    line-height: 1.45;
    margin-top: 3px;
  }
  .msum-item-headline .msum-reason {
    font-size: 0.82rem;
    color: var(--text);
  }
  /* Advisory: informational risk/quality screens that never affect the
     headline number -- deliberately the most muted group in the card. */
  .msum-group-advisory .msum-label { color: var(--muted); font-weight: 400; }
  .msum-group-advisory .msum-reason { color: var(--muted); }

  /* ---- Pills: the one tinted-chip primitive -----------------------------
     Every badge, tag and marker chip in the report is this shape. A
     component picks one size and one tone; it does not re-declare padding
     or an rgba() triple of its own. The tone rules are kept together here
     rather than beside each card so the alert/reference split stays
     readable in one place. Sizes are set per class below because the
     class names are load-bearing in renderBody()'s string templates. */
  .badge,
  .mom-badge,
  .regime-badge,
  .rev-badge-mark,
  .bs-badge,
  .entry-kind-tag,
  .sr-strength-badge,
  .alert-box li .event-sev {
    display: inline-block;
    border-radius: 999px;
    border: 1px solid transparent;
    font-weight: 700;
    white-space: nowrap;
    vertical-align: middle;
    max-width: 100%;
  }
  /* base -- a verdict badge standing on its own */
  .badge { padding: 3px 11px; font-size: 0.76rem; overflow-wrap: break-word; }
  /* lg -- the headline call at the top of a card */
  .mom-badge,
  .regime-badge { padding: 4px 14px; font-size: 0.9rem; }
  /* sm -- chips that sit inline inside a denser row */
  .rev-badge-mark { margin-left: 8px; padding: 2px 9px; font-size: 0.66rem; letter-spacing: 0.02em; }
  .bs-badge { padding: 1px 8px; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .entry-kind-tag { padding: 1px 7px; font-size: 0.62rem; margin-right: 6px; }
  .sr-strength-badge { padding: 1px 7px; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .alert-box li .event-sev {
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 6px;
  }

  /* -- ALERT tones: saturated ink, visible outline. ---------------------- */
  .badge-green,
  .mom-badge-up,
  .regime-up,
  .entry-kind-breakout,
  .setup-grade.grade-a {
    background: var(--fill-pos); color: var(--green); border-color: var(--line-pos);
  }
  .badge-amber,
  .mom-badge-flat,
  .regime-neutral,
  .setup-grade.grade-b {
    background: var(--fill-warn); color: var(--amber); border-color: var(--line-warn);
  }
  /* Distinct "caution" bucket for the hyper-grower HIGH EXPECTATIONS PRICED IN
     verdict -- deliberately a different hue from both the neutral FAIR
     amber and the EXPENSIVE red, since it signals a different kind of risk
     (price implies an aggressive-but-not-yet-disqualified growth path). */
  .badge-caution {
    background: var(--fill-caution); color: var(--caution); border-color: var(--line-caution);
  }
  .badge-red,
  .mom-badge-down,
  .regime-down,
  .entry-kind-dip {
    background: var(--fill-neg); color: var(--red); border-color: var(--line-neg);
  }
  /* Neutral bucket for a triangulation method with no usable signal
     (veri_yok) -- deliberately muted/gray rather than any of the four
     verdict colors, since "no data" isn't a point on the cheap<->expensive
     spectrum. */
  .badge-muted,
  .setup-grade.grade-c {
    background: var(--fill-neutral); color: var(--muted); border-color: var(--line-neutral);
  }

  /* -- REFERENCE tones: same hues, no outline, ink pulled toward the body
        text. For chips that state a fact rather than raise a flag -- S/R
        strength, net-cash vs net-debt, a reversal that is still only
        "building". A card can carry a dozen of these without any of them
        reading as urgent. ------------------------------------------------ */
  .sr-str-strong,
  .rev-badge-mark.rev-mark-up,
  .bs-badge-pos {
    background: var(--wash-pos); color: var(--green-ref); border-color: transparent;
  }
  .sr-str-medium,
  .rev-badge-mark.sq-mark,
  .alert-box li.event-warning .event-sev {
    background: var(--wash-warn); color: var(--amber-ref); border-color: transparent;
  }
  .rev-badge-mark.rev-mark-down,
  .bs-badge-neg {
    background: var(--wash-neg); color: var(--red-ref); border-color: transparent;
  }
  /* Neutral member of the reference set. Kept apart from .badge-muted --
     that one is an outlined "no data" verdict standing on its own, whereas
     these sit in a ladder beside their pos/neg siblings and must lose the
     outline the way those did. */
  .sr-str-weak,
  .alert-box li.event-info .event-sev {
    background: var(--fill-neutral); color: var(--muted); border-color: transparent;
  }
  /* The one 8-K severity that stays in the alert register: a critical
     filing event is exactly the actionable case the split reserves it for. */
  .alert-box li.event-critical .event-sev {
    background: var(--fill-neg); color: var(--red); border-color: var(--line-neg);
  }

  .badge-label {
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-right: 6px;
  }

  /* ---- Verdict cards (fundamental/technical/profile fit) -----------------*/
  .verdict-card-body {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  /* ---- Track meters: the one 1D-continuous primitive ---------------------
     Four readings used to ship four different bars -- the verdict gauge,
     RSI, momentum and cycle position -- each with its own height, marker
     shape and gradient treatment. They all say "one value on a fixed
     scale", so they share one track and one marker here. A variant only
     re-tints its track where the *zones* themselves carry meaning (RSI
     30/70, the momentum sign). Anything proportional (.weight-bar) or 2D
     (.mom-quad, the fan rulers) is a different primitive and stays out. */
  .gauge,
  .rsi-gauge,
  .mom-meter,
  .cycle-track {
    position: relative;
    height: 8px;
    border-radius: 4px;
    background: var(--track-bg);
    border: 1px solid var(--border);
  }
  .rsi-gauge,
  .mom-meter { flex: 1; }
  /* The verdict gauge deliberately has NO gradient: the badge directly
     above it already states cheap/fair/expensive, so a second green->red
     ramp underneath was duplicate colour carrying no extra information. */
  .gauge { margin: 8px 2px 2px; }

  .gauge-marker,
  .rsi-gauge-marker,
  .mom-meter-marker,
  .cycle-marker {
    position: absolute;
    top: -5px;
    width: 2px;
    height: 16px;
    background: var(--text);
    transform: translateX(-1px);
    border-radius: 1px;
    box-shadow: 0 0 0 2px rgba(13, 20, 32, 0.7);
  }

  .verdict-note {
    font-size: 0.82rem;
    color: var(--outline);
    line-height: 1.45;
  }

  /* ---- Technical detail (momentum + support/resistance) ------------------*/
  .tech-section-title {
    font-size: 0.66rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 8px;
  }
  .rsi-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  /* Shape/marker come from the shared track-meter rules above; this only
     layers the threshold zones over the neutral track -- oversold (<30) ·
     neutral mid · overbought (>70), at reference strength so the marker
     stays the thing the eye lands on. */
  .rsi-gauge {
    background:
      linear-gradient(to right,
        var(--zone-pos) 0%, var(--zone-pos) 30%,
        transparent 30%, transparent 70%,
        var(--zone-neg) 70%, var(--zone-neg) 100%),
      var(--track-bg);
  }
  .rsi-val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 2em; text-align: right; }
  .rsi-side { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

  /* ---- Momentum synthesis: verdict badge + directional meter + sentence -- */
  /* .mom-badge shape + tone: see the pill primitive in the Badges section. */
  .mom-badge-row { margin-bottom: 10px; }
  .mom-meter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  /* Shape/marker from the shared track-meter rules; this only layers the
     sign zones: strong-down <- neutral -> strong-up. */
  .mom-meter {
    background:
      linear-gradient(to right,
        var(--zone-neg) 0%, transparent 45%,
        transparent 55%, var(--zone-pos) 100%),
      var(--track-bg);
  }
  .mom-ends { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); white-space: nowrap; }
  .mom-meter-cap { font-size: 0.72rem; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .mom-note {
    font-size: 0.75rem; line-height: 1.4; margin-top: 4px; margin-bottom: 4px;
    padding: 7px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  }
  /* Swing reversal-confirmation checklist (momentumReversalHtml). */
  .rev-block {
    margin-top: 8px; padding: 9px 11px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
  }
  .rev-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .rev-title { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; }
  .rev-verdict { font-size: 0.72rem; font-weight: 700; }
  .rev-verdict.rev-none { color: var(--muted); }
  .rev-verdict.rev-early { color: var(--amber); }
  .rev-verdict.rev-strong { color: var(--green); }
  .rev-help {
    font-size: 0.68rem; line-height: 1.4; color: var(--muted);
    margin-bottom: 8px; font-style: italic;
  }
  .rev-tune {
    margin-top: 8px; font-size: 0.66rem; line-height: 1.4; color: var(--muted);
    border-top: 1px dashed var(--outline); padding-top: 6px;
  }
  .rev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .rev-row { display: flex; align-items: flex-start; gap: 7px; font-size: 0.75rem; line-height: 1.35; color: var(--outline); }
  .rev-icon { flex: none; width: 1em; font-weight: 700; text-align: center; }
  .rev-row.rev-ok .rev-icon { color: var(--green); }
  .rev-row.rev-pending .rev-icon { color: var(--amber); }
  .rev-row.rev-bad .rev-icon { color: var(--red); }
  .rev-row.rev-none .rev-icon { color: var(--muted); }
  .rev-row.rev-none, .rev-row.rev-bad { color: var(--muted); }
  .rev-watch {
    font-size: 0.72rem; line-height: 1.4; margin-top: 7px;
    padding: 6px 9px; border-radius: 7px; background: var(--wash-info); border: 1px solid var(--border);
    color: var(--outline);
  }
  .rev-watch-label {
    font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    font-weight: 700; margin-right: 6px;
  }
  /* Reversal-building marker chip next to the momentum badge -- shape and
     tone come from the pill primitive (reference register: it marks a
     setup that is still only forming, not a call to act). */
  /* ATR-based risk readout line under the watch line. */
  .rev-risk {
    font-size: 0.72rem; line-height: 1.4; margin-top: 6px;
    padding: 6px 9px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border);
    color: var(--outline);
  }
  .rev-risk.rev-risk-wide { background: var(--wash-warn); border-color: var(--line-warn); }
  /* ---- MOMENTUM card (result.momentum three-layer synthesis) ------------- */
  .mom-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .mom-sub-rows { display: flex; flex-direction: column; gap: 8px; }
  .mom-sub-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  }
  .mom-sub-label {
    flex: none; width: 78px; padding-top: 2px;
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700;
  }
  .mom-sub-body { flex: 1; min-width: 0; font-size: 0.8rem; line-height: 1.4; color: var(--outline); }
  .mom-sub-score { font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mom-mini-spark-wrap { margin-top: 6px; width: 140px; max-width: 100%; }
  .mom-mini-spark { width: 100%; height: 28px; display: block; overflow: visible; }
  .mom-cross-title {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700;
    margin: 10px 0 8px;
  }
  .mom-cross-list { display: flex; flex-direction: column; gap: 6px; }
  .mom-chip { font-size: 0.75rem; line-height: 1.4; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); color: var(--outline); }
  .mom-chip-warn { background: var(--wash-warn); border-color: var(--line-warn); }
  .mom-chip-good { background: var(--wash-pos); border-color: var(--line-pos); }
  .mom-chip-info { background: var(--bg); }
  /* Synthesis sentence -- the one-line "why" the composite verdict is what it
     is, built in JS from the three layers. */
  .mom-synth { font-size: 0.82rem; line-height: 1.45; color: var(--outline); margin-bottom: 12px; }
  /* Closing disclaimer -- momentum is timing context, never a fair-value input. */
  .mom-help { font-size: 0.68rem; line-height: 1.4; color: var(--muted); font-style: italic; margin-top: 10px; }
  /* ---- Price x Fundamental momentum quadrant (the "combine" element) ----- */
  .mom-quad-wrap { margin: 4px 0 10px; }
  .mom-quad-yaxis-row { display: flex; align-items: stretch; gap: 6px; }
  .mom-quad-ylabel {
    flex: none; writing-mode: vertical-rl; transform: rotate(180deg);
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted);
    font-weight: 700; text-align: center; padding: 4px 0;
  }
  .mom-quad-box { flex: 1; min-width: 0; }
  .mom-quad-svg { width: 100%; height: auto; display: block; overflow: visible; max-width: 100%; }
  .mom-quad-zone { opacity: 0.9; }
  .mom-quad-zone-confirmed { fill: rgba(77, 224, 130, 0.12); }
  .mom-quad-zone-opportunity { fill: rgba(45, 212, 191, 0.12); }
  .mom-quad-zone-trap { fill: rgba(255, 185, 83, 0.12); }
  .mom-quad-zone-weak { fill: rgba(255, 180, 171, 0.10); }
  .mom-quad-axis { stroke: var(--border); stroke-width: 1.2; }
  .mom-quad-label { font-size: 7.5px; font-weight: 700; letter-spacing: 0.01em; }
  .mom-quad-label-confirmed { fill: var(--green); }
  .mom-quad-label-opportunity { fill: #2dd4bf; }
  .mom-quad-label-trap { fill: var(--amber); }
  .mom-quad-label-weak { fill: var(--muted); }
  .mom-quad-dot { stroke: var(--text); stroke-width: 1.2; }
  .mom-quad-dot-confirmed { fill: var(--green); }
  .mom-quad-dot-opportunity { fill: #2dd4bf; }
  .mom-quad-dot-trap { fill: var(--amber); }
  .mom-quad-dot-weak { fill: var(--red); }
  .mom-quad-axis-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
  .mom-quad-end { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); white-space: nowrap; }
  .mom-quad-axis-caption { font-size: 0.66rem; color: var(--muted); flex: 1; text-align: center; }
  .mom-quad-legend { font-size: 0.62rem; color: var(--muted); text-align: center; margin-top: 6px; line-height: 1.4; }
  /* ---- Value trajectory (verdict-momentum) context strip ----------------------- */
  .mom-vt-strip { margin-top: 10px; padding: 9px 11px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); }
  .mom-vt-title { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .mom-vt-body { font-size: 0.8rem; line-height: 1.4; color: var(--outline); }
  .mom-spark-caption { font-size: 0.66rem; color: var(--muted); margin-top: 2px; }
  /* ---- Score breakdown: what each score is made of ----------------------- */
  .mom-breakdown { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 4px 0 2px; }
  .mom-bd-col { flex: 1 1 260px; min-width: 0; }
  .mom-bd-title { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .mom-bd-title b { color: var(--text); font-weight: 700; }
  .mom-bd-row { display: grid; grid-template-columns: 1fr 74px 34px; align-items: center; gap: 8px; padding: 2.5px 0; font-size: 0.74rem; }
  .mom-bd-label { color: var(--outline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Signed bar: a fixed track with a center line; the fill grows left (neg)
     or right (pos) from the middle, so contributions are comparable at a glance. */
  .mom-bd-bar-track { position: relative; height: 8px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .mom-bd-bar-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .mom-bd-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 2px; }
  /* Signed variant of the track meter -- the score breakdown is the one
     place a bar grows out from a centre line rather than marking a point.
     Reference tones: this is the arithmetic behind the score, not a call. */
  .mom-bd-bar-pos { background: var(--green-ref); left: 50%; }
  .mom-bd-bar-neg { background: var(--red-ref); right: 50%; }
  .mom-bd-val { font-variant-numeric: tabular-nums; text-align: right; font-size: 0.7rem; }
  .mom-bd-val-pos { color: var(--green-ref); }
  .mom-bd-val-neg { color: var(--red-ref); }
  .mom-bd-val-zero { color: var(--muted); }
  .mom-bd-sig { display: grid; grid-template-columns: 16px 1fr; align-items: baseline; gap: 6px; padding: 2.5px 0; font-size: 0.74rem; color: var(--outline); }
  .mom-bd-icon { font-weight: 700; text-align: center; }
  .mom-bd-icon-ok { color: var(--green-ref); }
  .mom-bd-icon-bad { color: var(--red-ref); }
  .mom-bd-icon-neutral { color: var(--muted); }
  .tech-stat-sub { color: var(--muted); font-size: 0.72rem; font-weight: 400; }
  /* ---- Swing setup grade card -------------------------------------------- */
  .setup-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  /* Not a pill (it's a square tile), but it takes the same alert tones --
     see the .setup-grade.grade-* rules in the Badges section. */
  .setup-grade {
    flex: none; width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 800; line-height: 1;
  }
  .setup-note { font-size: 0.82rem; line-height: 1.4; color: var(--text); }
  .setup-parts { display: flex; flex-wrap: wrap; gap: 8px; }
  .setup-part {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border);
    font-size: 0.75rem;
  }
  .setup-part-icon { font-weight: 700; }
  .setup-part.setup-ok .setup-part-icon { color: var(--green); }
  .setup-part.setup-pending .setup-part-icon { color: var(--amber); }
  .setup-part.setup-bad .setup-part-icon { color: var(--red); }
  .setup-part.setup-none .setup-part-icon { color: var(--muted); }
  .setup-part-label { color: var(--muted); text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.04em; font-weight: 700; }
  .setup-part-text { font-weight: 600; }
  .setup-earn {
    margin-top: 10px; font-size: 0.74rem; line-height: 1.4; color: var(--outline);
    padding: 7px 10px; border-radius: 7px; background: var(--wash-warn); border: 1px solid var(--line-warn);
  }
  .setup-earn-badge { color: var(--amber); font-weight: 700; margin-right: 4px; }
  .setup-disc { margin-top: 10px; font-size: 0.66rem; color: var(--muted); font-style: italic; }
  .tech-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
    gap: 8px;
  }
  .tech-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    min-width: 0;
  }
  .tech-stat-label {
    font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  }
  .tech-stat-val { font-size: 0.9rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tech-pos { color: var(--green-ref); }
  .tech-neg { color: var(--red-ref); }
  .tech-div-note {
    font-size: 0.75rem; line-height: 1.4; margin-top: 8px;
    padding: 7px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
  }
  .sr-ladder { display: flex; flex-direction: column; gap: 4px; }
  .sr-row {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 10px; border-radius: 7px; font-variant-numeric: tabular-nums;
  }
  /* Whole-row washes: half strength. A ladder of six rows tinted at
     pill strength turned the S/R list into the loudest block on the page
     for what is only descriptive structure. */
  .sr-res { background: var(--wash-neg); }
  .sr-sup { background: var(--wash-pos); }
  .sr-price { background: var(--wash-info); border: 1px solid var(--border); }
  .sr-side { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); min-width: 72px; }
  .sr-lvl { font-weight: 600; min-width: 8.5em; white-space: nowrap; }
  .sr-dist { font-size: 0.8rem; min-width: 3.6em; }
  .sr-why { flex: 1; color: var(--muted); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* .sr-strength-badge shape + tone: pill primitive, reference register. */
  .sr-fib-caption { font-size: 0.68rem; color: var(--muted); margin-bottom: 6px; }
  .tech-empty { color: var(--muted); font-size: 0.82rem; }

  /* ---- Trend & triggers (Technical card primary view) --------------------*/
  .trend-regime { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
  /* .regime-badge shape + tone: pill primitive, alert register (lg size). */
  .regime-sub { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
  .regime-evi { font-size: 0.78rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .trend-callout { display: flex; align-items: flex-start; gap: 8px; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; font-size: 0.84rem; line-height: 1.45; }
  .callout-up { background: var(--wash-pos); border: 1px solid var(--line-pos); }
  .callout-up .co-arrow { color: var(--green); }
  .callout-down { background: var(--wash-neg); border: 1px solid var(--line-neg); }
  .callout-down .co-arrow { color: var(--red); }
  .co-arrow { font-size: 1rem; line-height: 1.2; flex-shrink: 0; }
  .trigger-ladder { display: flex; flex-direction: column; gap: 5px; }
  .trig-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; border-left: 3px solid transparent; background: rgba(255, 255, 255, 0.03); }
  .trig-up { border-left-color: var(--green); }
  .trig-down { border-left-color: var(--red); }
  .trig-now { border-left-color: var(--primary); background: var(--fill-info); }
  .trig-nearest { box-shadow: 0 0 0 1px rgba(192, 199, 211, 0.5) inset; }
  .trig-arrow { width: 14px; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
  .trig-up .trig-arrow { color: var(--green); }
  .trig-down .trig-arrow { color: var(--red); }
  .trig-now .trig-arrow { color: var(--primary); }
  .trig-price { font-family: var(--mono); font-weight: 700; font-size: 0.9rem; min-width: 104px; flex-shrink: 0; }
  .trig-rule { flex: 1; font-size: 0.8rem; line-height: 1.35; min-width: 0; }
  .trig-reason { color: var(--muted); }
  .trig-now-tag { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; color: var(--primary-light); }
  .trig-dist { font-family: var(--mono); font-size: 0.82rem; font-weight: 700; min-width: 60px; text-align: right; flex-shrink: 0; }
  .tech-toggle { margin-top: 14px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 7px 12px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; cursor: pointer; font-family: var(--mono); }
  .tech-toggle:hover { border-color: var(--outline); color: var(--text); }
  .tech-details { margin-top: 14px; }
  @media (max-width: 560px) {
    .trig-rule { flex-basis: 100%; order: 3; }
  }

  /* ---- Technical action box (t.action, technical/action.py) --------------
     The one-glance answer at the top of the Technical card: action pill +
     headline, then "no position / holding" guidance, fuel or reversal
     checklist, key levels, and the why. Tone follows the action. */
  .act-box { border-radius: 10px; padding: 12px 14px; margin: 2px 0 14px; border: 1px solid var(--border); }
  .act-green { background: var(--wash-pos); border-color: var(--line-pos); }
  .act-amber { background: var(--wash-warn); border-color: var(--line-warn); }
  .act-red { background: var(--wash-neg); border-color: var(--line-neg); }
  .act-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .act-head .badge { font-size: 0.85rem; padding: 5px 12px; }
  .act-headline { font-size: 0.92rem; font-weight: 700; color: var(--text); }
  .act-guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .act-guide-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; line-height: 1.4; }
  .act-guide-label { display: block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .act-meter-row { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; margin-bottom: 6px; }
  .act-meter-label { font-weight: 700; min-width: 0; }
  .act-pips { display: flex; gap: 3px; }
  .act-pip { width: 14px; height: 6px; border-radius: 3px; background: var(--border); }
  .act-pip.on-good { background: var(--green); }
  .act-pip.on-bad { background: var(--amber); }
  .act-checks { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 0.74rem; }
  .act-checks li { color: var(--muted); }
  .act-checks li.fired { color: var(--text); }
  .act-checks .act-ic { display: inline-block; width: 14px; font-weight: 700; }
  .act-levels { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.76rem; font-family: var(--mono); margin-bottom: 6px; }
  .act-levels b { font-weight: 700; }
  .act-why { font-size: 0.72rem; color: var(--muted); line-height: 1.45; }
  .act-note { font-size: 0.7rem; color: var(--muted); font-style: italic; margin-top: 6px; }
  .act-rsi { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; }
  .act-evidence { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--border); font-size: 0.7rem; line-height: 1.4; color: var(--muted); }

  /* ---- Price chart (price line + S/R + fair-value bands) -----------------*/
  .pchart-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .pchart-head .card-title { margin: 0; }
  .pchart svg { width: 100%; height: auto; display: block; }
  .pchart-area { fill: rgba(90, 167, 255, 0.12); stroke: none; }
  .pchart-line { fill: none; stroke: #5aa7ff; stroke-width: 1.6; }
  .pchart-grid { stroke: var(--border); stroke-width: 1; opacity: 0.55; }
  .pchart-tick { fill: var(--muted); font-size: 10px; }
  /* Support & resistance are drawn identically (a single dark-red line at
     each zone's price, no fill) -- only the R/S label distinguishes them.
     Simpler than a filled band: less visual clutter, no overlap fights with
     the fair-value box. */
  .pchart-sr-line { stroke: #7a1f1f; stroke-width: 1.5; opacity: 0.9; }
  .pchart-band-label { font-size: 9px; font-weight: 600; fill: #c0605f; }
  .pchart-fv-bull { stroke: var(--green); }
  .pchart-fv-bear { stroke: var(--red); }
  .pchart-fv-label { font-size: 9px; }
  .pchart-fv-ann { font-size: 8px; fill: var(--muted); }
  .pchart-now-line { stroke: var(--text); stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.75; }
  .pchart-now-label { font-size: 10px; fill: var(--text); font-weight: 700; }
  /* ---- Analyst consensus overlay (horizontal reference line + band) ----- */
  .pchart-analyst-band { fill: rgba(255, 185, 83, 0.12); stroke: none; }
  .pchart-analyst-line { stroke: var(--amber); stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; opacity: 0.9; }
  .pchart-analyst-label { font-size: 9px; fill: var(--amber); }
  /* ---- Fair-value fan (today -> horizon projection cone) ---------------- */
  .pchart-fan-outer { fill: rgba(139, 145, 157, 0.14); stroke: none; }
  .pchart-fan-up { fill: rgba(77, 224, 130, 0.15); stroke: none; }
  .pchart-fan-down { fill: rgba(255, 180, 171, 0.15); stroke: none; }
  .pchart-fan-line { stroke-width: 1.2; fill: none; opacity: 0.85; }
  .pchart-fan-baseline { stroke: #5aa7ff; stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; }
  .pchart-apex { fill: var(--text); stroke: var(--bg); stroke-width: 1; }
  .pchart-caption { font-size: 0.72rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .pchart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 0.7rem; color: var(--muted); }
  .pchart-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .pchart-sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

  /* ---- Staged entry-plan overlay (opt-in toggle on the price chart) -----
     Bands reuse the fan's green/red hexes via inline fill (set in JS with
     hexToRgba), so only the stroke/text rules live here. */
  .pchart-entry-band { stroke: none; }
  .pchart-entry-marker { stroke: var(--bg); stroke-width: 1.2; }
  .pchart-entry-marker-label { font-size: 9px; font-weight: 700; fill: var(--bg); }
  .pchart-entry-invalidation-line { stroke: var(--red); stroke-width: 1.3; stroke-dasharray: 5 3; fill: none; opacity: 0.9; }
  .pchart-entry-invalidation-label { font-size: 9px; fill: var(--red); }

  /* ---- Entry-plan overlay toggle: a separate on/off control, deliberately
     shaped differently (rounded-rect, always-bordered) from the 3m/1y/5y
     .horizon-pill segmented group so it never reads as a 4th range option. */
  .pchart-head-controls { display: flex; align-items: center; gap: 10px; }
  .entry-plan-toggle-btn {
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 600;
    padding: 6px 12px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .entry-plan-toggle-btn.active {
    background: rgba(224, 226, 234, 0.14);
    color: var(--text);
    border-color: var(--text);
  }

  /* ---- Sensitivity table -------------------------------------------------*/
  .uncertainty-tag {
    display: inline-block;
    background: rgba(255, 185, 83, 0.15);
    color: var(--amber);
    border: 1px solid rgba(255, 185, 83, 0.4);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 0.64rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .sensitivity-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 0.76rem;
  }
  .sensitivity-table th, .sensitivity-table td {
    border: 1px solid var(--border);
    padding: 6px 4px;
    text-align: center;
  }
  .sensitivity-table thead th {
    color: var(--muted);
    font-weight: 400;
  }
  .sens-row-h {
    color: var(--muted);
    font-weight: 400;
  }
  .sens-base {
    background: rgba(90, 167, 255, 0.18);
    border-color: var(--primary);
    font-weight: 700;
  }
  .sens-axis-note {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 8px;
  }

  /* ---- Disclosure (progressive detail) ------------------------------------
     Two skins over one native <details>. There is no JS behind either --
     which is why wireTechnical() no longer exists.

       .card-accordion   an advisory card that ships collapsed. Its
                         <summary> IS the card title, so a closed one reads
                         as one more card in the stack, not as a widget.
       .tech-disclosure  a section nested *inside* a card (the Technical
                         card's momentum detail). Keeps the small mono pill
                         its <button> used to be.

     Shared: the browser's default triangle is suppressed in favour of a ▾
     that flips on open, so both skins disclose the same way. */
  details.card-accordion > summary.card-title,
  details.tech-disclosure > summary.tech-toggle {
    cursor: pointer;
    list-style: none;
  }
  details.card-accordion > summary.card-title::-webkit-details-marker,
  details.tech-disclosure > summary.tech-toggle::-webkit-details-marker {
    display: none;
  }
  details.card-accordion > summary.card-title:focus-visible,
  details.tech-disclosure > summary.tech-toggle:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 3px;
  }

  /* Card-level: the title row spans the card with the caret at the far
     right. The 14px gap under a card title only earns its keep once there
     is a body beneath it, so it appears on open. */
  details.card-accordion > summary.card-title {
    margin: 0;
    justify-content: space-between;
  }
  details.card-accordion[open] > summary.card-title { margin-bottom: 14px; }
  details.card-accordion > summary.card-title:hover { color: var(--text); }
  details.card-accordion > summary.card-title::after {
    content: "▾";
    font-size: 0.8rem;
    line-height: 1;
  }
  details.card-accordion[open] > summary.card-title::after { content: "▴"; }

  /* In-card: the pill is unchanged; <summary> only needs a display that
     isn't list-item. */
  details.tech-disclosure > summary.tech-toggle { display: inline-block; }
  details.tech-disclosure > summary.tech-toggle::after { content: " ▾"; }
  details.tech-disclosure[open] > summary.tech-toggle::after { content: " ▴"; }

  /* ---- Analysis page width -----------------------------------------------
     720px is a reading measure -- right for the search shell and the error
     card, too narrow for the analysis view, whose widest tables (Staged
     Entry Plan, Sensitivity) run six to seven columns and whose small cards
     pair up two per row. Applied by renderBody() rather than declared on
     .page so those other two surfaces keep the narrow default; the swing
     screener stays on the wider .page-wide, its table being wider still. */
  .page-report { max-width: 960px; }

  /* ---- Two-up row for small cards ----------------------------------------
     Cards that are only a few lines each (Thesis Metric + Scenario Returns,
     Cycle + LBO, Red Flags + Events) sit side by side instead of each
     taking a full-width band of scroll. auto-fit collapses the row back to
     one column when 300px per card no longer fits. The cards keep their own
     margin-bottom, so the row gap is horizontal only. */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 0 16px;
    align-items: start;
  }

  /* ---- View tabs (Valuation / Timing / Risk / Balance sheet) ----------------*/
  .view-tabs {
    display: inline-flex;
    max-width: 100%;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .view-tab {
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 600;
    padding: 8px 18px;
    background: transparent;
    color: var(--muted);
    border: none;
    border-right: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }
  .view-tab:last-child { border-right: none; }
  .view-tab.active {
    background: rgba(90, 167, 255, 0.18);
    color: var(--primary-light);
  }
  /* Four tabs no longer fit a phone at the desktop padding -- tighten
     rather than wrap, since a wrapped pill row breaks the rounded ends. */
  @media (max-width: 560px) {
    .view-tab { padding: 8px 11px; font-size: 0.7rem; }
  }

  /* ---- Balance-sheet tab (reuses .sensitivity-table) --------------------*/
  .bs-table td.bs-label, .bs-table th.bs-label {
    text-align: left;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
  }
  .bs-table td.bs-num { font-variant-numeric: tabular-nums; }
  /* Reported financials and the beat record are history, not a call to
     act -- reference tones throughout. .bs-badge shape + tone come from
     the pill primitive. */
  .bs-pos { color: var(--green-ref); }
  .bs-neg { color: var(--red-ref); }
  .bs-warn { color: var(--amber-ref); }
  .beat-pos { color: var(--green-ref); font-weight: 700; }
  .beat-neg { color: var(--red-ref); font-weight: 700; }

  /* ---- Entry plan table (reuses .sensitivity-table/.sens-base) -----------*/
  .entry-plan-table td.entry-trigger {
    text-align: left;
    font-family: var(--sans);
    font-size: 0.72rem;
    line-height: 1.4;
  }
  .entry-plan-table .entry-level {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--text);
  }
  .entry-plan-table .entry-source {
    color: var(--muted);
  }
  /* t.note (support confluence / above-model) stays inline in the alert
     tone; the full sentence is on hover. */
  .entry-plan-table .entry-inline-note {
    color: var(--amber);
  }
  /* Group headers + "price now" divider turn the table into a price
     ladder. .entry-kind-tag shape + tone: pill primitive, alert register --
     entry triggers are one of the few things on the page the reader acts on. */
  .entry-plan-table tr.entry-group-row td {
    text-align: left;
    font-family: var(--sans);
    font-size: 0.7rem;
    color: var(--muted);
    padding-top: 10px;
  }
  .entry-plan-table tr.entry-price-row td {
    text-align: center;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--primary);
    border-top: 1px dashed var(--primary);
    border-bottom: 1px dashed var(--primary);
  }
  /* Collapsed explainer: each distinct "why" sentence once, not per row. */
  .entry-explain { margin-top: 12px; }
  .entry-legend {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .entry-explain-list {
    margin: 4px 0 8px;
    padding-left: 18px;
    font-size: 0.72rem;
    color: var(--outline);
    line-height: 1.5;
    text-align: left;
  }
  .entry-explain-list li + li { margin-top: 3px; }
  .entry-explain-list b { color: var(--muted); }
  .entry-legend-line {
    font-size: 0.72rem;
    color: var(--outline);
    line-height: 1.5;
    text-align: left;
  }
  .entry-legend-line + .entry-legend-line {
    margin-top: 4px;
  }
  .entry-legend-line b {
    color: var(--muted);
    font-weight: 700;
  }
  .card-sub {
    font-size: 0.72rem;
    color: var(--muted);
    margin: -8px 0 14px;
    line-height: 1.5;
  }

  /* ---- History mode (verdict-history table, reuses .sensitivity-table's
     border/spacing but left-aligns text and uses the sans font) -----------*/
  .history-header {
    font-family: var(--mono);
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 14px;
  }
  .history-caption {
    font-size: 0.78rem;
    color: var(--muted);
    margin: -6px 0 14px;
  }
  .history-table th, .history-table td {
    text-align: left;
    font-family: var(--sans);
  }
  .history-table td.history-num { font-family: var(--mono); white-space: nowrap; }
  .asof-pill {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(90, 167, 255, 0.18);
    color: var(--primary-light);
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ---- Scenario returns list ---------------------------------------------*/
  .scenario-returns-list { display: flex; flex-direction: column; gap: 6px; }
  .scen-ret-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
  }
  .scen-ret-name { color: var(--muted); font-family: var(--mono); font-weight: 700; }
  .scen-ret-value { font-family: var(--mono); }

  /* ---- Thesis metric -------------------------------------------------- */
  .thesis-metric-line { font-size: 0.9rem; margin: 0 0 8px; }
  .thesis-rationale {
    font-size: 0.78rem;
    color: var(--outline);
    line-height: 1.5;
    margin: 0;
  }
  /* Level sparkline: the anchor metric's year-by-year trajectory
     (cycle.series). Sits above the positional bar -- the sparkline's x-axis
     is TIME (fiscal years), the bar's is VALUE position, so each carries its
     own label to keep the two axes from being read as one. */
  .spark-block {
    margin: 12px 0 0;
    padding: 12px 0 0;
    border-top: 1px solid var(--border);
  }
  .spark-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 8px;
  }
  .spark-svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }
  .spark-line {
    fill: none;
    stroke: var(--primary);
    stroke-width: 1.6;
    vector-effect: non-scaling-stroke;
  }
  .spark-dot { fill: var(--muted); }
  .spark-dot-last { fill: var(--primary-light); }
  /* Trough/peak dots pick up the SAME neutral hues as .cycle-end-lo/-hi below,
     so the sparkline's shape and the cycle bar's range endpoints read as one
     visual pair -- deliberately not green/red (see .cycle-block note). */
  .spark-dot-peak { fill: var(--primary); }
  .spark-dot-trough { fill: none; stroke: var(--outline); stroke-width: 1.6; }
  .spark-fy { fill: var(--muted); font-size: 11px; font-family: var(--mono); }

  /* Cycle-position bar: where the anchor metric's latest value sits inside
     its own multi-year trough->peak range (planning._compute_cycle_position).
     Deliberately a NEUTRAL track -- near-peak is danger for a cyclical but
     health for a mature name, so the bar states position without colouring
     a verdict; the marker (bright) carries the reading. */
  .cycle-block {
    margin: 12px 0 4px;
    padding: 12px 0 0;
    border-top: 1px solid var(--border);
  }
  .cycle-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 16px;
  }
  /* Floating readout above the marker -- the current value used to live only
     in .cycle-caption below the track, forcing a look-down to read it. */
  .cycle-marker-label {
    position: absolute;
    top: -22px;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    white-space: nowrap;
  }
  /* Shape/marker from the shared track-meter rules -- this reading needs no
     zone tint at all, which is what "deliberately neutral" above asks for. */
  .cycle-mid {
    position: absolute;
    left: 50%;
    top: -3px;
    bottom: -3px;
    width: 1px;
    background: var(--border);
  }
  .cycle-ends {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--mono);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-top: 9px;
  }
  .cycle-ends span:nth-child(2) { opacity: 0.65; }
  /* Same neutral pair as .spark-dot-peak/-trough -- ties the range endpoints
     here to the matching points on the sparkline above, without a colour
     that would read as a verdict (see block comment above). */
  .cycle-end-lo { color: var(--outline); }
  .cycle-end-hi { color: var(--primary-light); }
  .cycle-caption {
    font-size: 0.76rem;
    color: var(--outline);
    line-height: 1.5;
    margin-top: 9px;
  }
  .cycle-thin { color: var(--amber); font-style: italic; }

  /* Quarterly-invalidation check (METODOLOJI.md Sec.7): one tick per recent
     quarter, colored by agreement with the day-1 thesis direction. UNLIKE
     .cycle-block right above (deliberately neutral -- see its comment),
     this check genuinely IS a pass/fail signal, so it reuses the same
     ALERT green/red tokens as .badge-green/.badge-red. */
  .qcheck-block {
    margin: 12px 0 4px;
    padding: 12px 0 0;
    border-top: 1px solid var(--border);
  }
  .qcheck-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .qcheck-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 700;
  }
  .qcheck-pill { font-size: 0.6rem; padding: 1px 7px; }
  .qcheck-baseline { stroke: var(--border); stroke-width: 1; }
  .qcheck-tick-pos { fill: var(--green); stroke: var(--line-pos); stroke-width: 1.4; }
  .qcheck-tick-neg { fill: var(--red); stroke: var(--line-neg); stroke-width: 1.4; }
  .qcheck-tick-neutral { fill: var(--track-bg); stroke: var(--border); stroke-width: 1.2; }
  .qcheck-caption {
    font-size: 0.76rem;
    color: var(--outline);
    line-height: 1.5;
    margin-top: 4px;
  }

  /* ---- Alert-style boxes (red flags / stop-adding) -----------------------*/
  .alert-box ul {
    margin: 0;
    padding-left: 18px;
  }
  .alert-box li {
    margin-bottom: 8px;
    font-size: 0.84rem;
  }
  .alert-box li:last-child { margin-bottom: 0; }
  .alert-box li .item-detail {
    display: block;
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  /* .event-sev shape + tone: pill primitive. These three used to carry
     their own #f87171/#fbbf24 hues, off the token palette entirely; they
     now sit on the same red/amber/neutral as everything else, with only
     "critical" in the alert register. */
  .empty-note {
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* ---- LLM Usage Report (result.llm_report) ---------------------------
     Reuses .card/.card-title/.card-sub/.sensitivity-table/.sens-base/
     .uncertainty-tag/.verdict-note/.mom-chip/.alert-box/.tech-section-title
     wholesale; only the table's left-aligned row-label column and the small
     provenance line after the fallback/cached chip need dedicated rules. */
  .llm-report-table th:first-child,
  .llm-report-table td:first-child {
    text-align: left;
    color: var(--muted);
  }
  .llm-report-table + .verdict-note {
    margin-top: 8px;
  }
  .llm-report-source {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 8px;
  }

  /* ---- Footer analysis (catalyst + summary) -------------------------------*/
  .catalyst-line {
    font-family: var(--mono);
    font-size: 0.86rem;
    margin: 0 0 10px;
  }
  .summary-text {
    font-size: 0.9rem;
    line-height: 1.55;
    margin: 0;
    color: var(--outline);
  }

  /* ---- Global footer ---------------------------------------------------- */
  .global-footer {
    font-size: 0.72rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 4px;
    line-height: 1.6;
    text-align: center;
  }
  .global-footer a { color: var(--muted); }

  /* ---- Search-mode empty/loading/error states -----------------------------*/
  .empty-state, .loading-state {
    text-align: center;
    padding: 34px 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-top-color: var(--primary-light);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Analyze-mode live progress card (runAnalyze() polling) -------------
     Replaces the old frozen one-line "10-40 seconds" spinner: a heading with
     a locally-ticked timer, a stage counter, and a per-stage checklist whose
     rows are patched in place by key rather than re-rendered wholesale (a
     full re-render would tear down and restart the active row's .spinner
     animation on every ~800ms poll). Left-aligned, dense, terminal-toned --
     no marketing-spinner styling. */
  .analyze-progress-head {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .analyze-progress-head .analyze-timer {
    margin-left: auto;
    font-family: var(--mono);
    color: var(--muted);
    font-size: 0.82rem;
  }
  .analyze-stage-count {
    margin-top: 10px;
    font-size: 0.76rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .analyze-stages {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .analyze-stage-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-family: var(--mono);
  }
  .analyze-stage-icon {
    display: inline-flex;
    width: 16px;
    justify-content: center;
    flex-shrink: 0;
  }
  /* The shared .spinner rule carries margin-right: 8px for its other call
     sites; inside this fixed-width, center-justified icon slot that margin
     pushes the active row's spinner off-center versus the plain check mark
     / middot glyphs in the other rows, and doubles up with the row's own
     8px gap. Zero it here only -- do not touch the base .spinner rule. */
  .analyze-stage-icon .spinner {
    margin-right: 0;
  }
  /* Completed: legible but subdued -- a check mark, no strike-through. */
  .analyze-stage-done { color: var(--muted); }
  /* Currently running: the one row that should draw the eye. */
  .analyze-stage-active { color: var(--primary-light); font-weight: 600; }
  /* Not started yet: dimmed further than "done" so the active row reads
     as the clear midpoint between finished and not-yet-reached work. */
  .analyze-stage-pending { color: var(--muted); opacity: 0.5; }
  .analyze-progress-note {
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .analyze-progress-error {
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--red);
  }
  .error-banner {
    border: 1px solid rgba(255, 180, 171, 0.5);
    background: rgba(147, 0, 10, 0.18);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 0.86rem;
    color: var(--red);
  }

  /* ---- Error card (analysis failed / result.error) ------------------------*/
  .error-box {
    border: 1px solid rgba(255, 180, 171, 0.5);
    background: rgba(147, 0, 10, 0.15);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .error-box strong {
    display: block;
    margin-bottom: 6px;
    color: var(--red);
  }
  .error-box p { margin: 0; font-size: 0.88rem; color: var(--outline); }

  /* ---- Swing screener mode (mode: "swing") --------------------------------
     The 15-column table needs more room than the 720px card column the rest
     of the app uses -- .page-wide is applied only in renderSwingMode(). */
  .page-wide { max-width: 1180px; }

  .swing-progress {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 10px;
    font-family: var(--mono);
  }
  .swing-scan-msg {
    font-size: 0.78rem;
    color: var(--amber);
    margin-top: 8px;
  }
  .swing-index-toggle { margin: 10px 0 4px; }

  .swing-filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 14px;
    margin-bottom: 16px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .swing-filter-bar label {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .swing-filter-input, .swing-filter-select {
    font-size: 0.82rem;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  .swing-score-input { width: 6ch; }
  .swing-text-input { width: 18ch; }

  /* ---- Ranked table (reuses .sensitivity-table's border/spacing) --------*/
  .swing-table-wrap { overflow-x: auto; }
  .swing-table th.sortable { cursor: pointer; user-select: none; }
  .swing-table th.sortable:hover { color: var(--text); }
  .swing-left { text-align: left; }

  .swing-ticker-cell { text-align: left; }
  .swing-ticker-link {
    font-family: var(--mono);
    font-weight: 700;
    color: var(--primary-light);
    text-decoration: none;
  }
  .swing-ticker-link:hover { text-decoration: underline; }
  .swing-name {
    font-size: 0.66rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 18ch;
  }

  .swing-score-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .swing-score-num {
    font-family: var(--mono);
    font-weight: 700;
    min-width: 2.2ch;
    text-align: right;
  }
  .swing-score-bar-track {
    position: relative;
    width: 52px;
    height: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .swing-score-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .swing-score-bar-fill.green { background: var(--green); }
  .swing-score-bar-fill.amber { background: var(--amber); }
  .swing-score-bar-fill.caution { background: var(--caution); }
  .swing-score-bar-fill.red { background: var(--red); }
  .swing-score-bar-fill.muted { background: var(--muted); }

  .swing-chip {
    display: inline-block;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 0.62rem;
    font-weight: 700;
    margin: 1px 3px 1px 0;
    background: rgba(90, 167, 255, 0.14);
    color: var(--primary-light);
    border: 1px solid rgba(90, 167, 255, 0.35);
    white-space: nowrap;
  }

  /* ---- Pager (50 rows/page, SWING_SPEC.md Sec.7 item 3) -----------------*/
  .swing-pager {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .swing-pager-nav, .swing-pager-btn {
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .swing-pager-nav:hover, .swing-pager-btn:hover { color: var(--text); border-color: var(--muted); }
  .swing-pager-nav:disabled { opacity: 0.4; cursor: not-allowed; }
  .swing-pager-btn.active {
    background: rgba(90, 167, 255, 0.18);
    color: var(--primary-light);

  }
  .swing-pager-pages { display: flex; flex-wrap: wrap; gap: 4px; }
  .swing-pager-ellipsis { color: var(--muted); padding: 0 4px; font-size: 0.76rem; }
  .swing-pager-count {
    margin-left: auto;
    font-size: 0.74rem;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* ---- Insider-activity card (Form 4, result.insider) ---------------------
     Money/share figures use insiderFmtMoney/insiderFmtShares (comma decimal,
     period thousands) to match insider.py's own server-formatted `note`
     sentences -- deliberately distinct from fmtMoney/fmtCompactMoney's
     period-decimal convention used elsewhere in this file. */
  .insider-summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.84rem; margin-bottom: 10px; }
  .insider-buy { color: var(--green-ref); }
  .insider-sell { color: var(--red-ref); }
  .insider-net { font-weight: 700; }
  .insider-net.pos { color: var(--green); }
  .insider-net.neg { color: var(--red); }
  .insider-truncated { font-size: 0.78rem; color: var(--amber); margin: 2px 0 10px; }

  /* ---- Overview mode (mode: "overview") -----------------------------------
     Portfolio-wide dashboard over every stored verdict. Deliberately reuses
     .page-wide/.card/.card-title/.alert-box/.verdict-note/.swing-table*/
     .swing-filter-bar/.horizon-toggle wholesale -- same dense-sortable-table
     + pill-filter idiom the swing screener already established. Only the
     heat-map tiles and the sign-coloured Fark%/median cells are new. */
  .ov-heatmap {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .ov-tile {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    background: var(--fill-neutral);
  }
  /* A tile with no computable heat value is visibly hatched rather than
     rendered as a solid (implicitly "fairly valued") tile -- unknown and
     "near zero" are different claims. */
  .ov-tile-unknown {
    background-image: repeating-linear-gradient(
      45deg, var(--fill-neutral), var(--fill-neutral) 6px, transparent 6px, transparent 12px
    );
    border-style: dashed;
  }
  .ov-tile-label { font-size: 0.78rem; font-weight: 700; margin-bottom: 4px; }
  .ov-tile-n { font-size: 0.66rem; color: var(--muted); margin-bottom: 6px; }
  .ov-tile-pct { font-family: var(--mono); font-size: 0.92rem; font-weight: 700; }

  /* Reference-tone sign colouring for Fark%/median gap cells -- states a
     fact (cheap/expensive direction), not an alert. */
  .ov-pos { color: var(--green-ref); }
  .ov-neg { color: var(--red-ref); }
  .ov-stale { color: var(--amber); font-weight: 700; }

<script>
(function () {
  "use strict";

  var raw = document.getElementById("report-data").textContent;
  var data;
  try {
    data = JSON.parse(raw);
  } catch (err) {
    document.getElementById("body").innerHTML =
      '<div class="card"><p>Report data could not be read.</p></div>';
    return;
  }

  var topnavEl = document.getElementById("topnav");
  var bodyEl = document.getElementById("body");

  // -------------------------------------------------------------------
  // Formatting helpers -- every one of these is None-safe: a missing/
  // non-numeric value always renders "--", never "None"/"NaN"/"undefined".
  // -------------------------------------------------------------------

  function isNum(v) {
    return v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v));
  }

  function escapeHtml(value) {
    var div = document.createElement("div");
    div.textContent = value === null || value === undefined ? "" : String(value);
    return div.innerHTML;
  }

  function fmtMoney(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "";
    var abs = Math.abs(num);
    var decimals = Number.isInteger(abs) ? 0 : 2;
    return sign + "$" + abs.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  // Swing table money cells always use 2 decimals, unlike fmtMoney's
  // integer-drops-decimals rule: in a dense price table with hundreds of
  // rows, integer-valued neighbours (e.g. "$209") next to "$376,37" read as
  // a formatting defect rather than a genuine whole-dollar price. Kept
  // separate from fmtMoney so report/history call sites keep their existing
  // integer behaviour untouched.
  function swingFmtPrice(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "";
    var abs = Math.abs(num);
    return sign + "$" + abs.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Renders a decimal fraction (0.08 -> "8%") -- used for sensitivity-table
  // axis labels (growth_values/dr_values, which arrive as decimal fractions).
  function fmtPct(v) {
    if (!isNum(v)) return "—";
    var pct = Number(v) * 100;
    var rounded = Math.round(pct * 10) / 10;
    var text = (Math.abs(rounded % 1) < 1e-9) ? rounded.toFixed(0) : rounded.toFixed(1);
    return text + "%";
  }

  // Renders an already-percentage number (e.g. 40.0, NOT a decimal fraction)
  // with no sign -- used for entry_plan's size_pct (interpret layer already
  // computes this as a percentage, not a decimal fraction).
  function fmtRawPct(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var rounded = Math.round(num * 10) / 10;
    var text = (Math.abs(rounded % 1) < 1e-9) ? rounded.toFixed(0) : rounded.toFixed(1);
    return text + "%";
  }

  // Renders an already-percentage number with an explicit +/- sign -- used
  // for scenario_returns' ret_lo_pct/ret_hi_pct.
  function fmtSignedPct(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "+";
    return sign + Math.abs(num).toFixed(1) + "%";
  }

  // Compact dollar formatting for large revenue figures (e.g. 25378308623.19
  // -> "$25.4B") -- used only by the hyper-grower "What the price implies" line, where
  // fmtMoney's full-precision output would be unreadable.
  function fmtCompactMoney(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
