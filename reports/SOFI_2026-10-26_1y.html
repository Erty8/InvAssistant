    if (vc && vc.detected && vc.direction === (bull ? "down" : "up")) {
      var ago = vc.bars_ago === 0 ? "today" : vc.bars_ago + " days ago";
      row("ok", (bull ? "Capitulation candle" : "Buying climax") + " (" + ago + ", " + Number(vc.rel_volume).toFixed(1) + "× volume) — exhaustion");
    }

    // 6. RSI divergence (bonus corroboration; only adds a row when present).
    if (t.rsi_divergence === (bull ? "bullish" : "bearish")) {
      row("ok", (bull ? "Bullish divergence (price makes a new low, RSI doesn't)" : "Bearish divergence (price makes a new high, RSI doesn't)"));
    }

    var confirmed = rows.filter(function (r) { return r.state === "ok"; }).length;
    var total = rows.length;
    var verdict, vcls;
    if (confirmed === 0) { verdict = (bull ? "No reversal confirmation — downtrend continues" : "No reversal confirmation — uptrend continues"); vcls = "rev-none"; }
    else if (confirmed < tuning.strongConfirm) { verdict = "Early reversal signal — confirmation weak, wait"; vcls = "rev-early"; }
    else { verdict = (bull ? "Reversal confirming — bulls strengthening" : "Reversal confirming — bears strengthening"); vcls = "rev-strong"; }

    // Watch line: nearest resistance is the trigger to reclaim for a bullish
    // turn (nearest support the invalidation), mirrored for a bearish turn.
    var watchHtml = "";
    var trig = bull ? t.nearest_resistance : t.nearest_support;
    var inval = bull ? t.nearest_support : t.nearest_resistance;
    if (isNum(trig) || isNum(inval)) {
      var parts = [];
      if (isNum(trig)) parts.push((bull ? "Reclaiming $" + Number(trig).toFixed(2) + " resistance confirms the reversal" : "Losing $" + Number(trig).toFixed(2) + " support confirms the reversal"));
      if (isNum(inval)) parts.push((bull ? "Breaking $" + Number(inval).toFixed(2) + " support invalidates the scenario" : "Breaking above $" + Number(inval).toFixed(2) + " resistance invalidates the scenario"));
      watchHtml = '<div class="rev-watch"><span class="rev-watch-label">Watch</span>' + escapeHtml(parts.join("; ")) + '.</div>';
    }

    // ATR-based risk readout: how far the invalidation stop sits from price,
    // in % and ATR multiples -- the yardstick for position sizing (risk per
    // share). Only when both an invalidation level and ATR are available.
    var px = isNum(t.price) ? Number(t.price) : null;
    var atr = isNum(t.atr14) ? Number(t.atr14) : null;
    var riskHtml = "";
    if (px !== null && px > 0 && atr !== null && atr > 0 && isNum(inval)) {
      var stopDist = Math.abs(px - Number(inval));
      var riskPct = stopDist / px * 100;
      var atrMult = stopDist / atr;
      var wide = riskPct > tuning.wideStopPct; // horizon-scaled: tighter for a short swing, wider for a long hold
      riskHtml = '<div class="rev-risk' + (wide ? " rev-risk-wide" : "") + '">' +
        '<span class="rev-watch-label">Risk</span>' +
        escapeHtml("Stop $" + Number(inval).toFixed(2) + " ≈ " + riskPct.toFixed(1) +
          "% away from entry (" + atrMult.toFixed(1) + "× ATR); ATR $" + atr.toFixed(2) +
          (wide ? " — wide stop, size the position down" : "")) + '.</div>';
    }

    var tuneHtml = '<div class="rev-tune">' + escapeHtml(tuning.note) + '</div>';

    return { bull: bull, rows: rows, confirmed: confirmed, total: total, verdict: verdict, vcls: vcls, watchHtml: watchHtml + riskHtml + tuneHtml };
  }

  // Compact badge marker: only once the turn has ≥2 confirmations, so the
  // momentum badge itself flags "a reversal is building" at a glance.
  function reversalBadgeMarkerHtml(rev) {
    if (!rev || rev.confirmed < 2) return "";
    var word = rev.bull ? "reversal near ⤴" : "reversal risk ⤵";
    var cls = rev.bull ? "rev-mark-up" : "rev-mark-down";
    return '<span class="rev-badge-mark ' + cls + '">↺ ' + word + '</span>';
  }

  // Bollinger squeeze chip: flags volatility compression (band width in the
  // tightest fifth of its ~6-month range) -- an expansion move often follows,
  // so a squeeze is a "get ready" for swing timing (direction-agnostic).
  function squeezeBadgeHtml(t) {
    var sq = t.bb_squeeze;
    if (!sq || !sq.active) return "";
    return '<span class="rev-badge-mark sq-mark">⇉ SQUEEZE (' + Math.round(Number(sq.percentile)) + 'p)</span>';
  }

  function reversalBlockHtml(rev) {
    if (!rev) return "";
    var ICON = { ok: "✓", pending: "◦", bad: "✗", none: "◦" };
    var rowsHtml = rev.rows.map(function (r) {
      return '<li class="rev-row rev-' + r.state + '"><span class="rev-icon">' + ICON[r.state] + '</span>' + escapeHtml(r.text) + '</li>';
    }).join("");
    var help = "Valuation shows 'what to buy', this list shows 'when': how many independent indicators " +
      "confirm the trend is turning. More ✓'s means a stronger signal; 'cheap' alone plus a falling trend " +
      "is usually early. The 'Watch' line gives the entry/invalidation levels.";
    return (
      '<div class="rev-block">' +
        '<div class="rev-head"><span class="rev-title">Reversal Confirmation</span>' +
          '<span class="rev-verdict ' + rev.vcls + '">' + rev.confirmed + '/' + rev.total + ' · ' + escapeHtml(rev.verdict) + '</span>' +
        '</div>' +
        '<div class="rev-help">' + escapeHtml(help) + '</div>' +
        '<ul class="rev-list">' + rowsHtml + '</ul>' +
        rev.watchHtml +
      '</div>'
    );
  }

  // ---- Swing setup grade (A/B/C) ------------------------------------------
  // A single composite of the three things a swing entry needs: VALUE (is it
  // cheap? -> triangulation direction), TIMING (is a bullish reversal
  // confirming? -> computeReversal), and REWARD (best tranche R/R from the
  // entry plan). Each contributes 0-2 points; the grade is the score ratio.
  // Long-biased (the common retail swing case) and fully transparent -- the
  // three component chips are shown so the letter is never a black box.
  function bestEntryRR(entryPlan) {
    if (!Array.isArray(entryPlan)) return null;
    var best = null;
    entryPlan.forEach(function (tr) {
      if (tr && isNum(tr.rr)) { var v = Number(tr.rr); if (best === null || v > best) best = v; }
    });
    return best;
  }
  function daysUntil(isoDate, fromIso) {
    var a = parseYMD(isoDate), b = parseYMD(fromIso);
    if (!a || !b) return null;
    return Math.round((a.getTime() - b.getTime()) / 86400000);
  }
  function swingSetupCardHtml(payload, result, technical) {
    var t = technical || {};
    var valuation = result.valuation || null;
    var momentum = computeMomentum(t);
    var reversal = computeReversal(t, momentum, payload.horizon);
    if (!valuation && !reversal && !(t.action && t.action.action)) return "";

    var parts = [], score = 0, maxScore = 0;

    // 1. Value (0-2): triangulation direction.
    var dir = (valuation && valuation.triangulation) ? valuation.triangulation.direction : null;
    maxScore += 2;
    if (dir === "cheap") { score += 2; parts.push({ state: "ok", label: "Value", text: "cheap" }); }
    else if (dir === "fair") { score += 1; parts.push({ state: "pending", label: "Value", text: "fair" }); }
    else if (dir === "expensive" || dir === "high_expectations") { parts.push({ state: "bad", label: "Value", text: "expensive" }); }
    else if (dir === "mixed") { parts.push({ state: "none", label: "Value", text: "mixed" }); }
    else parts.push({ state: "none", label: "Value", text: "—" });

    // 2. Timing (0-2): bullish reversal confirmation (long-biased).
    // When the Python technical action is present it is the single source of
    // truth for timing, so this card can't contradict the Technical card
    // (the legacy reversal-only read scored every uptrend as "wait").
    maxScore += 2;
    var act = t.action && t.action.action;
    var actText = t.action ? String(t.action.label || act || "").toLowerCase() : "";
    if (act) {
      if (act === "BUY") { score += 2; parts.push({ state: "ok", label: "Timing", text: actText }); }
      else if (act === "HOLD" || act === "WAIT" || act === "WAIT FOR PULLBACK") { score += 1; parts.push({ state: "pending", label: "Timing", text: actText }); }
      else parts.push({ state: "bad", label: "Timing", text: actText });
    } else if (reversal && reversal.bull) {
      if (reversal.confirmed >= 2) { score += 2; parts.push({ state: "ok", label: "Timing", text: "reversal confirmed (" + reversal.confirmed + "/" + reversal.total + ")" }); }
      else if (reversal.confirmed === 1) { score += 1; parts.push({ state: "pending", label: "Timing", text: "early reversal (" + reversal.confirmed + "/" + reversal.total + ")" }); }
      else parts.push({ state: "bad", label: "Timing", text: "no reversal, falling" });
    } else if (reversal && !reversal.bull) {
      parts.push({ state: "pending", label: "Timing", text: "rising — wait for a pullback" });
    } else parts.push({ state: "none", label: "Timing", text: "—" });

    // 3. Reward (0-2): best tranche risk/reward.
    maxScore += 2;
    var rr = bestEntryRR(result.entry_plan);
    if (rr !== null) {
      if (rr >= 2.5) { score += 2; parts.push({ state: "ok", label: "R/R", text: rr.toFixed(1) + "×" }); }
      else if (rr >= 1.5) { score += 1; parts.push({ state: "pending", label: "R/R", text: rr.toFixed(1) + "×" }); }
      else parts.push({ state: "bad", label: "R/R", text: rr.toFixed(1) + "× (low)" });
    } else parts.push({ state: "none", label: "R/R", text: "—" });

    var ratio = maxScore ? score / maxScore : 0;
    var grade, gcls, gnote;
    if (ratio >= 0.8) { grade = "A"; gcls = "grade-a"; gnote = "Value + timing + reward aligned — strong swing setup."; }
    else if (ratio >= 0.5) { grade = "B"; gcls = "grade-b"; gnote = "Partial alignment — one leg missing, wait for confirmation."; }
    else { grade = "C"; gcls = "grade-c"; gnote = "Weak alignment — no clear swing setup right now."; }

    // Earnings proximity (Feature 5): warn if the estimated next-earnings date
    // is within ~3 weeks of the price as-of date.
    var earnHtml = "";
    var eDate = result.catalyst_estimate_date;
    var dU = eDate ? daysUntil(eDate, payload.as_of || payload.generated_on) : null;
    if (dU !== null && dU >= 0 && dU <= 21) {
      earnHtml = '<div class="setup-earn"><span class="setup-earn-badge">⚠ earnings in ~' + dU + ' days</span> ' +
        escapeHtml("(estimated " + eDate + ") — carrying the position through this date is extra risk.") + '</div>';
    }

    var PICON = { ok: "✓", pending: "◦", bad: "✗", none: "–" };
    var partsHtml = parts.map(function (p) {
      return '<div class="setup-part setup-' + p.state + '"><span class="setup-part-icon">' + PICON[p.state] + '</span>' +
        '<span class="setup-part-label">' + escapeHtml(p.label) + '</span>' +
        '<span class="setup-part-text">' + escapeHtml(p.text) + '</span></div>';
    }).join("");

    return (
      '<div class="card setup-card">' +
        '<div class="card-title">Swing Setup</div>' +
        '<div class="setup-head">' +
          '<span class="setup-grade ' + gcls + '">' + grade + '</span>' +
          '<span class="setup-note">' + escapeHtml(gnote) + '</span>' +
        '</div>' +
        '<div class="setup-parts">' + partsHtml + '</div>' +
        earnHtml +
        '<div class="setup-disc">Composite indicator (value + momentum reversal + R/R), long-biased. Decision support; not investment advice.</div>' +
      '</div>'
    );
  }

  // Plain-language sentence built from the same raw numbers used by
  // computeMomentum (not from the score itself), so it stays legible even in
  // the sparse case where a score exists (e.g. RSI-only) but returns don't.
  function momentumSentence(m) {
    if (!m) return "Not enough data for momentum.";
    // English sign-then-percent style ("+12.3%" / "-12.3%").
    function signedPct(v) {
      var r = Math.round(v * 10) / 10;
      return (r >= 0 ? "+" : "-") + Math.abs(r) + "%";
    }
    var longTermClause = null;
    if (m.r6 !== null) longTermClause = "Over the last 6 months " + signedPct(m.r6);
    else if (m.r3 !== null) longTermClause = "Over the last 3 months " + signedPct(m.r3);

    var sentence1 = "";
    if (longTermClause !== null) {
      sentence1 = longTermClause;
      if (m.r1 !== null) {
        sentence1 += ", over the last month " + signedPct(m.r1);
        if (m.accelWord) sentence1 += " — momentum " + m.accelWord.toLowerCase();
      }
      sentence1 += ".";
    }

    var oscParts = [];
    if (m.rsi !== null) oscParts.push("RSI " + Math.round(m.rsi));
    if (m.mh !== null || m.mc) {
      var macdWord = m.mh > 0 ? "positive" : (m.mh < 0 ? "negative" : "neutral");
      macdWord += m.mc === "bullish" ? " (bullish crossover)" : (m.mc === "bearish" ? " (bearish crossover)" : "");
      oscParts.push("MACD " + macdWord);
    }
    var sentence2 = oscParts.length ? oscParts.join(", ") + "." : "";

    var full = [sentence1, sentence2].filter(function (s) { return s; }).join(" ");
    return full || "Not enough data for momentum.";
  }

  // ---- MOMENTUM card: three-layer synthesis (result.momentum) -------------
  // Renders the Python-side synthesis of price momentum (t.momentum),
  // fundamental momentum (revenue acceleration / margin trend / model
  // surprise) and verdict momentum (the model's own FV/price trajectory
  // across stored analyses) into one card, plus the cross-signal readings
  // that intersect momentum with the fundamental (value) verdict. Renders
  // "" (card omitted) when result.momentum is entirely absent (older runs /
  // no data); each of the three sub-layers renders "—" independently when
  // its own layer is missing, so a partial payload never crashes the card.
  function momentumVerdictColor(v) {
    if (v === "STRONG+" || v === "POSITIVE") return "green";
    if (v === "NEGATIVE") return "red";
    if (v === "NEUTRAL") return "amber";
    return "muted";
  }

  // Small inline-SVG line, reusing the same .spark-line/.spark-dot visual
  // language as thesisSparklineHtml but sized for a compact sub-row (no axis
  // labels). Returns "" when fewer than two plottable points are given.
  function miniSparkSvg(values) {
    var vals = (values || []).filter(isNum).map(Number);
    if (vals.length < 2) return "";
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var W = 140, H = 28, pad = 3;
    var innerW = W - pad * 2, innerH = H - pad * 2;
    var n = vals.length;
    function xAt(i) { return pad + (innerW * i) / (n - 1); }
    function yAt(v) { return hi <= lo ? H / 2 : pad + innerH * (1 - (v - lo) / (hi - lo)); }
    var path = vals.map(function (v, i) { return (i ? "L" : "M") + xAt(i).toFixed(1) + " " + yAt(v).toFixed(1); }).join(" ");
    var lastDot = '<circle cx="' + xAt(n - 1).toFixed(1) + '" cy="' + yAt(vals[n - 1]).toFixed(1) +
      '" r="2.6" class="spark-dot spark-dot-last"/>';
    return '<svg class="mom-mini-spark" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="none" role="img" aria-hidden="true"><path d="' + path + '" class="spark-line"/>' + lastDot + '</svg>';
  }

  function momentumSubRowHtml(label, bodyHtml) {
    return (
      '<div class="mom-sub-row">' +
        '<div class="mom-sub-label">' + escapeHtml(label) + '</div>' +
        '<div class="mom-sub-body">' + bodyHtml + '</div>' +
      '</div>'
    );
  }

  function momentumCrossSignalHtml(sig) {
    if (!sig) return "";
    var sevCls = sig.severity === "warn" ? "mom-chip-warn" : (sig.severity === "good" ? "mom-chip-good" : "mom-chip-info");
    return '<div class="mom-chip ' + sevCls + '">' + escapeHtml(sig.text || "—") + '</div>';
  }

  // Which quadrant a (price.s, fundamental.s) pair falls in -- the same
  // classification drives the SVG zone the dot lands in, the dot's color,
  // and the middle clause of the synthesis sentence. >= 0 counts as the
  // "positive" half of each axis (matches the quadrant SVG's xAt/yAt, which
  // map s=0 to the center line).
  function momentumQuadrantZone(priceS, fundS) {
    var priceUp = priceS >= 0, fundUp = fundS >= 0;
    if (priceUp && fundUp) return { key: "confirmed", label: "CONFIRMED MOMENTUM" };
    if (!priceUp && fundUp) return { key: "opportunity", label: "OPPORTUNITY ZONE" };
    if (priceUp && !fundUp) return { key: "trap", label: "MOMENTUM TRAP" };
    return { key: "weak", label: "WEAK" };
  }

  // The price x fundamental momentum quadrant -- self-contained inline SVG.
  // X = price.s (-1..+1, left->right), Y = fundamental.s (-1..+1, bottom->top).
  // Four background-tinted zones with a short label each, crosshair
  // axes through the center, and one dot for the security's current reading
  // (clamped into the box so an out-of-range s never draws outside it).
  function momentumQuadrantSvg(priceS, fundS, zoneKey) {
    var W = 240, H = 190, pad = 6;
    var innerW = W - pad * 2, innerH = H - pad * 2;
    var cx = pad + innerW / 2, cy = pad + innerH / 2;
    var halfW = innerW / 2, halfH = innerH / 2;
    function clamp(v) { return Math.max(-1, Math.min(1, v)); }
    function xAt(s) { return pad + innerW * (clamp(s) + 1) / 2; }
    function yAt(s) { return pad + innerH * (1 - (clamp(s) + 1) / 2); }
    var dotX = xAt(priceS), dotY = yAt(fundS);

    var zones =
      '<rect x="' + cx + '" y="' + pad + '" width="' + halfW + '" height="' + halfH + '" class="mom-quad-zone mom-quad-zone-confirmed"/>' +
      '<rect x="' + pad + '" y="' + pad + '" width="' + halfW + '" height="' + halfH + '" class="mom-quad-zone mom-quad-zone-opportunity"/>' +
      '<rect x="' + cx + '" y="' + cy + '" width="' + halfW + '" height="' + halfH + '" class="mom-quad-zone mom-quad-zone-trap"/>' +
      '<rect x="' + pad + '" y="' + cy + '" width="' + halfW + '" height="' + halfH + '" class="mom-quad-zone mom-quad-zone-weak"/>';

    var axes =
      '<line x1="' + pad + '" y1="' + cy + '" x2="' + (W - pad) + '" y2="' + cy + '" class="mom-quad-axis"/>' +
      '<line x1="' + cx + '" y1="' + pad + '" x2="' + cx + '" y2="' + (H - pad) + '" class="mom-quad-axis"/>';

    function zoneLabel(x, y, cls, text) {
      return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" text-anchor="middle" class="mom-quad-label ' + cls + '">' + text + '</text>';
    }
    var labels =
      zoneLabel(cx + halfW / 2, pad + halfH / 2, "mom-quad-label-confirmed", "CONFIRMED MOMENTUM") +
      zoneLabel(pad + halfW / 2, pad + halfH / 2, "mom-quad-label-opportunity", "OPPORTUNITY ZONE") +
      zoneLabel(cx + halfW / 2, cy + halfH / 2 + 3, "mom-quad-label-trap", "MOMENTUM TRAP") +
      zoneLabel(pad + halfW / 2, cy + halfH / 2 + 3, "mom-quad-label-weak", "WEAK");

    var dot = '<circle cx="' + dotX.toFixed(1) + '" cy="' + dotY.toFixed(1) + '" r="5.5" class="mom-quad-dot mom-quad-dot-' + (zoneKey || "weak") + '"/>';

    return '<svg class="mom-quad-svg" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Price and fundamental momentum quadrant">' +
      zones + axes + labels + dot + '</svg>';
  }

  // Wraps the quadrant SVG with its axis captions ("← Price momentum →" /
  // "Fundamental ↑") and a legend line carrying the raw 0-100 scores (50 =
  // neutral) plus the zone the dot landed in.
  function momentumQuadrantBlockHtml(price, fund, zone) {
    var svg = momentumQuadrantSvg(Number(price.s), Number(fund.s), zone.key);
    var pScore = isNum(price.score) ? Math.round(Number(price.score)) + "/100" : "—";
    var fScore = isNum(fund.score) ? Math.round(Number(fund.score)) + "/100" : "—";
    return (
      '<div class="mom-quad-wrap">' +
        '<div class="mom-quad-yaxis-row">' +
          '<div class="mom-quad-ylabel">Fundamental ↑</div>' +
          '<div class="mom-quad-box">' + svg + '</div>' +
        '</div>' +
        '<div class="mom-quad-axis-row">' +
          '<span class="mom-quad-end">weak</span>' +
          '<span class="mom-quad-axis-caption">← Price momentum →</span>' +
          '<span class="mom-quad-end">strong</span>' +
        '</div>' +
        '<div class="mom-quad-legend">Price ' + escapeHtml(pScore) + ' · Fundamental ' + escapeHtml(fScore) +
          ' · 0-100 scale, 50 = neutral · ● current position (' + escapeHtml(zone.label) + ')</div>' +
      '</div>'
    );
  }

  // Fallback "Price" sub-row body (used only when the quadrant can't be
  // drawn because fundamental.s is missing -- e.g. quarterly fundamentals
  // too sparse). Same content the quadrant's legend would otherwise carry.
  function momentumPriceBodyHtml(price) {
    if (!price) return '<span class="muted">—</span>';
    var scoreTxt = isNum(price.score) ? Math.round(Number(price.score)) + "/100 (50=neutral)" : "—";
    var accelTxt = price.accel ? " · " + escapeHtml(price.accel) : "";
    var pCls = price.direction === "up" ? "mom-badge-up" : (price.direction === "down" ? "mom-badge-down" : "mom-badge-flat");
    return '<span class="mom-badge ' + pCls + '">' + escapeHtml(price.arrow || "") + ' ' + escapeHtml(price.label || "—") + '</span> ' +
      '<span class="mom-sub-score">' + scoreTxt + accelTxt + '</span>';
  }

  // Fallback "Fundamental" sub-row body (used only when the quadrant can't
  // be drawn because price.s is missing -- e.g. no price history at all).
  // Labels its YoY sparkline explicitly (first->last), per the "explanatory"
  // requirement -- a bare sparkline with no caption reads as decoration.
  function momentumFundamentalBodyHtml(fund) {
    if (!fund) return '<span class="muted">—</span>';
    var scoreTxt = isNum(fund.score) ? Math.round(Number(fund.score)) + "/100 (50=neutral)" : "";
    var scoreHtml = scoreTxt ? ' <span class="mom-sub-score">(' + scoreTxt + ')</span>' : "";
    var yoy = fund.revenue_accel && fund.revenue_accel.yoy_series;
    var sparkHtml = "";
    if (Array.isArray(yoy) && yoy.length >= 2) {
      var vals = yoy.map(function (y) { return y.yoy_pct; }).filter(isNum);
      if (vals.length >= 2) {
        var caption = "YoY growth: " + fmtSignedPct(vals[0]) + "→" + fmtSignedPct(vals[vals.length - 1]);
        sparkHtml = '<div class="mom-mini-spark-wrap">' + miniSparkSvg(vals) +
          '<div class="mom-spark-caption">' + escapeHtml(caption) + '</div></div>';
      }
    }
    return escapeHtml(fund.detail || "—") + scoreHtml + sparkHtml;
  }

  // Value trajectory (verdict momentum) -- the model's OWN fair-value/price
  // trajectory across stored analyses. A different axis from the security's
  // own price/fundamental momentum above, so it's rendered as a separate
  // context strip below the quadrant rather than folded into it. Labels its
  // sparkline with the first->last FV/price ratio, per the "explanatory"
  // requirement.
  function momentumVerdictTrendHtml(vt) {
    var body;
    if (vt) {
      var sparkHtml = "";
      var series = vt.series;
      if (Array.isArray(series) && series.length >= 2) {
        var ratios = series.map(function (p) { return p.ratio; }).filter(isNum);
        if (ratios.length >= 2) {
          var caption = "FV/price: " + ratios[0].toFixed(2) + "→" + ratios[ratios.length - 1].toFixed(2);
          sparkHtml = '<div class="mom-mini-spark-wrap">' + miniSparkSvg(ratios) +
            '<div class="mom-spark-caption">' + escapeHtml(caption) + '</div></div>';
        }
      }
      body = escapeHtml(vt.detail || "—") + sparkHtml;
    } else {
      body = '<span class="muted">—</span>';
    }
    return (
      '<div class="mom-vt-strip">' +
        '<div class="mom-vt-title">Value trajectory</div>' +
        '<div class="mom-vt-body">' + body + '</div>' +
      '</div>'
    );
  }

  // One muted line explaining WHY the composite verdict is what it is:
  // leads with the price/fundamental labels (+ raw scores), a middle clause
  // derived from the quadrant zone (only when both s values are available),
  // and closes with the verdict-momentum's own detail sentence. Fully
  // None-safe -- degrades to a shorter sentence, never "None"/"undefined",
  // and falls back to a placeholder when nothing at all is available.
  function momentumSynthesisSentence(mo) {
    var price = mo.price, fund = mo.fundamental, vt = mo.verdict_trend;
    var leadParts = [];
    if (price && price.label) {
      var pScore = isNum(price.score) ? Math.round(Number(price.score)) : null;
      leadParts.push("Price momentum " + price.label + (pScore !== null ? " (" + pScore + "/100)" : ""));
    }
    if (fund && fund.label) {
      var fScore = isNum(fund.score) ? Math.round(Number(fund.score)) : null;
      leadParts.push("fundamental momentum " + fund.label + (fScore !== null ? " (" + fScore + "/100)" : ""));
    }
    var lead = leadParts.join(", ");

    var zoneClause = "";
    if (price && isNum(price.s) && fund && isNum(fund.s)) {
      var zone = momentumQuadrantZone(Number(price.s), Number(fund.s));
      if (zone.key === "confirmed") zoneClause = "price and business performance point the same way: trend confirmed";
      else if (zone.key === "opportunity") zoneClause = "the business is accelerating but price hasn't confirmed yet";
      else if (zone.key === "trap") zoneClause = "price is rising but the business is slowing — momentum-trap risk";
      else zoneClause = "both price and business performance are weak";
    }

    var sentence1 = lead;
    if (zoneClause) sentence1 += (lead ? "; " : "") + zoneClause;
    if (sentence1) sentence1 += ".";

    var sentence2 = (vt && vt.detail) ? vt.detail : "";

    var full = [sentence1, sentence2].filter(function (s) { return s; }).join(" ");
    return full || "Not enough data for a momentum synthesis.";
  }

  // Price-score breakdown: one signed bar per component (the same
  // {key,label,points} objects Python's compute_price_momentum emits), so the
  // reader sees WHY the 0-100 score is what it is -- which levers pushed it up
  // (getiri/trend...) and which dragged it down. Bars are scaled to the
  // largest absolute contribution in the set. Returns "" if no components.
  function momentumPriceBreakdownHtml(price) {
    if (!price || !Array.isArray(price.components) || !price.components.length) return "";
    var comps = price.components.filter(function (c) { return c && isNum(c.points); });
    if (!comps.length) return "";
    var maxAbs = comps.reduce(function (m, c) { return Math.max(m, Math.abs(Number(c.points))); }, 0) || 1;
    var scoreTxt = isNum(price.score) ? Math.round(Number(price.score)) : "—";
    var rows = comps.map(function (c) {
      var pts = Number(c.points);
      var w = Math.min(50, Math.abs(pts) / maxAbs * 50);   // % of half-track
      var barCls = pts > 0 ? "mom-bd-bar-pos" : "mom-bd-bar-neg";
      var valCls = pts > 0.05 ? "mom-bd-val-pos" : (pts < -0.05 ? "mom-bd-val-neg" : "mom-bd-val-zero");
      var bar = Math.abs(pts) < 0.05 ? "" :
        '<span class="mom-bd-bar ' + barCls + '" style="width:' + w.toFixed(1) + '%;"></span>';
      return (
        '<div class="mom-bd-row">' +
          '<span class="mom-bd-label">' + escapeHtml(c.label || c.key || "—") + '</span>' +
          '<span class="mom-bd-bar-track">' + bar + '</span>' +
          '<span class="mom-bd-val ' + valCls + '">' + (pts >= 0 ? "+" : "") + pts.toFixed(1) + '</span>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="mom-bd-col">' +
        '<div class="mom-bd-title">PRICE <b>' + escapeHtml(String(scoreTxt)) + '/100</b> · contributions</div>' +
        rows +
      '</div>'
    );
  }

  // Fundamental-signal breakdown: the sub-signals behind the fundamental score
  // as ✓/◦/✗ rows (revenue-growth acceleration, gross & FCF margin trend,
  // model-based surprise). Icon reflects each signal's direction. "" if no
  // fundamental layer.
  function momentumFundamentalBreakdownHtml(fund) {
    if (!fund) return "";
    function icon(kind) {
      var g = kind === "ok" ? "mom-bd-icon-ok" : (kind === "bad" ? "mom-bd-icon-bad" : "mom-bd-icon-neutral");
      var ch = kind === "ok" ? "✓" : (kind === "bad" ? "✗" : "◦");
      return '<span class="mom-bd-icon ' + g + '">' + ch + '</span>';
    }
    function trendKind(word) {
      if (word === "accelerating" || word === "improving") return "ok";
      if (word === "decelerating" || word === "deteriorating") return "bad";
      return "neutral";
    }
    function sig(kind, text) { return '<div class="mom-bd-sig">' + icon(kind) + '<span>' + escapeHtml(text) + '</span></div>'; }

    var rows = [];
    var ra = fund.revenue_accel;
    if (ra && ra.word) {
      // "Quarterly" is explicit so this never looks like it contradicts the
      // thesis card's *annual* growth metric -- they measure different periods.
      // An unconfirmed (single-quarter) move is flagged and shown neutral, not
      // as a full ✓/✗, matching the reduced weight it carries in the score.
      var unconfirmed = ra.confirmed === false;
      var yoyTxt = isNum(ra.latest_yoy_pct) ? " (latest quarter YoY " + fmtSignedPct(ra.latest_yoy_pct) + ")" : "";
      var caveat = unconfirmed ? " — single quarter, awaiting confirmation" : "";
      var kind = unconfirmed ? "neutral" : trendKind(ra.word);
      rows.push(sig(kind, "Quarterly revenue growth " + ra.word + yoyTxt + caveat));
    }
    var mt = fund.margin_trend || {};
    if (mt.gross) rows.push(sig(trendKind(mt.gross), "Gross margin " + mt.gross));
    if (mt.fcf) rows.push(sig(trendKind(mt.fcf), "FCF margin " + mt.fcf));
    var ms = fund.model_surprise;
    if (ms && ms.direction) {
      var msKind = ms.direction === "beat" ? "ok" : (ms.direction === "miss" ? "bad" : "neutral");
      var msWord = ms.direction === "beat" ? "beat the model" : (ms.direction === "miss" ? "below the model" : "in line with the model");
      var msPct = isNum(ms.surprise_pct) ? " (" + fmtSignedPct(ms.surprise_pct) + ")" : "";
      rows.push(sig(msKind, "Realized revenue " + msWord + msPct));
    } else {
      rows.push(sig("neutral", "Model surprise: no data"));
    }
    if (!rows.length) return "";
    var scoreTxt = isNum(fund.score) ? Math.round(Number(fund.score)) : "—";
    return (
      '<div class="mom-bd-col">' +
        '<div class="mom-bd-title">FUNDAMENTAL <b>' + escapeHtml(String(scoreTxt)) + '/100</b> · signals</div>' +
        rows.join("") +
      '</div>'
    );
  }

  function momentumCardHtml(result) {
    var mo = result && result.momentum;
    if (!mo) return "";

    var vColor = momentumVerdictColor(mo.verdict);
    var price = mo.price;
    var fund = mo.fundamental;
    var vt = mo.verdict_trend;

    // The quadrant is the headline visual whenever BOTH axes have a
    // continuous score; otherwise fall back to the old labeled sub-rows so
    // whichever single layer exists is never lost.
    var hasQuadrant = !!(price && isNum(price.s) && fund && isNum(fund.s));
    var bodyHtml;
    if (hasQuadrant) {
      var zone = momentumQuadrantZone(Number(price.s), Number(fund.s));
      bodyHtml = momentumQuadrantBlockHtml(price, fund, zone);
    } else {
      bodyHtml =
        '<div class="mom-sub-rows">' +
          momentumSubRowHtml("Price", momentumPriceBodyHtml(price)) +
          momentumSubRowHtml("Fundamental", momentumFundamentalBodyHtml(fund)) +
        '</div>';
    }

    // Score breakdown: what each 0-100 score is actually made of (price
    // component contributions + fundamental sub-signals). Shown whenever the
    // underlying data exists, in either the quadrant or the fallback layout.
    var breakdownCols = momentumPriceBreakdownHtml(price) + momentumFundamentalBreakdownHtml(fund);
    var breakdownHtml = breakdownCols ? '<div class="mom-breakdown">' + breakdownCols + '</div>' : "";

    var crossHtml = "";
    if (Array.isArray(mo.cross_signals) && mo.cross_signals.length) {
      crossHtml =
        '<div class="mom-cross-title">Cross Signals</div>' +
        '<div class="mom-cross-list">' + mo.cross_signals.map(momentumCrossSignalHtml).join("") + '</div>';
    }

    return (
      '<div class="card mom-card">' +
        '<div class="mom-card-head">' +
          '<div class="card-title" style="margin:0;">MOMENTUM</div>' +
          '<span class="badge badge-' + vColor + '">' + escapeHtml(mo.verdict || "—") + '</span>' +
        '</div>' +
        '<div class="mom-synth">' + escapeHtml(momentumSynthesisSentence(mo)) + '</div>' +
        bodyHtml +
        breakdownHtml +
        momentumVerdictTrendHtml(vt) +
        crossHtml +
        '<div class="mom-help">Momentum is entry-timing context — it never enters the fair-value calculation.</div>' +
      '</div>'
    );
  }

  // ===================================================================
  // Insider-activity card (SEC Form 4, result.insider) -- see
  // sec_analyzer/signals/insider.py's compute_insider_signal() docstring
  // for the payload shape. Renders "" (card omitted) when the signal is
  // entirely absent, exactly like eventsCardHtml -- a ticker with no Form 4
  // filings never shows an empty shell. Every field is optional; isNum/
  // safeText/escapeHtml guard each one individually.
  // ===================================================================
  var INSIDER_SEVERITY_COLOR = { positive: "green", negative: "red", neutral: "muted" };
  var INSIDER_CATEGORY_COLOR = { open_market_buy: "green", open_market_sell: "red" };

  // Compact money -- mirrors insider.py's own _fmt_money() (period decimal
  // separator: "$2.5M"/"$840K"/"$840"), so the card's own numbers read
  // identically to insider.note's server-formatted sentences rather than
  // clashing with them one line apart.
  function insiderFmtMoney(v) {
    if (!isNum(v)) return "—";
    var num = Number(v);
    var sign = num < 0 ? "-" : "";
    var abs = Math.abs(num);
    if (abs >= 1e6) return sign + "$" + (abs / 1e6).toFixed(1) + "M";
    if (abs >= 1e3) return sign + "$" + Math.round(abs / 1e3) + "K";
    return sign + "$" + Math.round(abs);
  }

  function insiderFmtSignedMoney(v) {
    if (!isNum(v)) return "—";
    return (Number(v) < 0 ? "-" : "+") + insiderFmtMoney(Math.abs(Number(v)));
  }

  // Share count with a comma thousands separator, no decimals -- mirrors
  // insider.py's _fmt_shares (e.g. 12000 -> "12,000").
  function insiderFmtShares(v) {
    if (!isNum(v)) return "—";
    return Math.round(Number(v)).toLocaleString("en-US");
  }

  // One side (buy or sell) of the two-sided summary line -- "3 transactions ·
  // 12,000 shares · $2.5M". Returns null (side omitted) when both the count
  // and the value are zero/absent, per spec: a "0 transactions" clause would
  // only clutter the line.
  function insiderSideSummary(count, shares, value) {
    var hasCount = isNum(count) && Number(count) !== 0;
    var hasValue = isNum(value) && Number(value) !== 0;
    if (!hasCount && !hasValue) return null;
    var parts = [];
    if (isNum(count)) parts.push(Math.round(Number(count)) + " transactions");
    if (isNum(shares)) parts.push(insiderFmtShares(shares) + " shares");
    if (hasValue) parts.push(insiderFmtMoney(value));
    return parts.join(" · ");
  }

  // "Transaction" cell: a category-coloured badge (open-market buy/sell get the
  // alert green/red; everything else -- awards, exercises, gifts -- stays
  // muted) plus a small "derivative" marker when the row is a derivative
  // transaction, since a derivative row is never an open-market trade and
  // must not be read as one.
  function insiderTxLabelHtml(row) {
    var color = INSIDER_CATEGORY_COLOR[row.category] || "muted";
    var derivTag = row.derivative ? ' <span class="swing-chip">derivative</span>' : "";
    return '<span class="badge badge-' + color + '">' + escapeHtml(safeText(row.label || row.code)) + '</span>' + derivTag;
  }

  function insiderRowHtml(row) {
    row = row || {};
    return (
      '<tr>' +
        '<td>' + escapeHtml(safeText(row.date)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.person)) + '</td>' +
        '<td>' + escapeHtml(safeText(row.role)) + '</td>' +
        '<td>' + insiderTxLabelHtml(row) + '</td>' +
        '<td class="history-num">' + insiderFmtShares(row.shares) + '</td>' +
        '<td class="history-num">' + swingFmtPrice(row.price) + '</td>' +
        '<td class="history-num">' + insiderFmtMoney(row.value) + '</td>' +
      '</tr>'
    );
  }

  function insiderCardHtml(insider) {
    if (!insider) return "";

    var sevColor = INSIDER_SEVERITY_COLOR[insider.severity] || "muted";
    var windowText = isNum(insider.window_days) ? "last " + Math.round(Number(insider.window_days)) + " days" : "";

    var buySide = insiderSideSummary(insider.buy_count, insider.buy_shares, insider.buy_value);
    var sellSide = insiderSideSummary(insider.sell_count, insider.sell_shares, insider.sell_value);
    var summaryHtml = "";
    if (buySide || sellSide || isNum(insider.net_value)) {
      summaryHtml = '<div class="insider-summary">' +
        (buySide ? '<span class="insider-buy">Buy: ' + escapeHtml(buySide) + '</span>' : "") +
        (sellSide ? '<span class="insider-sell">Sell: ' + escapeHtml(sellSide) + '</span>' : "") +
        (isNum(insider.net_value)
          ? '<span class="insider-net ' + (Number(insider.net_value) < 0 ? "neg" : "pos") + '">Net: ' +
            escapeHtml(insiderFmtSignedMoney(insider.net_value)) + '</span>'
          : "") +
      '</div>';
    }

    var noteHtml = insider.note
      ? '<div class="verdict-note" style="margin-bottom:8px;">' + escapeHtml(insider.note) + '</div>'
      : "";

    // The line that distinguishes routine selling from a real signal --
    // shown directly whenever known, never tucked into an accordion.
    var stakeHtml = isNum(insider.median_stake_sold_pct)
      ? '<div class="verdict-note" style="margin-bottom:8px;">Selling executives disposed of a median ' +
        Number(insider.median_stake_sold_pct).toFixed(1) +
        "% of their stake.</div>"
      : "";

    var truncatedHtml = insider.truncated
      ? '<div class="insider-truncated">⚠ Scan hit its upper limit — figures are partial.</div>'
      : "";

    var recent = Array.isArray(insider.recent) ? insider.recent : [];
    var tableHtml = recent.length
      ? '<div class="swing-table-wrap">' +
          '<table class="sensitivity-table history-table">' +
            '<thead><tr>' +
              '<th>Date</th><th>Person</th><th>Role</th><th>Transaction</th>' +
              '<th>Shares</th><th>Price</th><th>Value</th>' +
            '</tr></thead>' +
            '<tbody>' + recent.map(insiderRowHtml).join("") + '</tbody>' +
          '</table>' +
        '</div>'
      : "";

    return (
      '<div class="card">' +
        '<div class="mom-card-head">' +
          '<div class="card-title" style="margin:0;">👤 Insider Transactions (Form 4)</div>' +
          '<div>' +
            '<span class="badge badge-' + sevColor + '">' + escapeHtml(safeText(insider.verdict)) + '</span>' +
            (windowText ? ' <span class="regime-sub">' + escapeHtml(windowText) + '</span>' : "") +
          '</div>' +
        '</div>' +
        summaryHtml +
        noteHtml +
        stakeHtml +
        truncatedHtml +
        tableHtml +
      '</div>'
    );
  }

  // ---- Technical action box (t.action from technical/action.py) ----------
  // Pure render of the Python-side decision: action pill + headline, the
  // "no position / holding" guidance, then EITHER the fuel meter (uptrend:
  // how many exhaustion signs fired) OR the reversal meter (otherwise: how
  // many bullish confirmations vs. how many are needed), key levels, and the
  // reasons. Re-derives nothing. Returns "" when t.action is absent (older
  // stored runs), so the card falls back to the RSI badge.
  function actionBoxHtml(t) {
    var a = t && t.action;
    if (!a || !a.action) return "";
    var tone = a.tone === "green" || a.tone === "red" ? a.tone : "amber";

    function pips(n, total, goodWhenOn) {
      var out = "";
      for (var i = 0; i < total; i++) {
        out += '<span class="act-pip' + (i < n ? (goodWhenOn ? " on-good" : " on-bad") : "") + '"></span>';
      }
      return '<span class="act-pips">' + out + '</span>';
    }
    function checksHtml(checks, firedIsGood) {
      if (!Array.isArray(checks) || !checks.length) return "";
      return '<ul class="act-checks">' + checks.map(function (c) {
        var ic = c.fired ? (firedIsGood ? "✓" : "!") : "·";
        return '<li class="' + (c.fired ? "fired" : "") + '"><span class="act-ic">' + ic + '</span>' + escapeHtml(c.label || "—") + '</li>';
      }).join("") + '</ul>';
    }

    var meterHtml = "";
    if (a.fuel) {
      var f = a.fuel;
      meterHtml =
        '<div class="act-meter-row"><span class="act-meter-label">Momentum fuel: ' + escapeHtml(f.label || "—") + '</span>' +
          pips(f.fired || 0, f.total || 0, false) + '</div>' +
        checksHtml(f.checks, false);
    } else if (a.reversal) {
      var r = a.reversal;
      meterHtml =
        '<div class="act-meter-row"><span class="act-meter-label">Reversal confirmations: ' +
          (r.confirmed || 0) + ' of ' + (r.needed || 0) + ' needed</span>' +
          pips(r.confirmed || 0, r.total || 0, true) + '</div>' +
        checksHtml(r.checks, true);
    }

    var lv = [];
    if (isNum(a.trigger)) lv.push('<span>' + escapeHtml(a.trigger_label || "Key level") + ' <b>' + fmtMoney(a.trigger) + '</b></span>');
    if (isNum(a.stop)) lv.push('<span>Stop <b>' + fmtMoney(a.stop) + '</b></span>');
    var levelsHtml = lv.length ? '<div class="act-levels">' + lv.join("") + '</div>' : "";

    var why = Array.isArray(a.reasons) && a.reasons.length
      ? '<div class="act-why">Why: ' + escapeHtml(a.reasons.join(" · ")) + '</div>' : "";
    var note = a.horizon_note ? '<div class="act-note">' + escapeHtml(a.horizon_note) + '</div>' : "";

    return (
      '<div class="act-box act-' + tone + '">' +
        // a.label is the trend-state text; a.action is an internal code and is
        // only a fallback for runs stored before labels existed.
        '<div class="act-head"><span class="badge badge-' + tone + '">' + escapeHtml(a.label || a.action) + '</span>' +
          '<span class="act-headline">' + escapeHtml(a.headline || "") + '</span></div>' +
        '<div class="act-guide">' +
          '<div class="act-guide-item"><span class="act-guide-label">Entry picture</span>' + escapeHtml(a.for_new || "—") + '</div>' +
          '<div class="act-guide-item"><span class="act-guide-label">If holding</span>' + escapeHtml(a.for_holder || "—") + '</div>' +
        '</div>' +
        meterHtml + levelsHtml + why + note +
        (a.evidence_note ? '<div class="act-evidence">' + escapeHtml(a.evidence_note) + '</div>' : "") +
      '</div>'
    );
  }

  function technicalCardHtml(technical, verdictText, horizon) {
    var t = technical || {};
    // No usable indicators at all -> fall back to the plain verdict card.
    if (!isNum(t.rsi14) && !isNum(t.price)) {
      return verdictCardHtml("Technical", verdictText, t.verdict_detail || "Price data unavailable.");
    }
    var color = bucketColor(verdictText);
    var actionHtml = actionBoxHtml(t);

    // ---- Trend regime: price vs SMA50/SMA200 (the two trend lines) --------
    var p = isNum(t.price) ? Number(t.price) : null;
    var s50 = isNum(t.sma50) ? Number(t.sma50) : null;
    var s200 = isNum(t.sma200) ? Number(t.sma200) : null;
    var above50 = (p !== null && s50 !== null) ? p >= s50 : null;
    var above200 = (p !== null && s200 !== null) ? p >= s200 : null;
    var regime;
    if (above50 === true && above200 === true) regime = { label: "UPTREND", cls: "regime-up", dir: "up", arrow: "↑" };
    else if (above50 === false && above200 === false) regime = { label: "DOWNTREND", cls: "regime-down", dir: "down", arrow: "↓" };
    else if (above50 !== null || above200 !== null) regime = { label: "TRANSITION / NEUTRAL", cls: "regime-neutral", dir: "flat", arrow: "→" };
    else regime = { label: "—", cls: "regime-neutral", dir: "flat", arrow: "" };

    var evi = [];
    if (s50 !== null && s200 !== null) {
      var lead = (above50 === above200)
        ? (above50 ? "Price is above both averages" : "Price is below both averages")
        : "Price is between the averages";
      evi.push(lead + " (SMA50 " + fmtMoney(s50) + ", SMA200 " + fmtMoney(s200) + ")");
    } else if (s50 !== null) {
      evi.push("SMA50 " + fmtMoney(s50) + (above50 ? " above" : " below"));
    }
    if (t.golden_cross) evi.push("golden cross");
    else if (t.death_cross) evi.push("death cross");
    if (isNum(t.macd_hist)) evi.push("MACD " + (t.macd_hist > 0 ? "bullish" : t.macd_hist < 0 ? "bearish" : "flat"));
    if (t.obv_trend) evi.push("OBV " + (t.obv_trend === "up" ? "accumulation" : t.obv_trend === "down" ? "distribution" : "flat"));

    var regimeHtml =
      '<div class="trend-regime">' +
        '<span class="regime-badge ' + regime.cls + '">' + regime.arrow + ' ' + regime.label + '</span>' +
        (isNum(t.rsi14) ? '<span class="regime-sub">RSI ' + Math.round(Number(t.rsi14)) + '</span>' : '') +
      '</div>' +
      (evi.length ? '<div class="regime-evi">' + escapeHtml(evi.join(" · ")) + '</div>' : '');

    // ---- Trigger ladder: every S/R level as a "close above/below -> X" rule.
    var res = (t.resistance_levels || []).filter(function (z) { return isNum(z.price) || isNum(z.low); });
    var sup = (t.support_levels || []).filter(function (z) { return isNum(z.price) || isNum(z.low); });

    function absDist(lvl) { return isNum(lvl.dist_pct) ? Math.abs(Number(lvl.dist_pct)) : Infinity; }
    function nearestOf(list) {
      var best = null;
      list.forEach(function (l) { if (!best || absDist(l) < absDist(best)) best = l; });
      return best;
    }
    var nearRes = nearestOf(res), nearSup = nearestOf(sup);
    // The PRIMARY trigger is the one that flips the current regime: in a
    // downtrend/neutral that's the nearest resistance (a close above breaks the
    // downtrend); in an uptrend it's the nearest support (a close below ends it).
    // Falls back to the other side when the preferred side has no level.
    var nearest;
    if (regime.dir === "up") {
      nearest = nearSup ? { lvl: nearSup, side: "sup" } : (nearRes ? { lvl: nearRes, side: "res" } : null);
    } else {
      nearest = nearRes ? { lvl: nearRes, side: "res" } : (nearSup ? { lvl: nearSup, side: "sup" } : null);
    }

    var calloutHtml = "";
    if (nearest) {
      var nl = nearest.lvl;
      if (nearest.side === "res") {
        calloutHtml = '<div class="trend-callout callout-up"><span class="co-arrow">▲</span><div>' +
          'Next trigger: <b>daily close above ' + srRange(nl) + '</b> (' + techSigned(nl.dist_pct) + ') → ' +
          escapeHtml(resistanceEffect(nl, regime.dir)) + '.</div></div>';
      } else {
        calloutHtml = '<div class="trend-callout callout-down"><span class="co-arrow">▼</span><div>' +
          'Next trigger: <b>daily close below ' + srRange(nl) + '</b> (' + techSigned(nl.dist_pct) + ') → ' +
          escapeHtml(supportEffect(nl, regime.dir)) + '.</div></div>';
      }
    }

    function trigRow(side, lvl) {
      var s = srStrength(lvl);
      var isNear = nearest && nearest.side === side && nearest.lvl === lvl;
      var effect = side === "res" ? resistanceEffect(lvl, regime.dir) : supportEffect(lvl, regime.dir);
      var verb = side === "res" ? "Close above" : "Close below";
      var arrow = side === "res" ? "▲" : "▼";
      return '<div class="trig-row trig-' + (side === "res" ? "up" : "down") + (isNear ? " trig-nearest" : "") + '">' +
        '<span class="trig-arrow">' + arrow + '</span>' +
        '<span class="trig-price">' + srRange(lvl) + '</span>' +
        '<span class="sr-strength-badge ' + s.cls + '">' + s.label + '</span>' +
        '<span class="trig-rule"><b>' + verb + '</b> → ' + escapeHtml(effect) +
          ' <span class="trig-reason">(' + escapeHtml(srReason(lvl, false)) + ')</span></span>' +
        '<span class="trig-dist">' + techSigned(lvl.dist_pct) + '</span>' +
      '</div>';
    }

    var ladderHtml;
    if (res.length || sup.length) {
      var rows = res.slice().reverse().map(function (r) { return trigRow("res", r); });
      rows.push(
        '<div class="trig-row trig-now">' +
          '<span class="trig-arrow">◆</span>' +
          '<span class="trig-price">' + fmtMoney(t.price) + '</span>' +
          '<span class="trig-now-tag">NOW</span>' +
          '<span class="trig-rule" style="color:var(--muted)">' + escapeHtml(regime.label.toLowerCase()) + '</span>' +
        '</div>'
      );
      sup.forEach(function (s) { rows.push(trigRow("sup", s)); });
      ladderHtml = '<div class="trigger-ladder">' + rows.join("") + '</div>';
    } else {
      ladderHtml = '<div class="tech-empty">Not enough price history for trend triggers.</div>';
    }

    // ---- Collapsed detail: momentum synthesis, then Trend & Durum ----------
    var rsiHtml = "";
    if (isNum(t.rsi14)) {
      var pos = Math.max(0, Math.min(100, Number(t.rsi14)));
      rsiHtml =
        '<div class="rsi-row">' +
          '<span class="rsi-side">RSI 14</span>' +
          '<div class="rsi-gauge"><div class="rsi-gauge-marker" style="left:' + pos + '%;"></div></div>' +
          '<span class="rsi-val">' + Math.round(Number(t.rsi14)) + '</span>' +
        '</div>';
    }
    function tile(label, valHtml) {
      return '<div class="tech-stat"><div class="tech-stat-label">' + label +
        '</div><div class="tech-stat-val">' + valHtml + '</div></div>';
    }

    // Momentum row: only the return/MACD tiles -- trend, volatility and
    // volume tiles moved to the "Trend & Durum" subsection below so this
    // section can be read as a focused momentum readout.
    var momentumTiles = [
      tile("1M", techSigned(t.return_1m_pct)),
      tile("3M", techSigned(t.return_3m_pct)),
      tile("6M", techSigned(t.return_6m_pct)),
    ];
    if (isNum(t.macd_hist)) {
      var macdState = Number(t.macd_hist) > 0
        ? '<span class="tech-pos">Bullish</span>'
        : (Number(t.macd_hist) < 0 ? '<span class="tech-neg">Bearish</span>' : "Flat");
      if (t.macd_cross === "bullish") macdState += ' <span class="tech-pos">· ×↑</span>';
      else if (t.macd_cross === "bearish") macdState += ' <span class="tech-neg">· ×↓</span>';
      momentumTiles.push(tile("MACD", macdState));
    }

    var trendTiles = [
      tile("vs SMA50", techSigned(t.dist_sma50_pct)),
      tile("vs SMA200", techSigned(t.dist_sma200_pct)),
    ];
    if (isNum(t.range_position_pct)) trendTiles.push(tile("52W Range", Math.round(Number(t.range_position_pct)) + "%"));
    if (isNum(t.volatility_20d)) trendTiles.push(tile("Volatility", Math.round(Number(t.volatility_20d) * 100) + "%"));
    if (isNum(t.rel_volume)) {
      var rv = Number(t.rel_volume);
      var rvCls = rv >= 1.5 ? "tech-pos" : (rv < 0.7 ? "tech-neg" : "");
      trendTiles.push(tile("Rel Vol", '<span class="' + rvCls + '">' + rv.toFixed(1) + '×</span>'));
    }
    if (t.obv_trend) {
      var obvMap = {
        up: '<span class="tech-pos">Accum ↑</span>',
        down: '<span class="tech-neg">Distrib ↓</span>',
        flat: "Flat",
      };
      trendTiles.push(tile("OBV", obvMap[t.obv_trend] || escapeHtml(String(t.obv_trend))));
    }
    if (t.rsi_divergence) {
      trendTiles.push(tile("RSI Div", t.rsi_divergence === "bullish"
        ? '<span class="tech-pos">Bullish ↑</span>'
        : '<span class="tech-neg">Bearish ↓</span>'));
    }
    // ATR tile: volatility in price + % terms (swing stop-distance yardstick).
    if (isNum(t.atr14) && p !== null && p > 0) {
      var atrPct = Number(t.atr14) / p * 100;
      trendTiles.push(tile("ATR (14)", "$" + Number(t.atr14).toFixed(2) + " <span class=\"tech-stat-sub\">(" + atrPct.toFixed(1) + "%)</span>"));
    }
    // Relative strength vs benchmark (SPY): 3-month relative return, leader/laggard.
    var rsData = t.relative_strength;
    if (rsData && isNum(rsData.rs_3m_pct)) {
      var rs3 = Number(rsData.rs_3m_pct);
      var rsCls = rs3 > 0 ? "tech-pos" : (rs3 < 0 ? "tech-neg" : "");
      var rsSign = rs3 > 0 ? "+" : "";
      trendTiles.push(tile("vs " + escapeHtml(rsData.benchmark || "SPY") + " (3A)",
        '<span class="' + rsCls + '">' + rsSign + rs3.toFixed(1) + " pp</span>"));
    }
    var divNote = "";
    if (t.rsi_divergence_detail) {
      var d = t.rsi_divergence_detail;
      if (d.type === "bearish") {
        divNote = '<div class="tech-div-note tech-neg">Bearish RSI divergence: price made a higher high (' +
          fmtMoney(d.price_prev) + ' → ' + fmtMoney(d.price_last) + ') but RSI fell (' +
          d.rsi_prev + ' → ' + d.rsi_last + ') — momentum not confirming the high.</div>';
      } else {
        divNote = '<div class="tech-div-note tech-pos">Bullish RSI divergence: price made a lower low (' +
          fmtMoney(d.price_prev) + ' → ' + fmtMoney(d.price_last) + ') but RSI rose (' +
          d.rsi_prev + ' → ' + d.rsi_last + ') — selling pressure fading.</div>';
      }
    }
    var fibCaption = "";
    if (t.fibonacci && isNum(t.fibonacci.low) && isNum(t.fibonacci.high)) {
      fibCaption = '<div class="sr-fib-caption">Fib retracement of ' + fmtMoney(t.fibonacci.low) + '–' +
        fmtMoney(t.fibonacci.high) + ' (' + (t.fibonacci.direction === "up" ? "uptrend" : "downtrend") + ')</div>';
    }

    // Momentum synthesis: composite score (see computeMomentum) -> a badge
    // stating direction + acceleration, a directional meter, and a plain
    // sentence. When no signal at all is available, show the empty state
    // instead of badge/meter/sentence but still render the rest of the card.
    var momentum = computeMomentum(t);
    var reversal = computeReversal(t, momentum, horizon);
    var momSynthesisHtml;
    if (momentum) {
      var badgeLabel = momentum.dirLabel + (momentum.accelWord ? " · " + momentum.accelWord.toUpperCase() : "");
      momSynthesisHtml =
        '<div class="mom-badge-row"><span class="mom-badge ' + momentum.dirCls + '">' +
          momentum.arrow + ' ' + escapeHtml(badgeLabel) +
        '</span>' + reversalBadgeMarkerHtml(reversal) + squeezeBadgeHtml(t) + '</div>' +
        '<div class="mom-meter-row">' +
          '<span class="mom-ends">strong↓</span>' +
          '<div class="mom-meter"><div class="mom-meter-marker" style="left:' + momentum.meterPos + '%;"></div></div>' +
          '<span class="mom-ends">strong↑</span>' +
        '</div>' +
        (momentum.accelWord ? '<div class="mom-meter-cap">(' + escapeHtml(momentum.accelWord) + ')</div>' : "") +
        '<div class="mom-note">' + escapeHtml(momentumSentence(momentum)) + '</div>' +
        reversalBlockHtml(reversal);
    } else {
      momSynthesisHtml = '<div class="tech-empty">Not enough price history for momentum.</div>';
    }

    return (
      '<div class="card">' +
        '<div class="card-title">Technical</div>' +
        '<div class="verdict-card-body">' +
          (actionHtml
            // With an action, the RSI read is demoted to a context line: on its
            // own "OVERBOUGHT" reads like "sell", which it often isn't in a trend.
            ? actionHtml +
              '<div class="act-rsi">RSI state: ' + escapeHtml(verdictText || "—") +
                // result.technical_verdict usually already carries the detail.
                (t.verdict_detail && String(verdictText || "").indexOf(t.verdict_detail) < 0
                  ? " (" + escapeHtml(t.verdict_detail) + ")" : "") + '</div>'
            : '<div class="gauge"><div class="gauge-marker" style="left:' + GAUGE_POSITION[color] + '%;"></div></div>' +
              '<div><span class="badge badge-' + color + '">' + escapeHtml(verdictText || "—") + '</span></div>' +
              (t.verdict_detail ? '<div class="verdict-note">' + escapeHtml(t.verdict_detail) + '</div>' : "")) +
          regimeHtml +
          calloutHtml +
          ladderHtml +
          '<details class="tech-disclosure">' +
            '<summary class="tech-toggle">Momentum &amp; details</summary>' +
            '<div class="tech-details">' +
              '<div class="tech-section-title">Momentum</div>' +
              momSynthesisHtml +
              rsiHtml +
              '<div class="tech-stats">' + momentumTiles.join("") + '</div>' +
              '<div class="tech-section-title">Trend &amp; Status</div>' +
              '<div class="tech-stats">' + trendTiles.join("") + '</div>' +
              divNote +
              (fibCaption ? '<div class="tech-section-title">Level details</div>' + fibCaption : "") +
            '</div>' +
          '</details>' +
        '</div>' +
      '</div>'
    );
  }

  // ---- Sensitivity analysis card -------------------------------------------
  // Only rendered when result.valuation.sensitivity is present.
  function sensitivityTableHtml(sens) {
    if (!sens || !sens.matrix || !sens.matrix.length) return "";
    var growthValues = sens.growth_values || [];
    var drValues = sens.dr_values || [];
    var matrix = sens.matrix || [];
    var baseRow = Math.floor(matrix.length / 2);
    var baseCol = Math.floor((matrix[0] || []).length / 2);

    var headerCells = drValues.map(function (d) {
      return '<th class="sens-col-h">' + fmtPct(d) + '</th>';
    }).join("");

    var bodyRows = matrix.map(function (rowArr, ri) {
      var cells = (rowArr || []).map(function (val, ci) {
        var isBase = ri === baseRow && ci === baseCol;
        return '<td class="sens-cell' + (isBase ? " sens-base" : "") + '">' + fmtMoney(val) + '</td>';
      }).join("");
      var rowLabel = growthValues[ri] !== undefined ? fmtPct(growthValues[ri]) : "—";
      return '<tr><th class="sens-row-h">' + rowLabel + '</th>' + cells + '</tr>';
    }).join("");

    var uncertaintyTag = sens.high_uncertainty
      ? '<span class="uncertainty-tag">High Uncertainty</span>'
      : "";

    return (
      '<div class="card">' +
        '<div class="card-title">Sensitivity Analysis' + (uncertaintyTag ? " " + uncertaintyTag : "") + '</div>' +
        '<table class="sensitivity-table">' +
          '<thead><tr><th></th>' + headerCells + '</tr></thead>' +
          '<tbody>' + bodyRows + '</tbody>' +
        '</table>' +
        '<div class="sens-axis-note">Rows: growth · Columns: discount rate · center cell = base case</div>' +
      '</div>'
    );
  }

  // ---- Staged entry plan card ----------------------------------------------
  // Only rendered when result.entry_plan is present; an empty list means the
  // planning layer found no usable mechanical trigger levels (missing price
  // or structural reference levels), not an error -- degrades to a plain
  // sentence rather than an empty table.
  // Plan-level fields (target_reason/size_reason) are repeated identically
  // on every tranche dict (see planning.compute_entry_plan's docstring) --
  // read the first tranche that actually carries a non-empty value instead
  // of assuming index 0, so a partially-degraded older/hand-built payload
  // still surfaces them if any tranche has them.
  function firstTruthyField(entryPlan, key) {
    for (var i = 0; i < entryPlan.length; i++) {
      var v = entryPlan[i] && entryPlan[i][key];
      if (v) return v;
    }
    return "";
  }

  // The source label ("SMA50 pullback", "52-week high breakout", ...) only
  // lives inside the trigger sentence planning.py builds -- it is always the
  // text between the last "-- " and the closing parenthesis. Returns "" when
  // the sentence doesn't have that shape (older/hand-built payloads).
  function entrySourceLabel(trigger) {
    var m = /--\s*([^()]+?)\)[^)]*$/.exec(String(trigger || ""));
    return m ? m[1].charAt(0).toUpperCase() + m[1].slice(1) : "";
  }

  // Compact per-row note: the above-model note is a long sentence whose
  // headline is the part before the colon; the full text stays on hover.
  function entryShortNote(note) {
    var s = String(note || "");
    var i = s.indexOf(":");
    return i > 0 && i < 40 ? s.slice(0, i) : s;
  }

  // escapeHtml() leaves double quotes alone -- fine for text nodes, not for
  // a title="..." attribute value.
  function entryAttr(text) {
    return escapeHtml(text || "").replace(/"/g, "&quot;");
  }

  function entryPlanHtml(entryPlan, price) {
    var sub = '<div class="card-sub">Mechanical reference levels -- not a buy order or investment advice. ' +
      'Triggers use the daily close only; an intraday touch does not count.</div>';
    if (!entryPlan || entryPlan.length === 0) {
      return (
        '<div class="card"><div class="card-title">Staged Entry Plan</div>' + sub +
        '<p class="empty-note">Not enough price or structural reference levels (bear/base/bull range, 52-week low, SMA50/SMA200) to build a mechanical tranche plan.</p></div>'
      );
    }

    // Group header rows replace the per-row kind pill: breakout tranches
    // (close ABOVE, uptrend confirmation) always sit above the current
    // price and dip tranches (close BELOW, accumulation) below it, and the
    // list is already ordered by descending level -- so one header per
    // group plus a "price now" divider between them reads top-to-bottom
    // like a price ladder. Older payloads without t.kind get no headers.
    var groupLabels = {
      breakout: '<span class="entry-kind-tag entry-kind-breakout">▲ Buy on strength</span>daily close above the level',
      dip: '<span class="entry-kind-tag entry-kind-dip">▼ Buy on dips</span>daily close below the level'
    };
    var lastKind = null;
    var priceRowDone = !isNum(price);
    var priceRow = function () {
      priceRowDone = true;
      return '<tr class="entry-price-row"><td colspan="7">Price now ' + fmtMoney(price) + '</td></tr>';
    };

    var rows = entryPlan.map(function (t) {
      var zone = t.price_zone || {};
      var html = "";
      if (!priceRowDone && t.kind === "dip") html += priceRow();
      if (groupLabels[t.kind] && t.kind !== lastKind) {
        html += '<tr class="entry-group-row"><td colspan="7">' + groupLabels[t.kind] + '</td></tr>';
      }
      lastKind = t.kind;

      // The zone is a symmetric band around the trigger level, so its
      // midpoint is the level itself (to the cent).
      var level = (isNum(zone.lo) && isNum(zone.hi)) ? (Number(zone.lo) + Number(zone.hi)) / 2 : null;
      var op = t.kind === "breakout" ? "Close &gt; " : t.kind === "dip" ? "Close &lt; " : "";
      var source = entrySourceLabel(t.trigger);
      var levelLine = level !== null
        ? '<div class="entry-level">' + op + fmtMoney(level) + '</div>'
        : '<div>' + escapeHtml(t.trigger || "—") + '</div>';
      var sourceLine = source ? '<div class="entry-source">' + escapeHtml(source) + '</div>' : "";
      var noteLine = t.note
        ? '<div class="entry-inline-note" title="' + entryAttr(t.note) + '">' + escapeHtml(entryShortNote(t.note)) + '</div>'
        : "";

      html +=
        '<tr>' +
          '<td>' + escapeHtml(isNum(t.n) ? String(t.n) : "—") + '</td>' +
          '<td class="entry-trigger" title="' + entryAttr(t.trigger) + '">' + levelLine + sourceLine + noteLine + '</td>' +
          '<td>' + fmtMoney(zone.lo) + '–' + fmtMoney(zone.hi) + '</td>' +
          '<td>' + fmtRawPct(t.size_pct) + '</td>' +
          '<td>' + fmtMoney(t.invalidation) + '</td>' +
          '<td>' + fmtMoney(t.target) + '</td>' +
          '<td>' + (isNum(t.rr) ? Number(t.rr).toFixed(1) + ":1" : "—") + '</td>' +
        '</tr>';
      return html;
    }).join("");
    // All tranches were breakouts: the price sits below the whole ladder.
    if (!priceRowDone && lastKind === "breakout") rows += priceRow();

    // Every "why" sentence is either plan-level (target/size reasons,
    // identical on every tranche) or repeats per kind (the two stop rules)
    // or per source (trigger reasons) -- show each distinct one ONCE in a
    // collapsed explainer instead of under every row.
    var explain = [];
    var seenLevel = {};
    var levelItems = [];
    entryPlan.forEach(function (t) {
      var src = entrySourceLabel(t.trigger);
      if (t && t.trigger_reason && !seenLevel[t.trigger_reason]) {
        seenLevel[t.trigger_reason] = true;
        levelItems.push('<li>' + (src ? '<b>' + escapeHtml(src) + ':</b> ' : '') + escapeHtml(t.trigger_reason) + '</li>');
      }
    });
    if (levelItems.length) {
      explain.push('<div class="entry-legend-line"><b>Levels</b></div><ul class="entry-explain-list">' + levelItems.join("") + '</ul>');
    }
    var stopItems = [];
    ["breakout", "dip"].forEach(function (kind) {
      for (var i = 0; i < entryPlan.length; i++) {
        var t = entryPlan[i];
        if (t && t.kind === kind && t.invalidation_reason) {
          stopItems.push('<li><b>' + (kind === "dip" ? "Dip stop (shared)" : "Breakout stop (per row)") + ':</b> ' +
            escapeHtml(t.invalidation_reason) + '</li>');
          return;
        }
      }
    });
    if (stopItems.length) {
      explain.push('<div class="entry-legend-line"><b>Invalidation</b></div><ul class="entry-explain-list">' + stopItems.join("") + '</ul>');
    }
    var targetReason = firstTruthyField(entryPlan, "target_reason");
    var sizeReason = firstTruthyField(entryPlan, "size_reason");
    if (targetReason) {
      explain.push('<div class="entry-legend-line"><b>Target:</b> ' + escapeHtml(targetReason) + '</div>');
    }
    if (sizeReason) {
      explain.push('<div class="entry-legend-line"><b>Sizing:</b> ' + escapeHtml(sizeReason) + '</div>');
    }
    var legend = explain.length
      ? '<details class="tech-disclosure entry-explain">' +
          '<summary class="tech-toggle">How this plan works</summary>' +
          '<div class="entry-legend">' + explain.join("") + '</div>' +
        '</details>'
      : "";

    return (
      '<div class="card"><div class="card-title">Staged Entry Plan</div>' + sub +
        '<table class="sensitivity-table entry-plan-table">' +
          '<thead><tr>' +
            '<th>#</th><th>Trigger</th><th>Price Zone</th><th>Size</th>' +
            '<th>Invalidation</th><th>Target</th><th>R:R</th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
        legend +
      '</div>'
    );
  }

  // ---- Stop-adding signals card ---------------------------------------
  // An empty list is the common case (no signal active), not an error.
  function stopAddingHtml(stopAdding) {
    if (!stopAdding || stopAdding.length === 0) {
      return (
        '<div class="card"><div class="card-title">Stop-Adding Signals</div>' +
        '<p class="empty-note">No active stop-adding signal right now.</p></div>'
      );
    }
    var items = stopAdding.map(function (s) {
      return '<li>' + escapeHtml(s.message || s.code || "") + '</li>';
    }).join("");
    return (
      '<div class="card"><div class="card-title">Stop-Adding Signals</div>' +
        '<div class="alert-box"><ul>' + items + '</ul></div>' +
      '</div>'
    );
  }

  // ---- Thesis metric card ---------------------------------------------
  // result.thesis_metric is always a dict (never null) per planning.py, but
  // every field inside it may still be None -- degrades to "not available"
  // rather than "None"/blank.
  // Cycle-position bar: locate the anchor metric's latest value inside its
  // own multi-year trough->peak range (planning._compute_cycle_position).
  // cy is result.thesis_metric.cycle -- null when no series is available, in
  // which case the whole block is omitted (card falls back to value+trend).
  function thesisCycleHtml(cy) {
    if (!cy || !isNum(cy.position) || !isNum(cy.low) || !isNum(cy.high) || !isNum(cy.current)) return "";
    var isCyc = !!cy.is_cyclical;
    var markerPct = Math.max(0, Math.min(100, cy.position * 100));
    var fmtP = function (v) { return (v * 100).toFixed(1) + "%"; };
    var fyTag = function (fy) { return isNum(fy) ? " (FY" + fy + ")" : ""; };

    var label = isCyc ? "Cycle position" : "Historical range";
    var loEnd = isCyc ? "trough" : "lowest";
    var midEnd = isCyc ? "mid-cycle" : "mid";
    var hiEnd = isCyc ? "peak" : "highest";

    var where;
    if (cy.position >= 0.8) where = isCyc ? "near a cyclical peak" : "at the top of the range";
    else if (cy.position <= 0.2) where = isCyc ? "near a cycle trough" : "at the bottom of the range";
    else where = isCyc ? "around mid-cycle" : "in the middle of the range";

    var thinNote = (isNum(cy.n_years) && cy.n_years < 4)
      ? ' <span class="cycle-thin">(limited history: ' + cy.n_years + " years)</span>"
      : "";

    return (
      '<div class="cycle-block">' +
        '<div class="cycle-label">' + escapeHtml(label) + "</div>" +
        '<div class="cycle-track">' +
          '<div class="cycle-mid"></div>' +
          '<div class="cycle-marker" style="left:' + markerPct.toFixed(1) + '%"></div>' +
          '<div class="cycle-marker-label" style="left:' + markerPct.toFixed(1) + '%">' + fmtP(cy.current) + "</div>" +
        "</div>" +
        '<div class="cycle-ends">' +
          '<span class="cycle-end-lo">' + escapeHtml(loEnd) + " " + fmtP(cy.low) + escapeHtml(fyTag(cy.low_fy)) + "</span>" +
          "<span>" + escapeHtml(midEnd) + "</span>" +
          '<span class="cycle-end-hi">' + escapeHtml(hiEnd) + " " + fmtP(cy.high) + escapeHtml(fyTag(cy.high_fy)) + "</span>" +
        "</div>" +
        '<div class="cycle-caption">Current' + escapeHtml(fyTag(cy.current_fy)) + " " + fmtP(cy.current) +
          " — <b>" + escapeHtml(where) + "</b>" + thinNote +
        "</div>" +
      "</div>"
    );
  }

  // Level sparkline: the anchor metric's year-by-year trajectory
  // (cy.series, sorted ascending by fy). Complements the positional cycle
  // bar by showing the *shape* of the path (steady climb vs volatile vs a
  // recent turn). Self-contained inline SVG; latest point emphasized.
  function thesisSparklineHtml(cy) {
    if (!cy || !cy.series || !cy.series.length) return "";
    var pts = cy.series.filter(function (p) { return p && isNum(p.value); });
    if (pts.length < 2) return "";

    var vals = pts.map(function (p) { return p.value; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var W = 600, H = 60, padX = 8, padTop = 8, padBot = 18;
    var innerW = W - padX * 2, innerH = H - padTop - padBot;
    var n = pts.length;
    var xAt = function (i) { return padX + (innerW * i) / (n - 1); };
    var yAt = function (v) {
      if (hi <= lo) return padTop + innerH / 2;  // flat series -> centre line
      return padTop + innerH * (1 - (v - lo) / (hi - lo));
    };

    var path = pts.map(function (p, i) {
      return (i ? "L" : "M") + xAt(i).toFixed(1) + " " + yAt(p.value).toFixed(1);
    }).join(" ");
    var dots = pts.map(function (p, i) {
      var last = i === n - 1;
      var isLow = !last && isNum(cy.low_fy) && p.fy === cy.low_fy;
      var isHigh = !last && isNum(cy.high_fy) && p.fy === cy.high_fy;
      var cls = "spark-dot", r = 2;
      if (last) { cls += " spark-dot-last"; r = 3.2; }
      else if (isHigh) { cls += " spark-dot-peak"; r = 3; }
      else if (isLow) { cls += " spark-dot-trough"; r = 3.4; }
      return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(p.value).toFixed(1) +
        '" r="' + r + '" class="' + cls + '"/>';
    }).join("");
    var fyLabel = function (fy, xx, anchor) {
      return isNum(fy)
        ? '<text x="' + xx + '" y="' + (H - 4) + '" class="spark-fy" text-anchor="' + anchor + '">FY' + fy + "</text>"
        : "";
    };

    return (
      '<div class="spark-block">' +
        '<div class="spark-label">Annual trajectory</div>' +
        '<svg class="spark-svg" viewBox="0 0 ' + W + " " + H +
          '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Annual trajectory of the anchor metric">' +
          '<path d="' + path + '" class="spark-line"/>' +
          dots +
          fyLabel(pts[0].fy, padX, "start") +
          fyLabel(pts[n - 1].fy, W - padX, "end") +
        "</svg>" +
      "</div>"
    );
  }

  // Quarterly-invalidation check row (METODOLOJI.md Sec.7): the real,
  // code-checked rule that two consecutive against-thesis quarters
  // invalidate the day-1 thesis (previously only a sentence of text in
  // .thesis-rationale, now actually computed by planning._compute_
  // quarterly_check). One tick per quarter in qc.quarters, oldest to
  // newest, colored green when that quarter agreed with the anchor
  // direction, red when it fought it, muted/gray when the move fell inside
  // the noise deadband (or there was no prior quarter to compare against).
  // qc is result.thesis_metric.quarterly_check -- null when no cik/anchor/
  // series was available (see select_thesis_metric's docstring), in which
  // case the whole block is omitted, same degrade-gracefully rule as the
  // sparkline/cycle bar above it.
  function thesisQuarterlyCheckHtml(qc) {
    if (!qc || !Array.isArray(qc.quarters) || !qc.quarters.length) return "";
    var quarters = qc.quarters.filter(function (q) { return q && typeof q.period_end === "string"; });
    var n = quarters.length;
    if (!n) return "";

    var W = 600, H = 46, padX = 10, tickY = 20;
    var innerW = W - padX * 2;
    var xAt = function (i) { return n > 1 ? padX + (innerW * i) / (n - 1) : W / 2; };

    var ticks = quarters.map(function (q, i) {
      var at = q.against_thesis;
      var cls = "qcheck-tick-neutral", status = "nötr (eşik içinde)";
      if (at === true) { cls = "qcheck-tick-neg"; status = "teze aykırı"; }
      else if (at === false) { cls = "qcheck-tick-pos"; status = "tezle uyumlu"; }
      var last = i === n - 1;
      var r = last ? 5.5 : 4;
      var valueText = isNum(q.value) ? Number(q.value).toFixed(1) + "%" : "—";
      var titleText = (q.period_end || "—") + ": " + valueText + " (" + status + ")";
      return '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + tickY + '" r="' + r +
        '" class="' + cls + '"><title>' + escapeHtml(titleText) + "</title></circle>";
    }).join("");

    var baseline = n > 1
      ? '<line x1="' + xAt(0).toFixed(1) + '" y1="' + tickY + '" x2="' + xAt(n - 1).toFixed(1) +
        '" y2="' + tickY + '" class="qcheck-baseline"/>'
      : "";

    var periodLabel = function (q, xx, anchor) {
      return q && q.period_end
        ? '<text x="' + xx + '" y="' + (H - 4) + '" class="spark-fy" text-anchor="' + anchor + '">' +
          escapeHtml(q.period_end) + "</text>"
        : "";
    };

    var invalidatedPill = qc.invalidated
      ? ' <span class="badge badge-red qcheck-pill">TEZ GEÇERSİZ</span>'
      : "";

    var dirText = qc.anchor_direction === "improving" ? "iyileşme"
      : qc.anchor_direction === "deteriorating" ? "bozulma"
      : null;
    var fyText = isNum(qc.anchor_established_fy) ? " (FY" + qc.anchor_established_fy + "’den beri)" : "";
    var captionParts = [];
    if (dirText) captionParts.push("tez yönü: " + dirText + fyText);
    if (isNum(qc.consecutive_against) && qc.consecutive_against > 0) {
      captionParts.push("art arda " + qc.consecutive_against + " çeyrek teze aykırı");
    }
    var caption = captionParts.length
      ? '<div class="qcheck-caption">' + escapeHtml(captionParts.join(" · ")) + "</div>"
      : "";

    return (
      '<div class="qcheck-block">' +
        '<div class="qcheck-head">' +
          '<span class="qcheck-label">Quarterly check (§7)</span>' +
          invalidatedPill +
        "</div>" +
        '<svg class="spark-svg" viewBox="0 0 ' + W + " " + H +
          '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Quarterly thesis check">' +
          baseline + ticks +
          periodLabel(quarters[0], padX, "start") +
          periodLabel(quarters[n - 1], W - padX, "end") +
        "</svg>" +
        caption +
      "</div>"
    );
  }

  function thesisMetricHtml(tm) {
    if (!tm) return "";
    var name = tm.name ? escapeHtml(tm.name) : "Thesis Metric";
    var valueText = tm.latest_value ? escapeHtml(tm.latest_value) : "not available";
    var trendColor = "amber";
    if (tm.trend) {
      var s = String(tm.trend).toLowerCase();
      if (s.indexOf("improv") !== -1) trendColor = "green";
      else if (s.indexOf("deteriorat") !== -1) trendColor = "red";
    }
    var trendHtml = tm.trend
      ? ' <span class="badge badge-' + trendColor + '">' + escapeHtml(tm.trend) + '</span>'
      : "";
    var sparkHtml = thesisSparklineHtml(tm.cycle);
    var cycleHtml = thesisCycleHtml(tm.cycle);
    var qcHtml = thesisQuarterlyCheckHtml(tm.quarterly_check);
    var rationaleHtml = tm.rationale
      ? '<p class="thesis-rationale">' + escapeHtml(tm.rationale) + '</p>'
      : "";
    return (
      '<div class="card"><div class="card-title">Thesis Metric</div>' +
        '<p class="thesis-metric-line">' + name + ': <b>' + valueText + '</b>' + trendHtml + '</p>' +
        sparkHtml +
        cycleHtml +
        qcHtml +
        rationaleHtml +
      '</div>'
    );
  }

  // ---- Scenario returns card -----------------------------------------------
  // None-safe: a scenario with no computable return renders "—" rather than
  // "None". Returns "" (card omitted) when the field is entirely absent.
  function scenarioReturnsListHtml(scenarioReturns) {
    if (!scenarioReturns) return "";
    var rows = SCENARIO_ORDER.map(function (key) {
      var b = scenarioReturns[key] || {};
      var loOk = isNum(b.ret_lo_pct), hiOk = isNum(b.ret_hi_pct);
      var text = (loOk || hiOk) ? (fmtSignedPct(b.ret_lo_pct) + " to " + fmtSignedPct(b.ret_hi_pct)) : "—";
      return (
        '<div class="scen-ret-row">' +
          '<span class="scen-ret-name">' + escapeHtml(SCENARIO_LABEL[key] || key) + '</span>' +
          '<span class="scen-ret-value">' + text + '</span>' +
        '</div>'
      );
    }).join("");
    return (
      '<div class="card"><div class="card-title">Scenario Returns</div>' +
        '<div class="scenario-returns-list">' + rows + '</div>' +
      '</div>'
    );
  }

  // ---- Red flags card (only if flags exist) --------------------------------
  // ---- Distress/quality screens card (SPEC.md Sec.8g/8j/8k) --------------
  // Altman Z-score / Beneish M-score / Merton distance-to-default: all
  // ADVISORY ONLY -- never affect fair_value_range or the triangulation
  // confidence. One shared card (mirroring cli.py's _distress_flags_line)
  // reads whichever of valuation.altman_z/beneish_m/merton_dtd are present,
  // instead of one bespoke card per screen, so Beneish (Sec.8j) and Merton
  // (Sec.8k) need no new card wiring when they land -- only new keys read
  // here.
  var ALTMAN_ZONE_LABEL = { safe: "safe", grey: "grey", distress: "distress" };

  function distressFlagsCardHtml(valuation) {
    if (!valuation) return "";
    var items = [];

    var altman = valuation.altman_z;
    if (altman && isNum(altman.z_score)) {
      var zoneLabel = ALTMAN_ZONE_LABEL[altman.zone] || altman.zone || "—";
      items.push(
        '<li>Altman Z-score: ' + Number(altman.z_score).toFixed(2) +
          ' <span class="item-detail">(' + escapeHtml(zoneLabel) + ' zone)</span></li>'
      );
    }

    var beneish = valuation.beneish_m;
    if (beneish && isNum(beneish.m_score)) {
      var beneishDetail = (beneish.partial ? "partial score" : "") +
        (beneish.flag ? (beneish.partial ? "; " : "") + "possible manipulation signal" : "");
      items.push(
        '<li>Beneish M-score: ' + Number(beneish.m_score).toFixed(2) +
          (beneishDetail ? ' <span class="item-detail">(' + escapeHtml(beneishDetail) + ')</span>' : '') +
        '</li>'
      );
    }

    var merton = valuation.merton_dtd;
    if (merton && isNum(merton.distance_to_default)) {
      var pdText = isNum(merton.probability_of_default)
        ? "PD " + (merton.probability_of_default * 100).toFixed(1) + "%" : "";
      items.push(
        '<li>Merton distance-to-default: ' + Number(merton.distance_to_default).toFixed(2) +
          (pdText ? ' <span class="item-detail">(' + escapeHtml(pdText) + ')</span>' : '') +
        '</li>'
      );
    }
