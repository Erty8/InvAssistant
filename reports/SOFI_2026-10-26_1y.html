            // actually running) and start polling its progress anyway
            // (SWING_SPEC.md Sec.7 item 4).
            setScanMessage((res.json && res.json.error) || "A scan is already running.");
            startPolling();
            return;
          }
          if (!res.json || !res.json.ok) {
            setScanMessage((res.json && res.json.error) || "Could not start the scan.");
            var btnRetry = document.getElementById("swing-scan-btn");
            if (btnRetry) btnRetry.disabled = false;
            return;
          }
          state.running = true;
          state.runningIndex = res.json.index || state.index;
          state.runningIndexLabel = swingIndexLabel(state.runningIndex);
          state.total = res.json.total || 0;
          state.done = 0;
          updateHeaderCard();
          startPolling();
        })
        .catch(function (err) {
          setScanMessage("Network error: " + err.message);
          var btnErr = document.getElementById("swing-scan-btn");
          if (btnErr) btnErr.disabled = false;
        });
    }

    // A page (re)load might land mid-scan (another tab/user started it, or
    // this tab was refreshed while running) -- check once up front so the
    // button/progress line reflect reality instead of assuming idle.
    function checkInitialStatus() {
      fetch("/api/swing/status")
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (json && json.ok && json.running) {
            state.running = true;
            state.done = json.done || 0;
            state.total = json.total || 0;
            state.runningIndex = json.index || null;
            state.runningIndexLabel = json.index_label || null;
            updateHeaderCard();
            startPolling();
          }
        })
        .catch(function () { /* best-effort only -- baked payload still renders */ });
    }

    renderShell();
    checkInitialStatus();
  }

  // ===================================================================
  // Overview mode: portfolio-wide dashboard over every ticker that already
  // has a stored verdict (mode: "overview", built by
  // generator.render_overview_page / GET /overview via
  // sec_analyzer.screener.overview.build_overview()). No analysis runs
  // here and nothing is fetched -- `data.overview` is the complete payload,
  // baked once, and every control below is a pure client-side
  // filter/sort/re-render over it (unlike renderSwingMode, there is no
  // background scan to poll for).
  //
  // `data.overview` may be `{}` (empty database) -- every reader below
  // guards for that and the empty-state branch below returns before any of
  // it is touched.
  // ===================================================================

  // Continuous rgba tint for a heat-map tile from a -1..1 "heat" value (or a
  // raw fv_vs_price_pct percentage, scaled by the same +/-40% saturation
  // point overview.py's own `heat` field uses) -- negative -> red end,
  // positive -> green end, near zero -> a faint neutral tint. Returns null
  // for a genuinely unknown value so the caller can render a visibly
  // hatched tile instead of a solid (implicitly "fairly valued") one.
  function overviewHeatColor(value) {
    if (!isNum(value)) return null;
    var v = Math.max(-1, Math.min(1, Number(value)));
    var alpha = 0.08 + Math.abs(v) * 0.38;
    return v >= 0 ? hexToRgba("#4de082", alpha) : hexToRgba("#ffb4ab", alpha);
  }

  // One sector/route heat-map tile. `entry` is one item of overview.sectors
  // or overview.routes (same shape: {sector|sector_type, label, n,
  // median_fv_vs_price_pct, mean_heat, tickers, ...}). Prefers the
  // pre-computed mean_heat; falls back to the entry's own median gap
  // (scaled by the same 40%-saturation convention as overview.py) only when
  // mean_heat itself is null, so a tile is never left untinted just because
  // one of the two fields happens to be missing.
  function overviewTileHtml(entry) {
    entry = entry || {};
    var heatVal = isNum(entry.mean_heat)
      ? Number(entry.mean_heat)
      : (isNum(entry.median_fv_vs_price_pct) ? Number(entry.median_fv_vs_price_pct) / 40 : null);
    var bg = overviewHeatColor(heatVal);
    var cls = bg === null ? " ov-tile-unknown" : "";
    var style = bg !== null ? ' style="background:' + bg + ';"' : "";
    var tickers = Array.isArray(entry.tickers) ? entry.tickers.join(", ") : "";
    var titleAttr = tickers ? ' title="' + escapeHtml(tickers) + '"' : "";
    return (
      '<div class="ov-tile' + cls + '"' + style + titleAttr + '>' +
        '<div class="ov-tile-label">' + escapeHtml(safeText(entry.label)) + '</div>' +
        '<div class="ov-tile-n">' + (isNum(entry.n) ? Math.round(Number(entry.n)) : 0) + ' stocks</div>' +
        '<div class="ov-tile-pct">' +
          (isNum(entry.median_fv_vs_price_pct) ? fmtSignedPctTr(entry.median_fv_vs_price_pct) : "—") +
        '</div>' +
      '</div>'
    );
  }

  function overviewHeatSectionHtml(entries, titleText, emptyText) {
    if (!entries || !entries.length) {
      return (
        '<div class="card">' +
          '<div class="card-title">' + escapeHtml(titleText) + '</div>' +
          '<div class="empty-state">' + escapeHtml(emptyText) + '</div>' +
        '</div>'
      );
    }
    return (
      '<div class="card">' +
        '<div class="card-title">' + escapeHtml(titleText) + '</div>' +
        '<div class="ov-heatmap">' + entries.map(overviewTileHtml).join("") + '</div>' +
      '</div>'
    );
  }

  // "Upcoming Earnings" callout (overview.upcoming_earnings) -- omitted
  // entirely when the list is empty.
  function overviewEarningsCardHtml(rows) {
    if (!rows || !rows.length) return "";
    var items = rows.map(function (r) {
      r = r || {};
      var daysText = isNum(r.days_until_earnings) ? ' (in ' + Math.round(Number(r.days_until_earnings)) + ' days)' : "";
      return (
        '<li><strong>' + escapeHtml(safeText(r.ticker)) + '</strong> — ' + escapeHtml(safeText(r.catalyst_date)) + daysText +
          '<span class="item-detail">' + escapeHtml(safeText(r.fundamental_verdict)) + '</span>' +
        '</li>'
      );
    }).join("");
    return (
      '<div class="card">' +
        '<div class="card-title">Upcoming Earnings</div>' +
        '<div class="alert-box"><ul>' + items + '</ul></div>' +
      '</div>'
    );
  }

  // "Tension Between Verdict and Band Midpoint" callout (overview.drift,
  // per-row field verdict_drift). NOT an inconsistency/error -- both
  // fundamental_verdict and value_bucket read the very same stored price;
  // they simply ask different questions about it (fundamental_verdict:
  // where in the base band does the price sit; value_bucket: how far is
  // the band's MIDPOINT from the price). On a wide, low-confidence band
  // both can be correct at once, which is exactly what the base-band and
  // confidence columns below let the reader verify directly rather than
  // taking the claim on faith. Omitted entirely when the list is empty.
  function overviewDriftCardHtml(rows) {
    if (!rows || !rows.length) return "";
    var body = rows.map(function (r) {
      r = r || {};
      var band = (isNum(r.fv_base_lo) && isNum(r.fv_base_hi))
        ? swingFmtPrice(r.fv_base_lo) + "–" + swingFmtPrice(r.fv_base_hi)
        : "—";
      return (
        '<tr>' +
          '<td>' + escapeHtml(safeText(r.ticker)) + '</td>' +
          '<td><span class="badge badge-' + overviewVerdictColor(r.fundamental_verdict) + '">' +
            escapeHtml(safeText(r.fundamental_verdict)) + '</span></td>' +
          '<td><span class="badge badge-' + overviewBucketColor(r.value_bucket) + '">' +
            escapeHtml(overviewBucketLabel(r.value_bucket)) + '</span></td>' +
          '<td class="history-num">' + (isNum(r.fv_vs_price_pct) ? fmtSignedPctTr(r.fv_vs_price_pct) : "—") + '</td>' +
          '<td class="history-num">' + band + '</td>' +
          '<td>' + escapeHtml(safeText(r.confidence)) + '</td>' +
        '</tr>'
      );
    }).join("");
    return (
      '<div class="card">' +
        '<div class="card-title">Tension Between Verdict and Band Midpoint</div>' +
        '<div class="verdict-note" style="margin-bottom:10px;">' +
          'The verdict is FAIR because price sits inside the base band; the midpoint is far from price because the band is wide. ' +
          'Both readings can be correct at once — these rows flag wide-band, low-confidence names.' +
        '</div>' +
        '<div class="swing-table-wrap">' +
          '<table class="sensitivity-table history-table">' +
            '<thead><tr>' +
              '<th>Stock</th><th>Verdict</th><th>Current Bucket</th><th>Diff %</th><th>Base Band</th><th>Confidence</th>' +
            '</tr></thead>' +
            '<tbody>' + body + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>'
    );
  }

  // "Stale Analyses" callout (overview.stale) -- omitted entirely when the
  // list is empty. Names the stale_days threshold so the reader knows what
  // "stale" means here rather than taking it on faith.
  function overviewStaleCardHtml(rows, staleDays) {
    if (!rows || !rows.length) return "";
    var items = rows.map(function (r) {
      r = r || {};
      var ageText = isNum(r.age_days) ? 'analyzed ' + Math.round(Number(r.age_days)) + ' days ago' : "—";
      return (
        '<li><strong>' + escapeHtml(safeText(r.ticker)) + '</strong>' +
          '<span class="item-detail">' + escapeHtml(ageText) + '</span>' +
        '</li>'
      );
    }).join("");
    var thresholdText = isNum(staleDays) ? Math.round(Number(staleDays)) : "—";
    return (
      '<div class="card">' +
        '<div class="card-title">Stale Analyses</div>' +
        '<div class="verdict-note" style="margin-bottom:8px;">Analyses older than ' + thresholdText + ' days.</div>' +
        '<div class="alert-box"><ul>' + items + '</ul></div>' +
      '</div>'
    );
  }

  // Total, null-safe comparator for the overview table's sortable columns:
  // a missing value always sorts last regardless of direction, and ties
  // break on ticker (ascending, regardless of direction too) -- same
  // contract as renderSwingMode's own filteredSortedRows() sort, so the two
  // dashboards behave identically.
  function overviewCompareValues(a, b, key, dir) {
    var av = a ? a[key] : null;
    var bv = b ? b[key] : null;
    var aMissing = av === null || av === undefined || av === "";
    var bMissing = bv === null || bv === undefined || bv === "";
    if (aMissing && !bMissing) return 1;
    if (!aMissing && bMissing) return -1;
    if (!aMissing && !bMissing) {
      if (isNum(av) && isNum(bv)) {
        var an = Number(av), bn = Number(bv);
        if (an !== bn) return (an - bn) * dir;
      } else {
        var cmp = String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
        if (cmp !== 0) return cmp * dir;
      }
    }
    return String((a && a.ticker) || "").localeCompare(String((b && b.ticker) || ""));
  }

  // One <tr> per overview row (see generator.render_overview_page's
  // docstring for the full field list). Every field is optional --
  // isNum/safeText/escapeHtml guard each cell so a sparse row (null
  // sector, null fv_vs_price_pct, ...) never prints "null"/"undefined"/
  // "NaN". The ticker links out to the full verdict-card report in a new
  // tab, same convention as swingRowHtml.
  function overviewRowHtml(row) {
    row = row || {};
    var tickerUpper = String(row.ticker || "").trim().toUpperCase();
    var horizon = row.horizon || "1y";
    var href = "/report?ticker=" + encodeURIComponent(tickerUpper) + "&horizon=" + encodeURIComponent(horizon);
    var nameHtml = row.name ? '<div class="swing-name">' + escapeHtml(row.name) + '</div>' : "";

    var fvBand = (isNum(row.fv_base_lo) && isNum(row.fv_base_hi))
      ? swingFmtPrice(row.fv_base_lo) + "–" + swingFmtPrice(row.fv_base_hi) +
        (isNum(row.fv_base_mid) ? ' <span class="muted">(mid ' + swingFmtPrice(row.fv_base_mid) + ')</span>' : "")
      : "—";

    var pctCell = "—";
    if (isNum(row.fv_vs_price_pct)) {
      var pctCls = Number(row.fv_vs_price_pct) >= 0 ? "ov-pos" : "ov-neg";
      pctCell = '<span class="' + pctCls + '">' + fmtSignedPctTr(row.fv_vs_price_pct) + '</span>';
    }

    var earningsCell = isNum(row.days_until_earnings) ? Math.round(Number(row.days_until_earnings)) + "d" : "—";
    var catalystTitle = row.catalyst_date ? ' title="' + escapeHtml(String(row.catalyst_date)) + '"' : "";

    var ageCell = "—";
    if (isNum(row.age_days)) {
      var ageNum = Math.round(Number(row.age_days));
      ageCell = row.stale ? '<span class="ov-stale">⚠ ' + ageNum + 'd</span>' : ageNum + "d";
    }

    return (
      '<tr>' +
        '<td class="swing-ticker-cell">' +
          '<a class="swing-ticker-link" href="' + href + '" target="_blank" rel="noopener">' +
            escapeHtml(tickerUpper || "—") +
          '</a>' + nameHtml +
        '</td>' +
        '<td class="swing-left">' + escapeHtml(safeText(row.sector)) + '</td>' +
        '<td class="swing-left">' + escapeHtml(safeText(row.sector_type_label)) + '</td>' +
        '<td><span class="badge badge-' + overviewVerdictColor(row.fundamental_verdict) + '">' +
          escapeHtml(safeText(row.fundamental_verdict)) + '</span></td>' +
        '<td class="history-num">' + swingFmtPrice(row.price) + '</td>' +
        '<td class="history-num">' + fvBand + '</td>' +
        '<td class="history-num">' + pctCell + '</td>' +
        '<td><span class="badge badge-' + confidenceColor(row.confidence) + '">' +
          escapeHtml(safeText(row.confidence)) + '</span></td>' +
        '<td><span class="badge badge-' + momentumVerdictColor(row.momentum_verdict) + '">' +
          escapeHtml(safeText(row.momentum_verdict)) + '</span></td>' +
        '<td><span class="badge badge-' + overviewInsiderColor(row.insider_verdict) + '">' +
          escapeHtml(safeText(row.insider_verdict)) + '</span></td>' +
        '<td class="history-num"' + catalystTitle + '>' + earningsCell + '</td>' +
        '<td class="history-num">' + ageCell + '</td>' +
      '</tr>'
    );
  }

  function renderOverviewMode() {
    var pageEl = document.querySelector(".page");
    if (pageEl) pageEl.classList.add("page-wide");
    document.title = "Portfolio Overview · Verdict Terminal";

    topnavEl.innerHTML =
      '<div class="nav-inner">' +
        '<span class="brand">VERDICT</span>' +
        '<div class="nav-controls">' +
          '<button type="button" class="history-nav-btn" id="ov-search-btn">Search</button>' +
          '<button type="button" class="history-nav-btn" id="ov-swing-btn">Swing</button>' +
        '</div>' +
      '</div>';
    var searchBtn = document.getElementById("ov-search-btn");
    if (searchBtn) searchBtn.addEventListener("click", function () { window.location.href = "/"; });
    var swingBtn = document.getElementById("ov-swing-btn");
    if (swingBtn) swingBtn.addEventListener("click", function () { window.location.href = "/swing"; });

    var ov = (data.overview && typeof data.overview === "object") ? data.overview : {};
    var rows = Array.isArray(ov.rows) ? ov.rows : [];

    if (!rows.length) {
      bodyEl.innerHTML =
        '<div class="card"><div class="empty-state">' +
          'No stored analyses yet — analyze a stock, then come back here.' +
        '</div></div>';
      return;
    }

    // All client-side state for the table's filter/sort -- there is no
    // background job here (unlike swing's scan), so this never needs to
    // survive a poll tick; it only needs to survive a re-render of
    // #ov-table-container.
    var state = {
      rows: rows,
      sortKey: "fv_vs_price_pct",
      sortDir: "desc",
      textFilter: "",
      bucketFilter: "",
      staleOnly: false,
    };

    function headerStripHtml() {
      var counts = ov.bucket_counts || {};
      var chips = ["cheap", "fair", "expensive", "unknown"].map(function (b) {
        var n = isNum(counts[b]) ? Math.round(Number(counts[b])) : 0;
        return '<span class="badge badge-' + overviewBucketColor(b) + '">' + overviewBucketLabel(b) + ' ' + n + '</span>';
      }).join(" ");
      var medianHtml = "—";
      if (isNum(ov.median_fv_vs_price_pct)) {
        var medCls = Number(ov.median_fv_vs_price_pct) >= 0 ? "ov-pos" : "ov-neg";
        medianHtml = '<span class="' + medCls + '">' + fmtSignedPctTr(ov.median_fv_vs_price_pct) + '</span>';
      }
      return (
        '<div class="card">' +
          '<div class="header-row">' +
            '<div class="header-left">' +
              '<div class="ticker-line"><span class="ticker">Portfolio Overview</span></div>' +
              '<div class="source-note">' +
                (isNum(ov.count) ? Math.round(Number(ov.count)) : rows.length) + ' stocks · ' +
                escapeHtml(safeText(ov.today)) +
                ' · median fair-value / price gap: ' + medianHtml +
              '</div>' +
            '</div>' +
            '<div class="header-right">' + chips + '</div>' +
          '</div>' +
        '</div>'
      );
    }

    // key -> sort arrow, closes over `state` (mirrors swingSortArrow).
    function overviewSortArrow(key) {
      if (state.sortKey !== key) return "";
      return state.sortDir === "asc" ? " ▲" : " ▼";
    }

    function overviewHeaderCellHtml(key, label, extraClass) {
      return '<th class="sortable' + (extraClass ? " " + extraClass : "") + '" data-sort-key="' + key + '">' +
        escapeHtml(label) + overviewSortArrow(key) + '</th>';
    }

    function filteredSortedRows() {
      var filtered = (state.rows || []).filter(function (r) {
        if (!r) return false;
        if (state.bucketFilter && r.value_bucket !== state.bucketFilter) return false;
        if (state.staleOnly && !r.stale) return false;
        if (state.textFilter) {
          var hay = (String(r.ticker || "") + " " + String(r.name || "")).toLowerCase();
          if (hay.indexOf(state.textFilter) === -1) return false;
        }
        return true;
      });
      var key = state.sortKey;
      var dir = state.sortDir === "asc" ? 1 : -1;
      filtered.sort(function (a, b) { return overviewCompareValues(a, b, key, dir); });
      return filtered;
    }

    function filterBarHtml() {
      return (
        '<div class="swing-filter-bar" id="ov-filter-bar">' +
          '<label for="ov-text-filter">Stock / company</label>' +
          '<input type="text" class="swing-filter-input swing-text-input" id="ov-text-filter" ' +
            'placeholder="e.g. AAPL" autocomplete="off" />' +
          '<div class="horizon-toggle interactive" id="ov-bucket-toggle">' +
            '<button type="button" class="horizon-pill active" data-bucket="">All</button>' +
            '<button type="button" class="horizon-pill" data-bucket="cheap">Cheap</button>' +
            '<button type="button" class="horizon-pill" data-bucket="fair">Fair</button>' +
            '<button type="button" class="horizon-pill" data-bucket="expensive">Expensive</button>' +
          '</div>' +
          '<div class="horizon-toggle interactive" id="ov-stale-toggle">' +
            '<button type="button" class="horizon-pill" data-stale="1">Stale only</button>' +
          '</div>' +
          '<span class="swing-pager-count" id="ov-live-count"></span>' +
        '</div>'
      );
    }

    function wireFilterBar() {
      var textEl = document.getElementById("ov-text-filter");
      if (textEl) {
        textEl.addEventListener("input", function () {
          state.textFilter = textEl.value.trim().toLowerCase();
          renderTable();
        });
      }
      var bucketToggle = document.getElementById("ov-bucket-toggle");
      if (bucketToggle) {
        bucketToggle.addEventListener("click", function (e) {
          var btn = e.target.closest ? e.target.closest(".horizon-pill") : null;
          if (!btn) return;
          state.bucketFilter = btn.getAttribute("data-bucket") || "";
          bucketToggle.querySelectorAll(".horizon-pill").forEach(function (p) {
            p.classList.toggle("active", p === btn);
          });
          renderTable();
        });
      }
      var staleToggle = document.getElementById("ov-stale-toggle");
      if (staleToggle) {
        staleToggle.addEventListener("click", function (e) {
          var btn = e.target.closest ? e.target.closest(".horizon-pill") : null;
          if (!btn) return;
          state.staleOnly = !state.staleOnly;
          btn.classList.toggle("active", state.staleOnly);
          renderTable();
        });
      }
    }

    // Rebuilds only #ov-table-container -- never the filter bar -- so
    // sorting/filtering can't steal focus from (or clear the value of) the
    // text filter input (same contract as renderSwingMode's renderTable).
    function renderTable() {
      var container = document.getElementById("ov-table-container");
      if (!container) return;
      var allRows = filteredSortedRows();
      var countEl = document.getElementById("ov-live-count");
      if (countEl) countEl.textContent = allRows.length + " / " + state.rows.length + " stocks";
      if (!allRows.length) {
        container.innerHTML = '<div class="card"><div class="empty-state">No stocks match the filters.</div></div>';
        return;
      }
      container.innerHTML =
        '<div class="card">' +
          '<div class="swing-table-wrap">' +
            '<table class="sensitivity-table swing-table ov-table">' +
              '<thead><tr>' +
                overviewHeaderCellHtml("ticker", "Stock", "swing-left") +
                overviewHeaderCellHtml("sector", "Sector", "swing-left") +
                overviewHeaderCellHtml("sector_type_label", "Route", "swing-left") +
                overviewHeaderCellHtml("fundamental_verdict", "Verdict") +
                overviewHeaderCellHtml("price", "Price") +
                overviewHeaderCellHtml("fv_base_mid", "Fair Value (base)") +
                overviewHeaderCellHtml("fv_vs_price_pct", "Diff %") +
                overviewHeaderCellHtml("confidence", "Confidence") +
                overviewHeaderCellHtml("momentum_verdict", "Momentum") +
                overviewHeaderCellHtml("insider_verdict", "Insider") +
                overviewHeaderCellHtml("days_until_earnings", "Earnings") +
                overviewHeaderCellHtml("age_days", "Age") +
              '</tr></thead>' +
              '<tbody>' + allRows.map(overviewRowHtml).join("") + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>';
      var thead = container.querySelector("thead");
      if (thead) {
        thead.addEventListener("click", function (e) {
          var th = e.target.closest ? e.target.closest("th.sortable") : null;
          if (!th) return;
          var key = th.getAttribute("data-sort-key");
          if (state.sortKey === key) {
            state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          } else {
            state.sortKey = key;
            state.sortDir = "desc";
          }
          renderTable();
        });
      }
    }

    bodyEl.innerHTML =
      headerStripHtml() +
      overviewHeatSectionHtml(ov.sectors, "Sector Heat Map", "No sector data.") +
      overviewHeatSectionHtml(
        ov.routes,
        "Valuation Route (Mature / Cyclical / Financial / REIT / Growth)",
        "No valuation-route data."
      ) +
      cardGridHtml(
        overviewEarningsCardHtml(ov.upcoming_earnings),
        overviewDriftCardHtml(ov.drift),
        overviewStaleCardHtml(ov.stale, ov.stale_days)
      ) +
      filterBarHtml() +
      '<div id="ov-table-container"></div>' +
      '<div class="source-note" style="margin:10px 0 0;">Generated: ' + escapeHtml(swingFormatTimestamp(ov.generated_at)) + '</div>' +
      globalFooterHtml();

    wireFilterBar();
    renderTable();
  }

  function render() {
    if (data.mode === "search") {
      renderSearchMode();
    } else if (data.mode === "history") {
      renderHistoryMode();
    } else if (data.mode === "swing") {
      renderSwingMode();
    } else if (data.mode === "overview") {
      renderOverviewMode();
    } else {
      renderReportMode();
    }
  }

  render();
})();
</script>

</body>
</html>
